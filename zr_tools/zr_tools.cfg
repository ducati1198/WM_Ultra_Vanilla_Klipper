# ---------------------------------------------------------------------
#  Filament info per PHYSICAL toolhead (0-3)
#    T     = toolhead 0-3
#    COLOR = colour as decimal integer (0xRRGGBB), e.g. 16711680 = red
#    HEX   = colour as hex text RRGGBB (alternative to COLOR)
#    MAT   = material index (see ZR Tools panel list, 0 = Empty)
#    TEMP  = nozzle temperature for this filament
#  Example: _ZR_SET_TOOL_INFO T=1 HEX=FF0000 MAT=1 TEMP=215
# ---------------------------------------------------------------------
[gcode_macro _ZR_SET_TOOL_INFO]
description: Store filament colour/material/temperature for a toolhead
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        { action_raise_error("_ZR_SET_TOOL_INFO: T must be 0-3") }
    {% endif %}
    {% if params.COLOR is defined %}
        SAVE_VARIABLE VARIABLE=zr_t{t}_color VALUE={params.COLOR|int}
    {% elif params.HEX is defined %}
        SAVE_VARIABLE VARIABLE=zr_t{t}_color VALUE={params.HEX|string|int(0, 16)}
    {% endif %}
    {% if params.MAT is defined %}
        SAVE_VARIABLE VARIABLE=zr_t{t}_mat VALUE={params.MAT|int}
    {% endif %}
    {% if params.TEMP is defined %}
        SAVE_VARIABLE VARIABLE=zr_t{t}_temp VALUE={params.TEMP|int}
    {% endif %}

# ---------------------------------------------------------------------
#  Per-toolhead pressure advance
#    _ZR_SET_TOOL_PA T=0 PA=0.035   (saved, and applied now)
#  Uses WonderMaker's own variables t0_pressure_advance ... t3_...
# ---------------------------------------------------------------------
[gcode_macro _ZR_SET_TOOL_PA]
description: Save (and apply) pressure advance for a toolhead
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set pa = params.PA|default(-1)|float %}
    {% if t < 0 or t > 3 or pa < 0 or pa > 1 %}
        { action_raise_error("_ZR_SET_TOOL_PA: need T=0-3 and PA=0-1") }
    {% endif %}
    SAVE_VARIABLE VARIABLE=t{t}_pressure_advance VALUE={pa}
    SET_PRESSURE_ADVANCE EXTRUDER={'extruder' if t == 0 else 'extruder' ~ t} ADVANCE={pa}

# Called by the tool change (after the change_macros.cfg patch) instead
# of the hard-coded "ADVANCE=0.04". Falls back to 0.04 if nothing saved.
[gcode_macro _ZR_APPLY_TOOL_SETTINGS]
gcode:
    {% set t = params.T|int %}
    {% set v = printer.save_variables.variables %}
    {% set key = 't%d_pressure_advance' % t %}
    {% set pa = v[key]|float if key in v else 0.04 %}
    SET_PRESSURE_ADVANCE EXTRUDER={'extruder' if t == 0 else 'extruder' ~ t} ADVANCE={pa}

# ---------------------------------------------------------------------
#  Tool mapping: which PHYSICAL toolhead prints slicer tool T0-T3.
#  WonderMaker's T0-T3 macros already follow box_modify_t0..t3.
#  NOTE: WonderMaker resets the mapping to 1:1 at PRINT_END and
#  CANCEL_PRINT, so set it right before starting a print.
#    _ZR_MAP_TOOL T=0 H=2   -> slicer T0 prints with toolhead 2
# ---------------------------------------------------------------------
[gcode_macro _ZR_MAP_TOOL]
description: Map slicer tool T to physical toolhead H
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set h = params.H|default(-1)|int %}
    {% if t < 0 or t > 3 or h < 0 or h > 3 %}
        { action_raise_error("_ZR_MAP_TOOL: need T=0-3 and H=0-3") }
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("_ZR_MAP_TOOL: not allowed during a print") }
    {% endif %}
    SAVE_VARIABLE VARIABLE=box_modify_t{t} VALUE={h}
    SAVE_VARIABLE VARIABLE=box_modify_t{t}_backup VALUE={h}
    RESPOND MSG="Slicer T{t} -> toolhead {h}"

[gcode_macro _ZR_MAP_SET]
description: Set the whole tool map in one go. _ZR_MAP_SET MAP=0,2,1,3 (slicer T0..T3 -> toolhead numbers 0..3)
gcode:
    {% set parts = (params.MAP|default('')|string|trim).split(',') %}
    {% set ns = namespace(bad=0) %}
    {% if parts|length != 4 %}
        {% set ns.bad = 1 %}
    {% endif %}
    {% for x in parts %}
        {% if x|trim not in ['0','1','2','3'] %}
            {% set ns.bad = 1 %}
        {% endif %}
    {% endfor %}
    {% if ns.bad == 1 %}
        { action_raise_error("_ZR_MAP_SET: MAP must be four numbers 0 to 3, like 0,2,1,3") }
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("_ZR_MAP_SET: not allowed during a print") }
    {% endif %}
    {% for i in range(4) %}
        SAVE_VARIABLE VARIABLE=box_modify_t{i} VALUE={parts[i]|trim}
        SAVE_VARIABLE VARIABLE=box_modify_t{i}_backup VALUE={parts[i]|trim}
    {% endfor %}
    RESPOND MSG="Tool map set: T0->{parts[0]|trim|int + 1}, T1->{parts[1]|trim|int + 1}, T2->{parts[2]|trim|int + 1}, T3->{parts[3]|trim|int + 1} (toolhead numbers from 1)"

[gcode_macro _ZR_MAP_RESET]
description: Reset tool mapping to 1:1 (T0->0, T1->1, ...)
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("_ZR_MAP_RESET: not allowed during a print") }
    {% endif %}
    {% for i in range(4) %}
        SAVE_VARIABLE VARIABLE=box_modify_t{i} VALUE={i}
        SAVE_VARIABLE VARIABLE=box_modify_t{i}_backup VALUE={i}
    {% endfor %}
    RESPOND MSG="Tool mapping reset to 1:1"

# ---------------------------------------------------------------------
#  Chamber helpers (Ultra-S)
# ---------------------------------------------------------------------
[gcode_macro _ZR_CHAMBER]
description: Set chamber temperature (0 = off). _ZR_CHAMBER S=50
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 65 %}
        { action_raise_error("_ZR_CHAMBER: maximum 65C") }
    {% endif %}
    M141 S{s}

[gcode_macro _ZR_AIR_FILTER]
description: Air filter fan on/off. _ZR_AIR_FILTER S=1 (needs air_filter=1 in tmt1.ini)
gcode:
    SET_FAN_SPEED FAN=air_fan SPEED={1 if params.S|default(1)|int == 1 else 0}

# ---------------------------------------------------------------------
#  Load / unload a PHYSICAL toolhead at its saved filament temperature
#  (F-106, 2026-11-17). Settings in _WM_LOAD_SETTINGS below.
#    _ZR_LOAD T=0 [TEMP=...] [LENGTH=...]
#      Load button without an ACE: picks up the tool and heats it at the
#      wipe area. Then insert the filament: the head sensor starts
#      WonderMaker's own load (filament_insert_gcode: push, purge, wipe,
#      park), so there is only one purge (B-054). Filament already in the
#      head: pushes LENGTH at the purge location, wipes and parks.
#    _ZR_RETRACT T=0 [TEMP=...]   (touchscreen Unload without an ACE)
#    _ZR_UNLOAD T=0 [TEMP=...]    (Fluidd Unload without an ACE, same as _ZR_RETRACT)
#      Pick up the tool, form the tip at the purge location (_WM_UNLOAD_TIP),
#      wipe, park; then pull the filament out by hand.
#  ACE_WM_UNLOAD (rpi_ace.cfg) forms the tip with the same _WM_UNLOAD_TIP.
# ---------------------------------------------------------------------
[gcode_macro _WM_LOAD_SETTINGS]
description: Load and unload settings (_ZR_LOAD, _ZR_RETRACT, _ZR_UNLOAD, ACE_WM_UNLOAD)
# ---- temperature
variable_default_temp: 220          # C  used when no filament temperature is saved for the toolhead (zr_tN_temp, set with Edit filament)
variable_min_saved_temp: 180        # C  a saved temperature below this is ignored (default_temp is used)
# ---- load (_ZR_LOAD)
variable_load_push_mm: 50           # mm  pushed at the purge location when the filament is already in the head (then wipe, park)
variable_load_speed: 300            # mm/min  speed of that push (300 = 12 mm3/s with 1.75 mm filament)
variable_load_wait_s: 180           # s  how long the hot toolhead waits at the purge location for the filament; then heater off
# ---- unload tip forming (_WM_UNLOAD_TIP), the ACE unload recipe (U1)
variable_tip_push_mm: 0             # mm  push a little first to melt a short plug at the end of the filament (was 3: it made a thick blob, B-069)
variable_tip_push_speed: 400        # mm/min  speed of that push
variable_snap_mm: 20                # mm  fast pull that snaps the string off at the nozzle
variable_snap_speed: 58             # mm/s  speed of the snap
variable_cool_drop: 30               # C  after the snap the heater goes this much lower and the tip hardens before the pull (0 = off). B-069
variable_cool_s: 4                  # s  extra wait after that temperature is reached
variable_reshape_mm: 0              # mm  factory step: push the cooled tip back this far to round it (RETRACT_FILAMENT uses 10); 0 = off
variable_reshape_speed: 1000        # mm/min  speed of that push
variable_pull_mm: 45                # mm  slow pull out of the hotend
variable_pull_speed: 20             # mm/s  speed of the slow pull
gcode:
    RESPOND MSG="Load: saved temperature ({default_temp} C if none), {load_push_mm} mm push at {load_speed} mm/min when already loaded, waits {load_wait_s} s for the filament. Unload tip: push {tip_push_mm}, snap {snap_mm} at {snap_speed} mm/s, cool {cool_s} s, reshape {reshape_mm}, pull {pull_mm} at {pull_speed} mm/s"

[gcode_macro _WM_LOAD_TEMP]
description: Helper: RESPOND the temperature _ZR_LOAD / unload uses for toolhead T (saved filament temperature or default)
gcode:
    {% set s = printer["gcode_macro _WM_LOAD_SETTINGS"] %}
    {% set t = params.T|default(0)|int %}
    {% set v = printer.save_variables.variables %}
    {% set saved = v['zr_t%d_temp' % t]|default(0)|int %}
    RESPOND MSG="T{t}: {saved if saved >= s.min_saved_temp|int else s.default_temp} C ({'saved filament temperature' if saved >= s.min_saved_temp|int else 'nothing saved, default'})"

[gcode_macro _WM_GO_WIPE_HEAT]
description: Helper: toolhead T (on the carriage) goes to the purge location (_WM_PURGE_LOCATION) while it is still cold, then heats to S and waits (F-164: before it was the wipe area)
gcode:
    {% set t = params.T|int %}
    {% set temp = params.S|float %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% if "gcode_macro _WM_PURGE_LOCATION" in printer %}
        _WM_PURGE_LOCATION T={t} S={temp}
    {% else %}
        {% set wp = printer.save_variables.variables.wipe_position|default([-13.0, 240.0]) %}
        z_rise
        _WM_CAL_CLEARANCE
        SAVE_GCODE_STATE NAME=_wm_go_wipe
        G90
        G0 Y{wp[1]} F12000
        G0 X{wp[0]} F12000
        RESTORE_GCODE_STATE NAME=_wm_go_wipe
        SET_HEATER_TEMPERATURE HEATER={en} TARGET={temp}
        RESPOND MSG="T{t} heats to {temp|int} C at the wipe spot"
        TEMPERATURE_WAIT SENSOR={en} MINIMUM={temp - 2.5} MAXIMUM={temp + 2.5}
    {% endif %}

[gcode_macro _WM_UNLOAD_TIP]
description: Unload step: toolhead T (on the carriage) forms the filament tip at the purge location at S C and pulls it out of the hotend, wipes, heater off
gcode:
    {% set s = printer["gcode_macro _WM_LOAD_SETTINGS"] %}
    {% set t = params.T|int %}
    {% set temp = params.S|float %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    _WM_GO_WIPE_HEAT T={t} S={temp}
    RESPOND MSG="T{t|int + 1}: forming the tip and pulling the filament out of the hotend"
    SAVE_GCODE_STATE NAME=_wm_unload_tip
    M83
    G92 E0
    G1 E{s.tip_push_mm} F{s.tip_push_speed}
    M400
    G1 E-{s.snap_mm} F{s.snap_speed|float * 60}
    M400
    # the cooling target stays 5 C above min_extrude_temp of the extruder: below that Klipper refuses the pull (B-069: 170 C stopped an unload)
    {% set minx = printer.configfile.settings[en].min_extrude_temp|default(170)|float %}
    {% set ct = [temp - s.cool_drop|float, minx + 5]|max %}
    {% if s.cool_drop|float > 0 and ct < temp - 1 %}
        SET_HEATER_TEMPERATURE HEATER={en} TARGET={ct}
        RESPOND MSG="T{t|int + 1}: cooling the tip to {ct|int} C"
        TEMPERATURE_WAIT SENSOR={en} MAXIMUM={ct + 2}
    {% endif %}
    G4 P{(s.cool_s|float * 1000)|int}
    {% if s.reshape_mm|float > 0 %}
        G1 E{s.reshape_mm} F{s.reshape_speed}
        M400
    {% endif %}
    G1 E-{s.pull_mm} F{s.pull_speed|float * 60}
    M400
    RESTORE_GCODE_STATE NAME=_wm_unload_tip
    WIPE_NOZZLE
    SET_HEATER_TEMPERATURE HEATER={en} TARGET=0
    SET_STEPPER_ENABLE STEPPER={en} ENABLE=0

[gcode_macro _ZR_LOAD]
description: Load toolhead T without the ACE: picks it up and heats it at the purge location; then insert the filament (the head sensor loads it). Already loaded: short push, wipe, park
variable_waiting: -1                # the toolhead that waits hot for its filament (-1 = none)
gcode:
    {% set s = printer["gcode_macro _WM_LOAD_SETTINGS"] %}
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        { action_raise_error("_ZR_LOAD: T must be 0-3") }
    {% endif %}
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("_ZR_LOAD: not allowed while printing") }
    {% endif %}
    {% set v = printer.save_variables.variables %}
    {% set saved = v['zr_t%d_temp' % t]|default(0)|int %}
    {% set temp = params.TEMP|default(saved if saved >= s.min_saved_temp|int else s.default_temp)|float %}
    {% set length = params.LENGTH|default(s.load_push_mm)|float %}
    UPDATE_DELAYED_GCODE ID=_wm_zr_load_wait DURATION=0
    SET_GCODE_VARIABLE MACRO=_ZR_LOAD VARIABLE=waiting VALUE=-1
    RESPOND MSG="Load T{t|int + 1}: picking up the toolhead, heating it to {temp|int} C at the purge location"
    _CHANGE_TOOL T={t}
    _WM_GO_WIPE_HEAT T={t} S={temp}
    _WM_ZR_LOAD_GO T={t} S={temp} LENGTH={length}

[gcode_macro _WM_ZR_LOAD_GO]
description: The part of _ZR_LOAD after the heating (reads the head sensor now)
gcode:
    {% set s = printer["gcode_macro _WM_LOAD_SETTINGS"] %}
    {% set t = params.T|int %}
    {% set length = params.LENGTH|float %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% set key = "filament_switch_sensor filament%d" % t %}
    {% if key in printer and printer[key].filament_detected %}
        RESPOND MSG="Load T{t|int + 1}: filament already in the head, pushing {length|int} mm at the purge location"
        {% if "gcode_macro _WM_PURGE_ASSIST" in printer %}
            _WM_PURGE_ASSIST T={t} STATE=on
        {% endif %}
        SAVE_GCODE_STATE NAME=_wm_zr_load
        M83
        G1 E{length} F{s.load_speed}
        M400
        RESTORE_GCODE_STATE NAME=_wm_zr_load
        {% if "gcode_macro _WM_PURGE_ASSIST" in printer %}
            _WM_PURGE_ASSIST T={t} STATE=off
        {% endif %}
        WIPE_NOZZLE
        SET_HEATER_TEMPERATURE HEATER={en} TARGET=0
        SET_STEPPER_ENABLE STEPPER={en} ENABLE=0
        SET_GCODE_OFFSET X=0 Y=0 Z=0
        {% if printer.print_stats.state == "paused" and printer.save_variables.variables.wm_pause_tool|default(99)|int == t %}
            RESPOND MSG="T{t} is the print's tool: it stays on the carriage until RESUME"
        {% else %}
            PARK_CURRENT_TOOL
        {% endif %}
        RESPOND MSG="Load T{t|int + 1}: done"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_ZR_LOAD VARIABLE=waiting VALUE={t}
        UPDATE_DELAYED_GCODE ID=_wm_zr_load_wait DURATION={s.load_wait_s}
        RESPOND MSG="Toolhead {t + 1} (T{t}) is hot: insert the filament now, until you feel resistance. The printer loads it by itself. Heater off in {s.load_wait_s|int} s if nothing comes"
    {% endif %}

[delayed_gcode _wm_zr_load_wait]
gcode:
    {% set t = printer["gcode_macro _ZR_LOAD"].waiting|int %}
    {% if t >= 0 and t <= 3 %}
        SET_GCODE_VARIABLE MACRO=_ZR_LOAD VARIABLE=waiting VALUE=-1
        {% set key = "filament_switch_sensor filament%d" % t %}
        {% if printer.print_stats.state != "printing" and not (key in printer and printer[key].filament_detected) %}
            SET_HEATER_TEMPERATURE HEATER={"extruder" if t == 0 else "extruder%d" % t} TARGET=0
            RESPOND TYPE=error MSG="Load T{t|int + 1}: no filament came, heater off. Press Load again when you are ready"
        {% endif %}
    {% endif %}

[gcode_macro _ZR_RETRACT]
description: Unload toolhead T without an ACE: pick it up, form the tip at the purge location at its saved temperature, wipe, park; then pull the filament out
gcode:
    {% set s = printer["gcode_macro _WM_LOAD_SETTINGS"] %}
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        { action_raise_error("_ZR_RETRACT: T must be 0-3") }
    {% endif %}
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("_ZR_RETRACT: not allowed while printing") }
    {% endif %}
    {% set v = printer.save_variables.variables %}
    {% set saved = v['zr_t%d_temp' % t]|default(0)|int %}
    {% set temp = params.TEMP|default(saved if saved >= s.min_saved_temp|int else s.default_temp)|float %}
    UPDATE_DELAYED_GCODE ID=_wm_zr_load_wait DURATION=0
    SET_GCODE_VARIABLE MACRO=_ZR_LOAD VARIABLE=waiting VALUE=-1
    RESPOND MSG="Unload T{t|int + 1}: picking up the toolhead, tip at {temp|int} C at the purge location"
    _CHANGE_TOOL T={t}
    _WM_UNLOAD_TIP T={t} S={temp}
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% if printer.print_stats.state == "paused" and printer.save_variables.variables.wm_pause_tool|default(99)|int == t %}
        RESPOND MSG="T{t} is the print's tool: it stays on the carriage until RESUME"
    {% else %}
        PARK_CURRENT_TOOL
    {% endif %}
    RESPOND MSG="Unload T{t|int + 1}: done. You can pull the filament out now"

[gcode_macro _ZR_UNLOAD]
description: Unload toolhead T without an ACE (the same as _ZR_RETRACT): tip at the purge location at its saved temperature, park; then pull the filament out
gcode:
    _ZR_RETRACT {rawparams}
