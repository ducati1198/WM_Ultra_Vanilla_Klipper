#   _ZR_MAP_RESET                      - Reset tool mapping to 1:1 (T0->0, T1->1, ...)
#   _ZR_CHAMBER                        - Set chamber temperature (0 = off). _ZR_CHAMBER S=50
#   _ZR_AIR_FILTER                     - Air filter fan on/off. _ZR_AIR_FILTER S=1 (needs air_filter=1 in tmt1.ini)
#   _WM_LOAD_SETTINGS                  - Load and unload settings (_ZR_LOAD, _ZR_RETRACT, _ZR_UNLOAD, ACE_WM_UNLOAD)
#   _WM_LOAD_TEMP                      - Helper: RESPOND the temperature _ZR_LOAD / unload uses for toolhead T (saved filament temp
#   _WM_GO_WIPE_HEAT                   - Helper: toolhead T (on the carriage) goes to the purge location (_WM_PURGE_LOCATION) while
#   _WM_UNLOAD_TIP                     - Unload step: toolhead T (on the carriage) forms the filament tip at the purge location at 
#   _ZR_LOAD                           - Load toolhead T without the ACE: picks it up and heats it at the purge location; then inse
#   _WM_ZR_LOAD_GO                     - The part of _ZR_LOAD after the heating (reads the head sensor now)
#   _wm_zr_load_wait                  [delayed] 
#   _ZR_RETRACT                        - Unload toolhead T without an ACE: pick it up, form the tip at the purge location at its sa
#   _ZR_UNLOAD                         - Unload toolhead T without an ACE (the same as _ZR_RETRACT): tip at the purge location at i
