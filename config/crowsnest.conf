# crowsnest webcam config (fallback template, used only when scripts/wm_crowsnest.py is missing).
# Normally the installer writes this file with every option explained: ./installer.sh --webcam-setup
# Manual: https://github.com/mainsail-crew/crowsnest/blob/master/README.md
# Edit the device line for your camera:  ls /dev/v4l/by-id/
[crowsnest]
log_level: verbose
rollover_on_start: false
no_proxy: false

[cam 1]
mode: ustreamer
port: 8080
device: /dev/video0
resolution: 1280x720
max_fps: 15
