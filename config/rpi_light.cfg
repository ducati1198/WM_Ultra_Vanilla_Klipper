# Chamber light: one macro for the console, the Fluidd button, KlipperScreen and print start.
# The light itself is the Moonraker power device chamber_light (see moonraker.conf).

[gcode_macro WM_CHAMBER_LIGHT]
description: Chamber light STATE=on, off or toggle (default toggle)
gcode:
    {% set s = params.STATE|default("toggle")|lower %}
    {% if s not in ["on", "off", "toggle"] %}
        {action_raise_error("WM_CHAMBER_LIGHT: STATE must be on, off or toggle")}
    {% endif %}
    {action_call_remote_method("set_device_power", device="chamber_light", state=s)}
