# rpi_homing.cfg  -  homing (G28 through homing_override), the 5 mm bed drop before X/Y moves (z_rise), Z homing with the stall
# sensor, and the idle timeout. Until 2.9.0 these were in printer.cfg; printer.cfg keeps the hardware settings. Installed from rpi-cfg/.

[gcode_macro z_rise]
# Lowers the bed 5 mm before X/Y moves and homing (called by homing_override and by the tool lock/unlock and wipe macros).
# The factory version tested printer.query_endstops.last_query.z, a name that only WonderMaker's own Klipper has; upstream Klipper
# calls the endstop "stepper_z", so nothing ever happened. Skipped while a print runs or is paused, when the Z endstop is triggered
# or unknown, and when Z is already 5 mm or more above the bed.
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        # a print has its own Z clearance: nothing to do here, so the endstops are not asked either (it took about 0.3 s at every dock move)
    {% else %}
        QUERY_ENDSTOPS
        _z_rise_run
    {% endif %}

[gcode_macro _z_rise_run]
variable_drop: 5                 # mm
gcode:
    {% set st = printer.print_stats.state %}
    {% set q = printer.query_endstops.last_query %}
    {% set trig = q.stepper_z if q.stepper_z is defined else q.z %}
    {% if st == "printing" or st == "paused" %}
        # a print has its own Z clearance
    {% elif trig is not defined %}
        RESPOND MSG="Z drop skipped: the Z endstop state is not known"
    {% elif trig|int == 0 and printer.toolhead.position.z < drop|float %}
        {% if "z" in printer.toolhead.homed_axes %}
            G91
            G1 Z{drop} F1200
            G90
        {% else %}
            # Z is not homed: treat it as homed for this one move (only Z, not X and Y), then clear it again
            SET_KINEMATIC_POSITION Z={drop} SET_HOMED=Z
            G91
            G1 Z{drop} F1200
            G90
            SET_KINEMATIC_POSITION SET_HOMED=Z CLEAR_HOMED=Z
        {% endif %}
    {% endif %}

[homing_override]
axes: xyz
gcode:
    QUERY_ENDSTOPS
    z_rise

    {% set current_extruder = printer.save_variables.variables.current_extruder %}
    {% if current_extruder == 99 %}
        SAVE_VARIABLE VARIABLE=unlock_hall VALUE={printer.custom_hall.Raw}
    {% endif %}

    {% set targe_temprature = printer.extruder.target %}

    {% set hx = params.X is defined %}
    {% set hy = params.Y is defined %}
    {% set hz = params.Z is defined %}
    {% if (not hx and not hy and not hz) or (hx and hy and hz) %} #XYZ: plain G28, or all three axes named
        G28  Y
        G28  X
        M400
        Z_HOMING
    {% else %}
        # one or two axes named: Y first, then X, then Z where the tool head stands (G28 X Z and G28 Y Z homed nothing before)
        {% if hy %}
            G28 Y
        {% endif %}
        {% if hx %}
            G28 X
        {% endif %}
        {% if hz %}
            _LEVELING_TRIGGER_S
            M400
            STEPPER_DIAG_ENABLE CHIP="stepper_z"
            M118 Z-axis is homing
            G28 Z
            G1 Z7 F9600
            STEPPER_DIAG_DISABLE  CHIP="stepper_z"
            SET_GCODE_VARIABLE MACRO=Z_HOMING VARIABLE=z_raise VALUE=1
        {% endif %}
    {% endif %}
    G90

[gcode_macro Z_HOMING]
variable_z_raise: 1
gcode:
    {% set printer_state = printer.print_stats.state %}
        
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 MOVE=1

    SET_GCODE_VARIABLE MACRO=_CHANGE_TOOL VARIABLE=save_position VALUE=0
    T0

    {% if printer_state == "printing" or printer_state == "paused" %}
        M118 Nozzle is cleaning
        WIPE_NOZZLE
    {% endif %}
    G1 X150 Y135 F3000
    _LEVELING_TRIGGER_S
    M400
    STEPPER_DIAG_ENABLE CHIP="stepper_z"
    M118 Z-axis is homing
    G28 Z
    {% if z_raise == 1 %}
        G1 Z7 F9600
    {% endif %}
    STEPPER_DIAG_DISABLE CHIP="stepper_z"
    SET_GCODE_VARIABLE MACRO=Z_HOMING VARIABLE=z_raise VALUE=1

[idle_timeout]
timeout: 600
gcode:
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% set paused = printer.print_stats.state == "paused" or ("pause_resume" in printer and printer.pause_resume.is_paused) %}
    {% if paused %}
        # a paused print: only the nozzles go off. The bed keeps the part stuck, the chamber stays warm and the motors keep the position, so RESUME still works
        M118 Idle timeout during a pause, nozzle heaters off. Bed, chamber and motors stay on
        {% for i in range(thr_number) %}
            M104 T{i} S0
        {% endfor %}
    {% else %}
        M118 Idle timeout, all heaters and motors off
        TURN_OFF_HEATERS
        M84
    {% endif %}
