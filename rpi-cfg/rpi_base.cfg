        RESPOND MSG="Wipe while cooling: wipe limit reached, waiting for {w.en} to reach {w.target|int} C"
        TEMPERATURE_WAIT SENSOR={w.en} MAXIMUM={w.target}
    {% endif %}

[gcode_macro _WM_PURGE_DONE]
description: Closes the purge window: wipes the nozzle, switches the heater off and parks the tool that the window left hot
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_PURGE_SEL VARIABLE=open VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set hot = printer["gcode_macro _WM_PURGE_SEL"].hot|int %}
    {% if hot >= 0 and hot <= 3 and printer.print_stats.state == "paused" %}
        # paused print: wipe and heater off only. No park and no tool change: RESUME goes to the purge location and heats the tool again itself
        {% set en = "extruder" if hot == 0 else "extruder%d" % hot %}
        SET_GCODE_VARIABLE MACRO=_WM_PURGE_SEL VARIABLE=hot VALUE=-1
        _WM_PURGE_ASSIST T={hot} STATE=off
        WIPE_NOZZLE STYLE=SWITCH
        SET_HEATER_TEMPERATURE HEATER={en} TARGET=0
        RESPOND MSG="Purge closed: T{hot} wiped, heater off. RESUME heats it again"
    {% elif hot >= 0 and hot <= 3 and printer.print_stats.state != "printing" %}
        {% set en = "extruder" if hot == 0 else "extruder%d" % hot %}
        SET_GCODE_VARIABLE MACRO=_WM_PURGE_SEL VARIABLE=hot VALUE=-1
        _WM_PURGE_ASSIST T={hot} STATE=off
        WIPE_NOZZLE STYLE=SWITCH
        SET_HEATER_TEMPERATURE HEATER={en} TARGET=0
        # F-277: the nozzle is wiped slow/fast (part fan at 100%) until it is at 140 C or below, then the tool is parked
        _WM_WIPE_COOL EN={en} TARGET=140 WAIT=1
        SET_STEPPER_ENABLE STEPPER={en} ENABLE=0
        PARK_CURRENT_TOOL
        RESPOND MSG="Purge closed: T{hot} wiped, cooled with the part fan, parked"
    {% endif %}

[gcode_macro _WM_PURGE]
description: Purge filament from one tool, with or without an ACE: T=0..3 [S=temperature, 0 = the filament's own] [SPEED=mm/s, 5] [LEN=mm, 20] [FINISH=1: wipe, cool, park after; FINISH=0 (the prompt window): stay hot at the purge location and show the window again; FINISH=2 (the Fluidd card dialog): stay hot, no window]
gcode:
    {% set v = printer.save_variables.variables %}
    {% set t = params.T|default(0)|int %}
    {% set speed = params.SPEED|default(5)|float %}
    {% set length = params.LEN|default(20)|float %}
    {% set finish = params.FINISH|default(1)|int %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% set ckey = "zr_t%d_temp" % t %}
    {% set own = v[ckey]|int if ckey in v else 0 %}
    {% set temp = params.S|default(0)|float %}
    {% if temp <= 0 %}
        {% set temp = own if own > 0 else 210 %}
    {% endif %}
    {% set key = "filament_switch_sensor filament%d" % t %}
    {% set ace = ("gcode_macro _WM_ACE" in printer) and (("ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance) in printer) and (printer["ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance].connection_state == "connected") %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("_WM_PURGE: T must be 0 to 3")}
    {% elif printer.print_stats.state == "printing" %}
        {action_raise_error("_WM_PURGE: not while printing (pause the print first)")}
    {% elif printer.print_stats.state == "paused" and printer.save_variables.variables.current_extruder|default(99)|int != t %}
        {action_raise_error("_WM_PURGE: while paused only the tool on the carriage (T" ~ printer.save_variables.variables.current_extruder|default(99)|int ~ ") can be purged. Use Resume tool to change it")}
    {% elif printer["gcode_macro _WM_UNLOAD"].active %}
        {action_raise_error("_WM_PURGE: an unload is running")}
    {% elif ace and printer["gcode_macro _WM_ACE"].mode != "idle" %}
        {action_raise_error("_WM_PURGE: the ACE is busy (" ~ printer["gcode_macro _WM_ACE"].mode ~ ")")}
    {% elif temp < 170 or temp > (printer.configfile.settings[en].max_temp|float - 10) %}
        {action_raise_error("_WM_PURGE: temperature " ~ temp|int ~ " C is outside 170 to " ~ (printer.configfile.settings[en].max_temp|float - 10)|int)}
    {% elif speed < 1 or speed > 30 %}
        {action_raise_error("_WM_PURGE: speed must be 1 to 30 mm/s")}
    {% elif length < 1 or length > 300 %}
        {action_raise_error("_WM_PURGE: amount must be 1 to 300 mm")}
    {% elif key in printer and not printer[key].filament_detected %}
        {action_raise_error("_WM_PURGE: T" ~ t ~ " has no filament in its head")}
    {% endif %}
    # another tool was left hot by the window: finish it first (wipe, heater off, park)
    {% set hot = printer["gcode_macro _WM_PURGE_SEL"].hot|int %}
    {% if hot >= 0 and hot != t %}
        _WM_PURGE_DONE
    {% endif %}
    RESPOND MSG="Purge: T{t}, {length|int} mm at {speed|int} mm/s, {temp|int} C{', ACE feed assist' if ace else ''}"
    # not homed: home with the tool that is already on the carriage (_WM_ACE_HOME, as the ACE load does); with no tool on the carriage it falls
    # back to G28 (T0). Homed: no homing at all. The tool is read again in _WM_PURGE_GO (after the homing)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% if "gcode_macro _WM_ACE_HOME" in printer %}
            _WM_ACE_HOME T={t}
        {% else %}
            G28
        {% endif %}
    {% endif %}
    _WM_PURGE_GO T={t} S={temp} SPEED={speed} LEN={length} FINISH={finish}

[gcode_macro _WM_PURGE_GO]
description: The part of _WM_PURGE after the homing (pick the head up, heat at the purge location _WM_PURGE_LOCATION, push)
gcode:
    {% set t = params.T|int %}
    {% set temp = params.S|float %}
    {% set speed = params.SPEED|float %}
    {% set length = params.LEN|float %}
    {% set finish = params.FINISH|int %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% if printer.save_variables.variables.current_extruder|default(99)|int != t %}
        _CHANGE_TOOL T={t}
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER={en}
    _WM_PURGE_LOCATION T={t} S={temp}
    _WM_PURGE_ASSIST T={t} STATE=on
    M400
    SAVE_GCODE_STATE NAME=_wm_purge
    M83
    G92 E0
    G1 E{length} F{speed * 60}
    M400
    RESTORE_GCODE_STATE NAME=_wm_purge
    _WM_PURGE_ASSIST T={t} STATE=off
    SET_GCODE_VARIABLE MACRO=_WM_PURGE_SEL VARIABLE=hot VALUE={t}
    {% if finish == 1 %}
        _WM_PURGE_DONE
    {% elif finish == 2 %}
        RESPOND MSG="Purged {length|int} mm on T{t}. It stays hot at the purge location: purge again, or close the window to wipe, cool and park."
    {% else %}
        RESPOND MSG="Purged {length|int} mm on T{t}. It stays hot at the purge location: purge again, or press Cancel to wipe, cool and park."
        WM_PURGE_MENU
    {% endif %}


# ============================================================================
# WM_EXTRUDE_MENU (2026-11-27, first called WM_EXTRUDE): window to extrude or retract filament WITHOUT moving the head, homing or changing a tool.
# Choose tool, length, speed and temperature. F-268 rules: Extrude works on any tool that is OUT of its dock (it does not
# have to be on the carriage); Retract works on any tool, out of the dock or in its dock (heater is switched on in the dock).
# Same rules as the purge window: not while printing, while paused only the carriage tool, never during an unload or an
# ACE job. Close switches off the heater that the window switched on.
# ============================================================================
[gcode_macro _WM_EXTRUDE_SEL]
description: Choices of the Extrude window (tool, length, speed, temperature). t -1 = the tool on the carriage
variable_t: -1
variable_len: 20
variable_speed: 5
variable_temp: 230
variable_hot: -1          # tool whose heater the window switched on (-1 = none); Close switches it off again
gcode:
    RESPOND MSG="Extrude choices: T{t + 1}, {len} mm, {speed} mm/s, {temp} C"

[gcode_macro WM_EXTRUDE_MENU]
description: Extrude menu: window to extrude or retract filament without moving the head [T=0..3 picks the tool]: choose tool, length, speed and temperature (extrude not in the dock, retract also in the dock)
gcode:
    {% set ace = ("gcode_macro _WM_ACE" in printer) and (("ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance) in printer) and (printer["ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance].connection_state == "connected") %}
    {% if printer.print_stats.state == "printing" %}
        {action_raise_error("WM_EXTRUDE_MENU: not while printing (pause the print first)")}
    {% elif printer["gcode_macro _WM_UNLOAD"].active %}
        {action_raise_error("WM_EXTRUDE_MENU: an unload is running")}
    {% elif ace and printer["gcode_macro _WM_ACE"].mode != "idle" %}
        {action_raise_error("WM_EXTRUDE_MENU: the ACE is busy (" ~ printer["gcode_macro _WM_ACE"].mode ~ ")")}
    {% endif %}
    # T= (head 0..3, from the tool pages) pre-selects a tool; without it the window starts on the tool on the carriage
    {% set tp = params.T|default(-1)|int %}
    SET_GCODE_VARIABLE MACRO=_WM_EXTRUDE_SEL VARIABLE=t VALUE={tp if 0 <= tp <= 3 else -1}
    _WM_EXTRUDE_PROMPT

[gcode_macro _WM_EXTRUDE_PICK]
description: One button of the Extrude window: K=t|len|speed|temp V=value, then shows the window again
gcode:
    {% set k = params.K|default("")|lower %}
    {% set pv = params.V|default(0)|int %}
    {% set hot = printer["gcode_macro _WM_EXTRUDE_SEL"].hot|int %}
    {% if k == "t" and 0 <= pv <= 3 %}
        # another tool was heated by the window: its heater goes off
        {% if hot >= 0 and hot != pv %}
            SET_HEATER_TEMPERATURE HEATER={"extruder" if hot == 0 else "extruder%d" % hot} TARGET=0
            SET_GCODE_VARIABLE MACRO=_WM_EXTRUDE_SEL VARIABLE=hot VALUE=-1
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_EXTRUDE_SEL VARIABLE=t VALUE={pv}
    {% elif k in ["len", "speed", "temp"] %}
        SET_GCODE_VARIABLE MACRO=_WM_EXTRUDE_SEL VARIABLE={k} VALUE={pv}
    {% endif %}
    _WM_EXTRUDE_PROMPT

[gcode_macro _WM_EXTRUDE_NOTE]
description: The grey Extrude button was tapped for a tool in its dock: say why, then show the window again
gcode:
    RESPOND MSG="T{params.T|default(0)|int + 1} is in its dock. Extrude works only on a tool that is out of its dock. Retract is allowed"
    _WM_EXTRUDE_PROMPT

[gcode_macro _WM_EXTRUDE_PROMPT]
description: Prompt window of WM_EXTRUDE_MENU (and the buttons of that window)
gcode:
    {% set hall = printer.custom_hall.Raw|float %}
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% set ns = namespace(car=-1, e=[], pick=0) %}
    {% for i in range(4) %}
        {% if not printer['filament_switch_sensor docked%d' % i].filament_detected %}
            {% set ns.e = ns.e + [i] %}
        {% endif %}
    {% endfor %}
    {% if hall < 4700 %}
        {% if 0 <= cur <= 3 %}
            {% set ns.car = cur %}
        {% elif ns.e|length == 1 %}
            {% set ns.car = ns.e[0] %}
        {% endif %}
    {% endif %}
    {% set sel = printer["gcode_macro _WM_EXTRUDE_SEL"] %}
    {% set t = sel.t|int %}
    {% if t < 0 %}
        {% if ns.car >= 0 %}
            {% set t = ns.car %}
        {% else %}
            {% for i in range(3, -1, -1) %}
                {% if i not in ns.e %}
                    {% set ns.pick = i %}
                {% endif %}
            {% endfor %}
            {% set t = ns.pick %}
        {% endif %}
    {% endif %}
    {% set mode = 'car' if t == ns.car else ('away' if t in ns.e else 'dock') %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% set nz = printer[en].temperature|float|round(0)|int %}
    {% set go = "T=%d LEN=%d SPEED=%d TEMP=%d" % (t, sel.len|int, sel.speed|int, sel.temp|int) %}
    RESPOND TYPE=command MSG="action:prompt_begin Extrude / Retract"
    {% if mode == 'car' %}
        RESPOND TYPE=command MSG="action:prompt_text T{t + 1} is on the carriage. Nozzle {nz} C."
    {% elif mode == 'dock' %}
        RESPOND TYPE=command MSG="action:prompt_text T{t + 1} is in its dock. Nozzle {nz} C. Extrude is off here, retract works."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text T{t + 1} is out of its dock, not on the carriage. Nozzle {nz} C. Extrude and retract work."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text The head does not move. Filament comes out where the tool stands."
    RESPOND TYPE=command MSG="action:prompt_text Tool"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for i in range(4) %}
        RESPOND TYPE=command MSG="action:prompt_button T{i + 1}{' · carriage' if i == ns.car else (' · out' if i in ns.e else '')}|_WM_EXTRUDE_PICK K=t V={i}|{'primary' if t == i else 'secondary'}"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_text Length"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for lv in [5, 10, 20, 50, 100] %}
        RESPOND TYPE=command MSG="action:prompt_button {lv} mm|_WM_EXTRUDE_PICK K=len V={lv}|{'primary' if sel.len|int == lv else 'secondary'}"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_text Speed"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for sv in [2, 5, 10, 20] %}
        RESPOND TYPE=command MSG="action:prompt_button {sv} mm/s|_WM_EXTRUDE_PICK K=speed V={sv}|{'primary' if sel.speed|int == sv else 'secondary'}"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle temperature (a hotter nozzle is not cooled)"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for tv in [200, 230, 250] %}
        RESPOND TYPE=command MSG="action:prompt_button {tv} C|_WM_EXTRUDE_PICK K=temp V={tv}|{'primary' if sel.temp|int == tv else 'secondary'}"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% if mode != 'dock' %}
        RESPOND TYPE=command MSG="action:prompt_button Extrude {sel.len|int} mm|_WM_EXTRUDE_GO {go} DIR=extrude|success"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_button Extrude|_WM_EXTRUDE_NOTE T={t}|secondary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Retract {sel.len|int} mm|_WM_EXTRUDE_GO {go} DIR=retract|info"
    RESPOND TYPE=command MSG="action:prompt_button Cool|_WM_EXTRUDE_COOL T={t}|info"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|_WM_EXTRUDE_DONE|success"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_EXTRUDE_GO]
description: Extrude or retract on one tool without moving the head: T=0..3 DIR=extrude|retract [LEN=mm, 20] [SPEED=mm/s, 5] [TEMP=C, 230] [WIN=0: do not show the window again]
gcode:
    {% set hall = printer.custom_hall.Raw|float %}
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% set ns = namespace(car=-1, e=[]) %}
    {% for i in range(4) %}
        {% if not printer['filament_switch_sensor docked%d' % i].filament_detected %}
            {% set ns.e = ns.e + [i] %}
        {% endif %}
    {% endfor %}
    {% if hall < 4700 %}
        {% if 0 <= cur <= 3 %}
            {% set ns.car = cur %}
        {% elif ns.e|length == 1 %}
            {% set ns.car = ns.e[0] %}
        {% endif %}
    {% endif %}
    {% set t = params.T|default(-1)|int %}
    {% set dir = params.DIR|default("")|lower %}
    {% set length = params.LEN|default(20)|float %}
    {% set speed = params.SPEED|default(5)|float %}
    {% set temp = params.TEMP|default(230)|float %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% set key = "filament_switch_sensor filament%d" % t %}
    {% set ace = ("gcode_macro _WM_ACE" in printer) and (("ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance) in printer) and (printer["ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance].connection_state == "connected") %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("_WM_EXTRUDE_GO: T must be 0 to 3")}
    {% elif dir not in ["extrude", "retract"] %}
        {action_raise_error("_WM_EXTRUDE_GO: DIR must be extrude or retract")}
    {% elif printer.print_stats.state == "printing" %}
        {action_raise_error("_WM_EXTRUDE_GO: not while printing (pause the print first)")}
    {% elif printer.print_stats.state == "paused" and t != ns.car %}
        {action_raise_error("_WM_EXTRUDE_GO: while paused only the tool on the carriage can be used")}
    {% elif printer["gcode_macro _WM_UNLOAD"].active %}
        {action_raise_error("_WM_EXTRUDE_GO: an unload is running")}
    {% elif ace and printer["gcode_macro _WM_ACE"].mode != "idle" %}
        {action_raise_error("_WM_EXTRUDE_GO: the ACE is busy (" ~ printer["gcode_macro _WM_ACE"].mode ~ ")")}
    {% elif temp < 170 or temp > (printer.configfile.settings[en].max_temp|float - 10) %}
        {action_raise_error("_WM_EXTRUDE_GO: temperature " ~ temp|int ~ " C is outside 170 to " ~ (printer.configfile.settings[en].max_temp|float - 10)|int)}
    {% elif speed < 1 or speed > 30 %}
        {action_raise_error("_WM_EXTRUDE_GO: speed must be 1 to 30 mm/s")}
    {% elif length < 1 or length > 300 %}
        {action_raise_error("_WM_EXTRUDE_GO: length must be 1 to 300 mm")}
    {% elif dir == "extrude" and key in printer and not printer[key].filament_detected %}
        {action_raise_error("_WM_EXTRUDE_GO: T" ~ (t + 1) ~ " has no filament in its head")}
    {% elif dir == "extrude" and t != ns.car and t not in ns.e %}
        _WM_GATE_STOP TITLE="Extrude / Retract" L1="T{t + 1} is in its dock" L2="Extrude works only on a tool that is out of its dock." L3="Retract is allowed in the dock."
    {% else %}
        {% set need = [temp - 10, printer.configfile.settings[en].min_extrude_temp|float + 5]|max %}
        {% set prev = printer.toolhead.extruder %}
        RESPOND MSG="{'Extrude' if dir == 'extrude' else 'Retract'}: T{t + 1}, {length|int} mm at {speed|int} mm/s"
        # F-270: the heater is ALWAYS set to the chosen temperature (also when the nozzle is still warm from a Cool or an earlier move),
        # so it never cools down during the move; the macro waits only when the nozzle is below the needed temperature
        {% set cold = printer[en].temperature|float < need %}
        RESPOND MSG="T{t + 1} {'heats to' if cold else 'is warm (' ~ printer[en].temperature|float|round(0)|int ~ ' C), heater set to'} {temp|int} C"
        SET_HEATER_TEMPERATURE HEATER={en} TARGET={temp}
        SET_GCODE_VARIABLE MACRO=_WM_EXTRUDE_SEL VARIABLE=hot VALUE={t}
        {% if cold %}
            TEMPERATURE_WAIT SENSOR={en} MINIMUM={temp - 3}
        {% endif %}
        # F-275: feed assist ON for the tool that extrudes, and OFF for the tool that retracts (no assist pushing against a retract)
        {% if dir == "extrude" %}
            _WM_PURGE_ASSIST T={t} STATE=on
        {% else %}
            _WM_PURGE_ASSIST T={t} STATE=off
        {% endif %}
        ACTIVATE_EXTRUDER EXTRUDER={en}
        SAVE_GCODE_STATE NAME=_wm_extrude
        M83
        G92 E0
        G1 E{'' if dir == 'extrude' else '-'}{length} F{speed * 60}{' WMFORCE=1' if dir == 'extrude' else ''}
        M400
        RESTORE_GCODE_STATE NAME=_wm_extrude
        ACTIVATE_EXTRUDER EXTRUDER={prev}
        {% if dir == "extrude" %}
            _WM_PURGE_ASSIST T={t} STATE=off
        {% endif %}
        RESPOND MSG="{'Extruded' if dir == 'extrude' else 'Retracted'} {length|int} mm on T{t + 1}"
        {% if params.WIN|default(1)|int == 1 %}
            _WM_EXTRUDE_PROMPT
        {% endif %}
    {% endif %}

[gcode_macro _WM_EXTRUDE_COOL]
description: Cool button of the Extrude menu: heater of tool T=0..3 off (nothing moves). [WIN=0: do not show the Fluidd window again]
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("_WM_EXTRUDE_COOL: T must be 0 to 3")}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER={"extruder" if t == 0 else "extruder%d" % t} TARGET=0
        {% if printer["gcode_macro _WM_EXTRUDE_SEL"].hot|int == t %}
            SET_GCODE_VARIABLE MACRO=_WM_EXTRUDE_SEL VARIABLE=hot VALUE=-1
        {% endif %}
        RESPOND MSG="T{t + 1} heater off"
        {% if params.WIN|default(1)|int == 1 %}
            _WM_EXTRUDE_PROMPT
        {% endif %}
    {% endif %}

[gcode_macro _WM_EXTRUDE_DONE]
description: Closes the Extrude window and switches off the heater that the window switched on (nothing moves)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set hot = printer["gcode_macro _WM_EXTRUDE_SEL"].hot|int %}
    {% if hot >= 0 and hot <= 3 %}
        SET_GCODE_VARIABLE MACRO=_WM_EXTRUDE_SEL VARIABLE=hot VALUE=-1
        SET_HEATER_TEMPERATURE HEATER={"extruder" if hot == 0 else "extruder%d" % hot} TARGET=0
        RESPOND MSG="Extrude closed: T{hot + 1} heater off"
    {% endif %}

# ============================================================================
# F-166: WM_RESUME_TOOL - while PAUSED choose the tool that continues the print
# (new filament, new colour, or the print's tool is broken), temperature and purge length, then RESUME.
# The swap itself is _WM_ENDLESS_CONTINUE (rpi_endless.cfg): tool change from the park position, resume temperature given to
# the new head, print map (box_modify_tN_backup) pointed at it, RESUME, offset correction.
# ============================================================================
[gcode_macro _WM_RTOOL]
description: State of the Resume tool window (replacement tool, temperature offset, purge length)
variable_rep: -1
variable_dtemp: 0
variable_purge: 20
gcode:
    RESPOND MSG="state macro, nothing to run"

[gcode_macro _WM_RTOOL_RESET]
description: Helper: clears the Resume tool state
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=rep VALUE=-1
    SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=dtemp VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=purge VALUE=20

[gcode_macro WM_RESUME_TOOL]
description: While PAUSED: choose the tool that continues the print (other colour, other spool, broken tool), its temperature and purge length, then resume
gcode:
    {% if printer.print_stats.state != "paused" %}
        {action_raise_error("Resume tool: the print must be paused. (Changing the tool during a print comes later.)")}
    {% elif printer.save_variables.variables.wm_pause_tool|default(99)|int not in [0, 1, 2, 3] %}
        {action_raise_error("Resume tool: the print was paused with no tool on the carriage. Load and pick a tool first, or use RESUME")}
    {% else %}
        _WM_RTOOL_RESET
        _WM_RTOOL_SHOW1
    {% endif %}

[gcode_macro _WM_RTOOL_SHOW1]
description: Helper: Resume tool window 1 (which tool continues the print)
gcode:
    {% set pt = printer.save_variables.variables.wm_pause_tool|default(99)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin The print was paused with T{pt + 1}"
    RESPOND TYPE=command MSG="action:prompt_text Pick the tool that finishes the print."
    RESPOND TYPE=command MSG="action:prompt_text A tool with no filament is grey: tap it and the Load window opens for that tool."
    {% for g in [[0, 1], [2, 3]] %}
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for i in g %}
            {% set sname = "filament_switch_sensor filament%d" % i %}
            {% set head = printer[sname].filament_detected if sname in printer else False %}
            {% set away = (not (printer['filament_switch_sensor docked%d' % i].filament_detected or (printer.custom_hall.Raw|float < 4700 and printer.save_variables.variables.current_extruder|default(99)|int == i))) %}
            {% set lab = "T" ~ (i + 1) ~ (" print tool" if pt == i else "") ~ (" · not in its dock" if away else (" · ready" if head else " · no filament · Load >")) %}
            RESPOND TYPE=command MSG="action:prompt_button {lab}|_WM_RTOOL_PICK T={i}|{'primary' if head and not away else 'secondary'}"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button What it does|_WM_RTOOL_INFO|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_RTOOL_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_RTOOL_INFO]
description: What it does window of WM_RESUME_TOOL (F-243)
gcode:
    _WM_WIN_INFO TITLE="Resume tool" L1="Use it while a print is paused to let another tool finish the print: other colour, other spool or a broken tool." L2="Window 1: pick the tool. A tool with no filament is grey, tap it and the Load window opens." L3="Window 2: temperature and purge length, then the print resumes." BACK="_WM_RTOOL_SHOW1"

[gcode_macro _WM_RTOOL_CLOSE]
description: Helper: closes the Resume tool window
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _WM_RTOOL_RESET

[gcode_macro _WM_RTOOL_PICK]
description: Helper: a tool button of Resume tool window 1 (refuses an empty head), then window 2
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set sname = "filament_switch_sensor filament%d" % t %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("Resume tool: T must be 0-3")}
    {% elif (not (printer['filament_switch_sensor docked%d' % t].filament_detected or (printer.custom_hall.Raw|float < 4700 and printer.save_variables.variables.current_extruder|default(99)|int == t))) %}
        RESPOND MSG="T{t + 1} is not in its dock. Put it into its dock first, then tap it again"
        _WM_RTOOL_SHOW1
    {% elif sname not in printer or printer[sname].filament_detected != True %}
        SET_GCODE_VARIABLE MACRO=_WM_LOAD VARIABLE=sel VALUE='"{t}"'
        RESPOND TYPE=command MSG="T{t + 1} has no filament. The Load window is open for it: load it, then choose it again in Resume tool."
        _WM_LOAD_SHOW
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=rep VALUE={t}
        _WM_RTOOL_SHOW2
    {% endif %}

[gcode_macro _WM_RTOOL_SHOW2]
description: Helper: Resume tool window 2 (confirm: temperature, purge length)
gcode:
    {% set r = printer["gcode_macro _WM_RTOOL"] %}
    {% set pt = printer.save_variables.variables.wm_pause_tool|default(99)|int %}
    {% set base = printer["gcode_macro RESUME"].get("resume_temperature" ~ pt, 0)|float %}
    {% set temp = (base + r.dtemp|float)|int %}
    {% if r.rep == pt %}
        RESPOND TYPE=command MSG="action:prompt_begin T{r.rep + 1} continues the print"
        RESPOND TYPE=command MSG="action:prompt_text T{r.rep + 1} is the tool the print was paused with."
        RESPOND TYPE=command MSG="action:prompt_text It stays on the carriage, heats, purges and wipes, then the print continues with it."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin T{r.rep + 1} takes over from T{pt + 1}"
        RESPOND TYPE=command MSG="action:prompt_text T{pt + 1} goes back to its dock and is not used again in this print."
        RESPOND TYPE=command MSG="action:prompt_text T{r.rep + 1} heats, purges and wipes, then continues where T{pt + 1} stopped."
        RESPOND TYPE=command MSG="action:prompt_text T{r.rep + 1} finishes the print, including the parts meant for T{pt + 1}."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Temperature {temp} C (the print had {base|int} C). Purge {r.purge|int} mm."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Temp -5|_WM_RTOOL_TEMP D=-5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Temp +5|_WM_RTOOL_TEMP D=5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for l in [20, 40, 60, 100] %}
        RESPOND TYPE=command MSG="action:prompt_button Purge {l} mm|_WM_RTOOL_PURGE L={l}|{'primary' if r.purge|int == l else 'secondary'}"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume with T{r.rep + 1}|_WM_RTOOL_CONFIRM|success"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_RTOOL_SHOW1|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_RTOOL_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_RTOOL_CONFIRM]
description: Helper: Resume tool window 3 (F-204: what will happen, Do you confirm?, Resume / Back)
gcode:
    {% set r = printer["gcode_macro _WM_RTOOL"] %}
    {% set pt = printer.save_variables.variables.wm_pause_tool|default(99)|int %}
    {% set base = printer["gcode_macro RESUME"].get("resume_temperature" ~ pt, 0)|float %}
    {% set temp = (base + r.dtemp|float)|int %}
    {% set n = r.rep + 1 %}
    {% if printer.print_stats.state != "paused" or r.rep < 0 %}
        {action_raise_error("Resume tool: the print must be paused and a tool chosen")}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Resume the print with T{n}?"
        RESPOND TYPE=command MSG="action:prompt_text What will happen:"
        {% if r.rep == pt %}
            RESPOND TYPE=command MSG="action:prompt_text 1. T{n} stays on the carriage and heats to {temp} C (the print had {base|int} C)."
            RESPOND TYPE=command MSG="action:prompt_text 2. T{n} purges and the nozzle is wiped."
            RESPOND TYPE=command MSG="action:prompt_text 3. The print continues with T{n}."
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_text 1. T{pt + 1} goes back to its dock, T{n} is picked up and heats to {temp} C (the print had {base|int} C)."
            RESPOND TYPE=command MSG="action:prompt_text 2. T{n} purges and the nozzle is wiped."
            RESPOND TYPE=command MSG="action:prompt_text 3. The print continues with T{n} where T{pt + 1} stopped, including the parts of T{pt + 1}."
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_text Check that the filament in T{n} is the one you want."
        RESPOND TYPE=command MSG="action:prompt_footer_button Resume|_WM_RESUME_TOOL_GO|success"
        RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_RTOOL_SHOW2|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _WM_RTOOL_TEMP]
description: Helper: temperature -5 / +5 of Resume tool window 2
gcode:
    {% set d = params.D|default(0)|int %}
    {% set pt = printer.save_variables.variables.wm_pause_tool|default(99)|int %}
    {% set base = printer["gcode_macro RESUME"].get("resume_temperature" ~ pt, 0)|float %}
    {% set nd = printer["gcode_macro _WM_RTOOL"].dtemp|float + d %}
    {% if base + nd < 170 or base + nd > 300 %}
        RESPOND TYPE=error MSG="Resume tool: the temperature must stay between 170 and 300 C"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=dtemp VALUE={nd}
    {% endif %}
    _WM_RTOOL_SHOW2

[gcode_macro _WM_RTOOL_PURGE]
description: Helper: purge length button of Resume tool window 2
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=purge VALUE={params.L|default(20)|int}
    _WM_RTOOL_SHOW2

[gcode_macro _WM_RESUME_TOOL_GO]
description: _WM_RESUME_TOOL_GO REP= TEMP= PURGE= - while PAUSED: continue the print with tool REP (TEMP C, PURGE mm). No parameters = the choice of the Resume tool window. Used by Fluidd and KlipperScreen
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set pt = sv.wm_pause_tool|default(99)|int %}
    {% set r = printer["gcode_macro _WM_RTOOL"] %}
    {% set rep = params.REP|default(r.rep)|int %}
    {% set base = printer["gcode_macro RESUME"].get("resume_temperature" ~ pt, 0)|float %}
    {% set temp = params.TEMP|default(base + r.dtemp|float)|float %}
    {% set purge = params.PURGE|default(r.purge)|int %}
    {% set sname = "filament_switch_sensor filament%d" % rep %}
    {% set ns = namespace(n=0) %}
    {% for L in range(4) %}
        {% if sv.get('box_modify_t' ~ L ~ '_backup', L)|int == pt %}
            {% set ns.n = ns.n + 1 %}
        {% endif %}
    {% endfor %}
    {% if printer.print_stats.state != "paused" %}
        {action_raise_error("Resume tool: the print must be paused")}
    {% elif rep != pt and ns.n == 0 %}
        {action_raise_error("Resume tool: no tool of this print uses head " ~ (pt + 1) ~ " (the print's tool map does not know it). Nothing was changed")}
    {% elif pt < 0 or pt > 3 %}
        {action_raise_error("Resume tool: the print's tool is not known (the print was not paused with PAUSE). Use RESUME")}
    {% elif rep < 0 or rep > 3 %}
        {action_raise_error("Resume tool: choose a tool (REP=0-3, REP 0 is toolhead 1)")}
    {% elif sname not in printer or printer[sname].filament_detected != True %}
        {action_raise_error("Resume tool: T" ~ (rep + 1) ~ " has no filament in its head. Load it first, then try again")}
    {% elif temp < 170 or temp > 300 %}
        {action_raise_error("Resume tool: the temperature must be 170-300 C")}
    {% elif purge < 10 or purge > 150 %}
        {action_raise_error("Resume tool: the purge length must be 10-150 mm")}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND MSG="Resume tool: the print continues with T{rep + 1} ({temp|int} C, purge {purge} mm){' (was T' ~ (pt + 1) ~ ')' if rep != pt else ''}"
        SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=purge VALUE={purge}
        # the old tool's resume temperature is the one _WM_ENDLESS_CONTINUE gives to the new head
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature{pt} VALUE={temp}
        {% if rep == pt %}
            RESUME
        {% else %}
            {% if sv.current_extruder|default(99)|int != pt %}
                RESPOND MSG="Resume tool: T{pt} is not on the carriage. Picking it up first, then swapping to T{rep}"
                _CHANGE_TOOL T={pt}
            {% endif %}
            # RESUME (inside _WM_ENDLESS_CONTINUE) checks and picks up wm_pause_tool: it must already be the NEW tool
            SAVE_VARIABLE VARIABLE=wm_pause_tool VALUE={rep}
            _WM_ENDLESS_CONTINUE FROM={pt} TO={rep}
        {% endif %}
        _WM_RTOOL_RESET
    {% endif %}

# ============================================================================
# F-206: Fluidd switch Purge_Line_Every_Toolhead (same pattern as Bed_Warp_Stabilisation).
# ON (default) = every toolhead the print uses draws its own purge line at the print start (F-190).
# OFF = only the first tool draws one line; the other heads are not purged at the start.
# The state is kept in the saved variable wm_purge_all_heads and stays after a restart.
# ============================================================================
[output_pin Purge_Line_Every_Toolhead]
pin: wm_pin:purge_line_every_toolhead
pwm: False
value: 1

[delayed_gcode WM_PURGE_LINES_PIN_WATCH]
initial_duration: 10
gcode:
    {% set saved = printer.save_variables.variables.wm_purge_all_heads|default(1)|int %}
    {% if "output_pin Purge_Line_Every_Toolhead" in printer %}
        {% set pin = printer["output_pin Purge_Line_Every_Toolhead"].value|int %}
        {% if printer["gcode_macro _WM_PURGE_SETTINGS"].pin_synced|int == 0 %}
            # start-up: the switch gets the saved state
            SET_PIN PIN=Purge_Line_Every_Toolhead VALUE={saved}
            SET_GCODE_VARIABLE MACRO=_WM_PURGE_SETTINGS VARIABLE=pin_synced VALUE=1
        {% elif pin != saved %}
            # the switch was changed in Fluidd: keep the new state
            SAVE_VARIABLE VARIABLE=wm_purge_all_heads VALUE={pin}
            RESPOND MSG="Print start purge: {'every used toolhead draws its own line' if pin == 1 else 'only the first tool draws one line'}. It stays like this after a restart"
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=WM_PURGE_LINES_PIN_WATCH DURATION=2

# ============================================================================
# F-267: Fluidd switch Wipe_Slow_Fast (same pattern as Purge_Line_Every_Toolhead).
# ON (default) = the wipe outside a print does 2 slow strokes (F3000), then 2 fast strokes (F12000).
# OFF = all 4 strokes fast, like before. A wipe during a print is never changed.
# The state is kept in the saved variable wm_wipe_slowfast and stays after a restart.
# ============================================================================
[gcode_macro _WM_WIPE_SETTINGS]
variable_pin_synced: 0                  # 1 = the switch got its saved state after the start
gcode:
    RESPOND MSG="_WM_WIPE_SETTINGS holds only the start-up flag of the switch Wipe_Slow_Fast"

[output_pin Wipe_Slow_Fast]
pin: wm_pin:wipe_slow_fast
pwm: False
value: 1

[delayed_gcode WM_WIPE_PIN_WATCH]
initial_duration: 10
gcode:
    {% set saved = printer.save_variables.variables.wm_wipe_slowfast|default(1)|int %}
    {% if "output_pin Wipe_Slow_Fast" in printer %}
        {% set pin = printer["output_pin Wipe_Slow_Fast"].value|int %}
        {% if printer["gcode_macro _WM_WIPE_SETTINGS"].pin_synced|int == 0 %}
            SET_PIN PIN=Wipe_Slow_Fast VALUE={saved}
            SET_GCODE_VARIABLE MACRO=_WM_WIPE_SETTINGS VARIABLE=pin_synced VALUE=1
        {% elif pin != saved %}
            SAVE_VARIABLE VARIABLE=wm_wipe_slowfast VALUE={pin}
            RESPOND MSG="Wipe nozzle: {'2 slow strokes, then 2 fast' if pin == 1 else 'all 4 strokes fast'}. It stays like this after a restart"
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=WM_WIPE_PIN_WATCH DURATION=2

# ---------------------------------------------------------------------------
# WM_NOZZLE_CLEAN (F-212, 2026-11-21): clean the nozzles by hand with a brush at 240 C.
# Window steps: choose tools -> heat at X150 Y1 Z150 -> brush (HOT) -> Cool nozzle (fan 100% to 140 C) -> Next -> ... -> Close / Restart.
# Klipper cannot wait for a button: every window button runs one helper macro, the helpers move the steps on.
# ---------------------------------------------------------------------------
[gcode_macro _WM_NCLEAN]
description: State of WM_NOZZLE_CLEAN (mask = chosen tools as bits, phase 0 choice, 1 moving, 2 heating, 3 hot, 4 cooling, 5 cooled, 6 finished). Do not edit
variable_mask: 0
variable_active: 0
variable_phase: 0
variable_cur: -1
variable_held: 0
variable_ticks: 0
variable_then: ""          # what to run when the clean is done (set by THEN=, used when started from a calibration)
gcode:
    RESPOND MSG="_WM_NCLEAN keeps the state of WM_NOZZLE_CLEAN. Run WM_NOZZLE_CLEAN to clean nozzles"

[gcode_macro WM_NOZZLE_CLEAN]
description: Window: clean the nozzles by hand with a brush at 240 C (all tools or the ones you pick), each nozzle is then cooled with the part fan to 140 C
gcode:
    {% set st = printer.print_stats.state %}
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% if st == "printing" or st == "paused" %}
        {action_raise_error("WM_NOZZLE_CLEAN: not while a print is running or paused")}
    {% elif printer["gcode_macro _WM_UNLOAD"].active %}
        {action_raise_error("WM_NOZZLE_CLEAN: an unload is running")}
    {% elif n.active|int == 1 %}
        RESPOND MSG="WM_NOZZLE_CLEAN is already running: this is its window again"
        _WM_NCLEAN_SHOW
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=held VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=cur VALUE=-1
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=then VALUE="'{params.THEN|default('')}'"
        _WM_NCLEAN_SHOW
    {% endif %}

[gcode_macro _WM_NCLEAN_SHOW]
description: Helper of WM_NOZZLE_CLEAN: shows the window of the current step
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% set p = n.phase|int %}
    {% set c = n.cur|int %}
    {% set mask = n.mask|int %}
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set chosen = [] %}
    {% for i in range(count) %}
        {% if (mask // (2 ** i)) % 2 == 1 %}
            {% set _ = chosen.append(i) %}
        {% endif %}
    {% endfor %}
    {% set names = [] %}
    {% for i in chosen %}
        {% set _ = names.append("T%d" % i) %}
    {% endfor %}
    {% set pos = chosen.index(c) + 1 if c in chosen else 0 %}
    {% set chain = n.then|string|length > 0 %}
    {% set tc = printer["extruder" if c <= 0 else "extruder%d" % c].temperature|float|round(0)|int %}
    {% set tl = [] %}
    {% for i in range(count) %}
        {% set _ = tl.append("T%d %d C" % (i, printer["extruder" if i == 0 else "extruder%d" % i].temperature|float|round(0)|int)) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle clean"
    {% if p == 0 %}
        RESPOND TYPE=command MSG="action:prompt_text WARNING: the nozzles will be HOT (240 C). Do not touch them with bare hands."
        RESPOND TYPE=command MSG="action:prompt_text {'Clean the nozzles by hand first, or press Skip.' if chain else 'Pick the nozzles to clean.'} Chosen: {names|join(' ') if names else 'none'}"
        RESPOND TYPE=command MSG="action:prompt_text Now: {tl|join(', ')}"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button All|_WM_NCLEAN_PICK T=ALL|{'primary' if chosen|length == count else 'secondary'}"
        {% for i in range(count) %}
            {% set away = (not (printer['filament_switch_sensor docked%d' % i].filament_detected or (printer.custom_hall.Raw|float < 4700 and printer.save_variables.variables.current_extruder|default(99)|int == i))) %}
            RESPOND TYPE=command MSG="action:prompt_button T{i}{' · not in its dock' if away else ''}|_WM_NCLEAN_PICK T={i}|{'primary' if i in chosen else 'secondary'}"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Start|_WM_NCLEAN_START|success"
        {% if chain %}
        RESPOND TYPE=command MSG="action:prompt_button Skip|_WM_NCLEAN_SKIP|primary"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_NCLEAN_CLOSE_CHOICE|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% elif p == 1 %}
        RESPOND TYPE=command MSG="action:prompt_text Moving the tools. Please wait."
        RESPOND TYPE=command MSG="action:prompt_text Nozzle T{c}: {tc} C"
        RESPOND TYPE=command MSG="action:prompt_button Please wait|_WM_NCLEAN_WAIT|error"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_NCLEAN_ABORT REASON=Cancel|secondary"
    {% elif p == 2 %}
        RESPOND TYPE=command MSG="action:prompt_text Heating T{c} to 240 C ({pos} of {chosen|length}).{' The other chosen nozzles are pre-heating.' if chosen|length > 1 and pos == 1 else ''}"
        RESPOND TYPE=command MSG="action:prompt_text Nozzle T{c}: {tc} C of 240 C"
        RESPOND TYPE=command MSG="action:prompt_button Please wait|_WM_NCLEAN_WAIT|error"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_NCLEAN_ABORT REASON=Cancel|secondary"
    {% elif p == 3 %}
        RESPOND TYPE=command MSG="action:prompt_text T{c} nozzle is HOT (240 C). Do NOT touch it with bare hands."
        RESPOND TYPE=command MSG="action:prompt_text Clean it with the brush now. When it is clean, press Cool nozzle and keep brushing and wiping with a rag until it is at 140 C."
        RESPOND TYPE=command MSG="action:prompt_text Nozzle T{c}: {tc} C"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Cool nozzle|_WM_NCLEAN_COOL|primary"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_NCLEAN_ABORT REASON=Cancel|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% elif p == 4 %}
        RESPOND TYPE=command MSG="action:prompt_text T{c} is cooling, fan 100%. Keep brushing and wiping with a rag until the nozzle has cooled to 140 C."
        RESPOND TYPE=command MSG="action:prompt_text Nozzle T{c}: {tc} C"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Please wait|_WM_NCLEAN_WAIT|error"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_NCLEAN_ABORT REASON=Cancel|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% elif p == 5 %}
        RESPOND TYPE=command MSG="action:prompt_text T{c} has cooled to 140 C. Fan off. {'Press Park tool to park it and heat the next nozzle.' if pos < chosen|length else 'Press Park tool to park it.'}"
        RESPOND TYPE=command MSG="action:prompt_text Nozzle T{c}: {tc} C"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% if pos < chosen|length %}
            RESPOND TYPE=command MSG="action:prompt_button Park tool|_WM_NCLEAN_NEXT|warning"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button Park tool|_WM_NCLEAN_PARK|warning"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_NCLEAN_ABORT REASON=Cancel|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text All chosen nozzles are cleaned. The tool is parked and the heaters are off."
        {% if chain %}
        RESPOND TYPE=command MSG="action:prompt_text Continue starts the calibration (no new homing, the motors stay on)."
        RESPOND TYPE=command MSG="action:prompt_text Now: {tl|join(', ')}"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Continue calibration|_WM_NCLEAN_CONTINUE|success"
        RESPOND TYPE=command MSG="action:prompt_button Restart|_WM_NCLEAN_RESTART|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_NCLEAN_ABORT REASON=Cancel|secondary"
        {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Close: heaters, fan and motors off. Restart: choose more nozzles."
        RESPOND TYPE=command MSG="action:prompt_text Now: {tl|join(', ')}"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Close|_WM_NCLEAN_CLOSE|success"
        RESPOND TYPE=command MSG="action:prompt_button Restart|_WM_NCLEAN_RESTART|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endif %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NCLEAN_WAIT]
description: The red Please wait bar of the WM_NOZZLE_CLEAN windows (does nothing)
gcode:
    RESPOND MSG="Please wait..."

[gcode_macro _WM_NCLEAN_PICK]
description: Button of the WM_NOZZLE_CLEAN choice window: T=0..3 switches that tool on or off, T=ALL picks every tool
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% if n.phase|int == 0 %}
        {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
        {% set mask = n.mask|int %}
        {% if params.T|default("")|string|upper == "ALL" %}
            # tool gate: All picks only the tools that are in their dock, or on the carriage
            {% set am = namespace(m=0) %}
            {% for i in range(count) %}
                {% if not (not (printer['filament_switch_sensor docked%d' % i].filament_detected or (printer.custom_hall.Raw|float < 4700 and printer.save_variables.variables.current_extruder|default(99)|int == i))) %}
                    {% set am.m = am.m + 2 ** i %}
                {% endif %}
            {% endfor %}
            SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE={am.m}
        {% else %}
            {% set bit = 2 ** (params.T|int) %}
            {% set on = (mask // bit) % 2 %}
            {% if on == 0 and (not (printer['filament_switch_sensor docked%d' % params.T|int].filament_detected or (printer.custom_hall.Raw|float < 4700 and printer.save_variables.variables.current_extruder|default(99)|int == params.T|int))) %}
                RESPOND MSG="T{params.T|int} is not in its dock. Put it into its dock first, then tap it again"
            {% else %}
                SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE={mask - bit if on == 1 else mask + bit}
            {% endif %}
        {% endif %}
        _WM_NCLEAN_SHOW
    {% endif %}

[gcode_macro _WM_NCLEAN_CLOSE_CHOICE]
description: Cancel button of the WM_NOZZLE_CLEAN choice window (nothing has started yet): closes the window
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=then VALUE="''"
    RESPOND MSG="Nozzle clean cancelled"

[gcode_macro _WM_NCLEAN_START]
description: Start button of WM_NOZZLE_CLEAN: homes cold if needed, then picks up the first chosen tool (pre-heats the others)
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% set mask = n.mask|int %}
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set st = printer.print_stats.state %}
    {% set chosen = [] %}
    {% for i in range(count) %}
        {% if (mask // (2 ** i)) % 2 == 1 %}
            {% set _ = chosen.append(i) %}
        {% endif %}
    {% endfor %}
    {% if n.phase|int != 0 %}
        RESPOND MSG="Nozzle clean is already running"
    {% elif st == "printing" or st == "paused" %}
        {action_raise_error("WM_NOZZLE_CLEAN: not while a print is running or paused")}
    {% elif chosen|length == 0 %}
        RESPOND MSG="Pick at least one nozzle first"
        _WM_NCLEAN_SHOW
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=1
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=cur VALUE={chosen[0]}
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=held VALUE=0
        _WM_NCLEAN_SHOW
        # watchdog: if homing or the tool change fails, the poll below sees phase 1 and stops everything (heaters off)
        UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
        {% if "xyz" not in printer.toolhead.homed_axes %}
            RESPOND MSG="Not homed: homing first, cold (the homing uses T0), then T{chosen[0]}"
            G28
            M400
        {% endif %}
        _WM_NCLEAN_GO T={chosen[0]} FIRST=1
    {% endif %}

[gcode_macro _WM_NCLEAN_GO]
description: Helper of WM_NOZZLE_CLEAN: T=0..3 picks that tool up, moves to X150 Y1 Z150 and heats it to 240 C (FIRST=1 also pre-heats the other chosen tools)
gcode:
    {% set t = params.T|int %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% set mask = n.mask|int %}
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=cur VALUE={t}
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=1
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=ticks VALUE=0
    UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
    {% if printer.save_variables.variables.current_extruder|default(99)|int != t %}
        _CHANGE_TOOL T={t}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=held VALUE=1
    ACTIVATE_EXTRUDER EXTRUDER={en}
    SAVE_GCODE_STATE NAME=_wm_nclean
    G90
    G1 Z150 F800
    G1 X150 Y1 F3000
    M400
    RESTORE_GCODE_STATE NAME=_wm_nclean
    SET_HEATER_TEMPERATURE HEATER={en} TARGET=240
    {% if params.FIRST|default(0)|int == 1 %}
        {% for i in range(count) %}
            {% if i != t and (mask // (2 ** i)) % 2 == 1 %}
                SET_HEATER_TEMPERATURE HEATER={"extruder" if i == 0 else "extruder%d" % i} TARGET=240
            {% endif %}
        {% endfor %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=2
    {% if printer[en].temperature|float >= 239.0 %}
        _WM_NCLEAN_HOT
    {% else %}
        _WM_NCLEAN_SHOW
        UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
    {% endif %}

[gcode_macro _WM_NCLEAN_HOT]
description: Helper of WM_NOZZLE_CLEAN: the nozzle is at 240 C, shows the "clean it now" window
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=3
    {% set c = printer["gcode_macro _WM_NCLEAN"].cur|int %}
    RESPOND MSG="T{c} is HOT (240 C). Clean it with the brush"
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=ticks VALUE=0
    _WM_NCLEAN_SHOW
    UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2

[gcode_macro _WM_NCLEAN_COOL]
description: Cool nozzle button of WM_NOZZLE_CLEAN: ACE feed assist off, filament back 10 mm, heater of the tool off, part fan 100%, then waits for 140 C
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% set c = n.cur|int %}
    {% if n.phase|int == 3 %}
        # the ACE feed assist (if it is on for this tool) goes off first, then the filament is pulled back 10 mm while the nozzle is still hot
        _WM_PURGE_ASSIST T={c} STATE=off
        SAVE_GCODE_STATE NAME=_wm_nclean_ret
        M83
        G1 E-10 F1200
        M400
        RESTORE_GCODE_STATE NAME=_wm_nclean_ret
        SET_HEATER_TEMPERATURE HEATER={"extruder" if c == 0 else "extruder%d" % c} TARGET=0
        M106 S255
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=4
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=ticks VALUE=0
        RESPOND MSG="T{c} heater off, part fan 100%. Waiting for 140 C"
        _WM_NCLEAN_SHOW
        UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
    {% endif %}

[gcode_macro _WM_NCLEAN_COOLED]
description: Helper of WM_NOZZLE_CLEAN: the nozzle is at 140 C or below, fan off, shows the Next button
gcode:
    M107
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=5
    RESPOND MSG="T{printer['gcode_macro _WM_NCLEAN'].cur|int} cooled to 140 C, fan off"
    _WM_NCLEAN_SHOW

[delayed_gcode _WM_NCLEAN_POLL]
# the real work is in _WM_NCLEAN_TICK: this template is rendered when the timer fires, which can be in the middle of a long homing or move
# (the command then waits for the G-code lock). A macro is rendered when it RUNS, so the state it reads is current.
gcode:
    _WM_NCLEAN_TICK

[gcode_macro _WM_NCLEAN_TICK]
description: Helper of WM_NOZZLE_CLEAN: the watchdog and temperature poll (called by _WM_NCLEAN_POLL every 2 s)
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% set p = n.phase|int %}
    {% set c = n.cur|int %}
    {% set en = "extruder" if c == 0 else "extruder%d" % c %}
    {% if n.active|int == 1 %}
        {% if p == 1 %}
            _WM_NCLEAN_ABORT REASON="homing, tool change or move did not finish"
        {% elif p == 2 %}
            {% if printer[en].temperature|float >= 239.0 %}
                _WM_NCLEAN_HOT
            {% elif n.ticks|int >= 150 %}
                _WM_NCLEAN_ABORT REASON="T{c} did not reach 240 C within 5 minutes"
            {% else %}
                SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=ticks VALUE={n.ticks|int + 1}
                {% if n.ticks|int % 2 == 1 %}
                    _WM_NCLEAN_SHOW
                {% endif %}
                UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
            {% endif %}
        {% elif p == 3 %}
            SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=ticks VALUE={n.ticks|int + 1}
            {% if n.ticks|int % 2 == 1 %}
                _WM_NCLEAN_SHOW
            {% endif %}
            UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
        {% elif p == 4 %}
            {% if printer[en].temperature|float <= 140.0 %}
                _WM_NCLEAN_COOLED
            {% elif n.ticks|int >= 300 %}
                _WM_NCLEAN_ABORT REASON="T{c} did not cool to 140 C within 10 minutes"
            {% else %}
                SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=ticks VALUE={n.ticks|int + 1}
                {% if n.ticks|int % 2 == 1 %}
                    _WM_NCLEAN_SHOW
                {% endif %}
                UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
            {% endif %}
        {% endif %}
    {% endif %}


[gcode_macro _WM_NCLEAN_NEXT]
description: Park tool button of WM_NOZZLE_CLEAN when more tools are chosen: parks the tool, picks up the next chosen tool (or, after the last one, shows Close / Restart)
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% if n.phase|int == 5 %}
        {% set c = n.cur|int %}
        {% set mask = n.mask|int %}
        {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
        {% set nxt = [-1] %}
        {% for i in range(count) %}
            {% if i > c and nxt[0] < 0 and (mask // (2 ** i)) % 2 == 1 %}
                {% set _ = nxt.append(i) %}
                {% set _ = nxt.pop(0) %}
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=1
        {% if nxt[0] >= 0 %}
            SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=cur VALUE={nxt[0]}
        {% endif %}
        _WM_NCLEAN_SHOW
        UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
        PARK_CURRENT_TOOL
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=held VALUE=0
        {% if nxt[0] >= 0 %}
            _WM_NCLEAN_GO T={nxt[0]}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=6
            _WM_NCLEAN_SHOW
        {% endif %}
    {% endif %}

[gcode_macro _WM_NCLEAN_PARK]
description: Park tool button of WM_NOZZLE_CLEAN (at 140 C): switches off the heaters of the other chosen tools, parks this tool, shows Close / Restart
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% if n.phase|int == 5 %}
        {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
        {% for i in range(count) %}
            SET_HEATER_TEMPERATURE HEATER={"extruder" if i == 0 else "extruder%d" % i} TARGET=0
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=1
        _WM_NCLEAN_SHOW
        UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=2
        PARK_CURRENT_TOOL
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=held VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=6
        _WM_NCLEAN_SHOW
    {% endif %}

[gcode_macro _WM_NCLEAN_SKIP]
description: Skip button of WM_NOZZLE_CLEAN when it was started from a calibration: closes the window and runs the calibration at once (nothing is heated, no homing)
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% set th = n.then|string %}
    {% if n.phase|int == 0 and th|length > 0 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=then VALUE="''"
        RESPOND MSG="Nozzle clean skipped"
        {th}
    {% endif %}

[gcode_macro _WM_NCLEAN_CONTINUE]
description: Continue calibration button of WM_NOZZLE_CLEAN (started from a calibration): all heaters and the fan off, motors off (M84, the calibration homes again), then runs the calibration
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% set th = n.then|string %}
    {% if n.phase|int == 6 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        TURN_OFF_HEATERS
        M107
        M84
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=active VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=cur VALUE=-1
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=then VALUE="''"
        RESPOND MSG="Nozzle clean finished: heaters off, fan off, motors off, starting the calibration (it homes first)"
        {th}
    {% endif %}

[gcode_macro _WM_NCLEAN_CLOSE]
description: Close button of WM_NOZZLE_CLEAN: all heaters off, fan off, motors off (M84). The last tool was parked by Next
gcode:
    {% if printer["gcode_macro _WM_NCLEAN"].phase|int == 6 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        TURN_OFF_HEATERS
        M107
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=active VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=cur VALUE=-1
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=then VALUE="''"
        M84
        RESPOND MSG="Nozzle clean finished: heaters off, fan off, motors off"
    {% endif %}

[gcode_macro _WM_NCLEAN_RESTART]
description: Restart button of WM_NOZZLE_CLEAN: back to the choice window (motors stay on)
gcode:
    {% if printer["gcode_macro _WM_NCLEAN"].phase|int == 6 %}
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=active VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=cur VALUE=-1
        _WM_NCLEAN_SHOW
    {% endif %}

[gcode_macro _WM_NCLEAN_ABORT]
description: Cancel button of WM_NOZZLE_CLEAN, and what any failure or time limit does: closes the window, all heaters off (also the pre-heated ones), fan off, tool parked. REASON=text
gcode:
    {% set n = printer["gcode_macro _WM_NCLEAN"] %}
    {% set held = n.held|int %}
    UPDATE_DELAYED_GCODE ID=_WM_NCLEAN_POLL DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=mask VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=held VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=cur VALUE=-1
    SET_GCODE_VARIABLE MACRO=_WM_NCLEAN VARIABLE=then VALUE="''"
    TURN_OFF_HEATERS
    M107
    RESPOND MSG="Nozzle clean stopped ({params.REASON|default('stopped')}): heaters off, fan off{', parking the tool' if held == 1 else ''}"
    {% if held == 1 and "xyz" in printer.toolhead.homed_axes %}
        PARK_CURRENT_TOOL
    {% endif %}

# ---------------------------------------------------------------------------------------------------------
# TOOL GATE (rollback name: rollback dock). A tool is only picked up when it is in its dock, and only put
# back when its dock is free. The check looks at the hall sensor, the four dock sensors and the saved tool.
# It never moves and never heats. Off while is_nozzle_setting = 1 (nozzle change, Extruder Setup, matching).
#   _WM_TOOL_GATE T=<0..3>  - before a pick up. Carriage empty: T must be in its dock. Other tool on the
#                             carriage: T must be in its dock AND the dock of the carriage tool must be free.
#   _WM_TOOL_GATE PUT=1     - before a put back. The dock of the carriage tool must be free.
#   _WM_TOOL_GATE T=.. STOP=0 - only ask: blocked = 1 when it would stop, no window, no error (menus)
# Stopping: outside a print a window and an error (the whole macro chain ends, nothing moved). In a print
# the print is paused and blocked = 1, the callers (_CHANGE_TOOL, PARK_CURRENT_TOOL) then skip their moves.
# ---------------------------------------------------------------------------------------------------------
[gcode_macro _WM_TOOL_GATE]
description: Safety check before tools are picked up (T=0..3, TOOLS=0,2 or ALL=1) or put back (PUT=1). No motion, no heating. Sets blocked = 1 when it stops
variable_blocked: 0
variable_why: ''
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_TOOL_GATE VARIABLE=blocked VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_TOOL_GATE VARIABLE=why VALUE="''"
    {% set sv = printer.save_variables.variables %}
    {% set hall = printer.custom_hall.Raw|float %}
    {% if sv.is_nozzle_setting|default(0)|int == 0 and 3450 <= hall <= 6000 %}
        {% set n = sv.thr_number|default(4)|int %}
        {% set cur = sv.current_extruder|default(99)|int %}
        {% set want = params.T|default(99)|int %}
        {% set put = params.PUT|default(0)|int %}
        {% set stop = params.STOP|default(1)|int %}
        {% set ns = namespace(on=99, why='', tool=99, empty='', miss=[]) %}
        {% for i in range(n) %}
            {% if printer['filament_switch_sensor docked%d' % i].filament_detected == False %}
                {% set ns.empty = ns.empty ~ ' T' ~ (i + 1) %}
            {% endif %}
        {% endfor %}
        # the tools wanted
        {% set wl = [] %}
        {% if params.TOOLS is defined %}
            {% for x in (params.TOOLS|string).replace(' ', '').replace(';', ',').split(',') if x != '' %}
                {% if 0 <= x|int < n and x|int not in wl %}
                    {% set _ = wl.append(x|int) %}
                {% endif %}
            {% endfor %}
        {% elif params.ALL|default(0)|int == 1 %}
            {% for i in range(n) %}
                {% set _ = wl.append(i) %}
            {% endfor %}
        {% elif 0 <= want < n %}
            {% set _ = wl.append(want) %}
        {% endif %}
        # which tool is on the carriage, by the sensors
        {% if hall < 4700 %}
            {% if 0 <= cur < n %}
                {% set ns.on = cur %}
            {% else %}
                # saved says empty but a head is gripped: only clear when exactly one dock is empty
                {% for i in range(n) %}
                    {% if printer['filament_switch_sensor docked%d' % i].filament_detected == False %}
                        {% set ns.on = i %}
                    {% endif %}
                {% endfor %}
                {% if ns.empty.split()|length != 1 %}
                    {% set ns.why = 'unknown' %}
                {% endif %}
            {% endif %}
            # the carriage tool must not read as sitting in its own dock
            {% if ns.why == '' and ns.on < n and printer['filament_switch_sensor docked%d' % ns.on].filament_detected == True %}
                {% set ns.why = 'busy' %}
                {% set ns.tool = ns.on %}
            {% endif %}
        {% endif %}
        {% if ns.why == '' and put == 0 %}
            {% for w in wl %}
                {% if w != ns.on and printer['filament_switch_sensor docked%d' % w].filament_detected == False %}
                    {% set ns.miss = ns.miss + [w] %}
                {% endif %}
            {% endfor %}
            {% if ns.miss|length > 0 %}
                {% set ns.why = 'missing' %}
            {% endif %}
        {% endif %}
        {% if ns.why != '' %}
            SET_GCODE_VARIABLE MACRO=_WM_TOOL_GATE VARIABLE=blocked VALUE=1
            SET_GCODE_VARIABLE MACRO=_WM_TOOL_GATE VARIABLE=why VALUE="'{ns.why}'"
            {% if stop == 1 %}
                {% set pr = printer.print_stats.state == 'printing' %}
                {% set names = [] %}
                {% for m in ns.miss %}
                    {% set _ = names.append('T%d' % (m + 1)) %}
                {% endfor %}
                {% if ns.why == 'missing' and names|length == 1 %}
                    {% set title = '%s is not in its dock' % names[0] %}
                    {% set l1 = '%s is not in its dock (slot %d), so the printer did not pick it up.' % (names[0], ns.miss[0] + 1) %}
                    {% set l2 = 'Put %s into its dock, or check its dock sensor, then try again.' % names[0] %}
                {% elif ns.why == 'missing' %}
                    {% set title = '%s are not in their docks' % (names|join(', ')) %}
                    {% set l1 = '%s are not in their docks, and they are needed here.' % (names|join(', ')) %}
                    {% set l2 = 'Put them into their docks, or check the dock sensors, then try again.' %}
                {% elif ns.why == 'busy' %}
                    {% set title = 'T%d reads as docked' % (ns.tool + 1) %}
                    {% set l1 = 'T%d is on the carriage, but its own dock says a tool sits there.' % (ns.tool + 1) %}
                    {% set l2 = 'Check the dock sensor of T%d and what hangs in its dock, then try again.' % (ns.tool + 1) %}
                {% else %}
                    {% set title = 'Tool on the carriage unclear' %}
                    {% set l1 = 'A head is on the carriage, but the saved tool and the dock sensors do not agree.' %}
                    {% set l2 = 'Docks that read empty:%s. Check the carriage and the docks by hand, then try again.' % (ns.empty if ns.empty != '' else ' none') %}
                {% endif %}
                {% set l3 = 'The print is paused. Nothing else moved or heated.' if pr else 'Nothing was moved or heated.' %}
                _WM_GATE_STOP TITLE="{title}" L1="{l1}" L2="{l2}" L3="{l3}"
                {% if pr %}
                    RESPOND TYPE=error MSG="Tool gate: {title}. {l3}"
                    PAUSE
                {% else %}
                    _WM_FAIL MSG="Tool gate stopped: {title}. Nothing was moved or heated."
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _WM_GATE_STOP]
description: The stop window of the tool gate. TITLE and up to three lines L1 to L3, a green Close button
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE|default('Tool gate')}"
    {% for k in ['L1', 'L2', 'L3'] %}
        {% if params[k] is defined %}
    RESPOND TYPE=command MSG="action:prompt_text {params[k]}"
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|_WM_PROMPT_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_START_GATE]
description: Print start: every tool the print needs must be in its dock or on the carriage, checked before anything heats or moves (tool gate)
gcode:
    {% if "wm_print_info" in printer and printer.print_stats.state == "printing" %}
        WM_PRINT_INFO_READ
    {% endif %}
    _WM_START_GATE_RUN INITIAL_TOOL={params.INITIAL_TOOL|default(0)|int}

[gcode_macro _WM_START_GATE_RUN]
description: The check of _WM_START_GATE (it runs after the tool list of the print file was read)
gcode:
    {% set v = printer.save_variables.variables %}
    {% set info = printer.wm_print_info if "wm_print_info" in printer else {} %}
    {% set it = params.INITIAL_TOOL|default(0)|int %}
    # T0 is always used (the Z reference of the whole print), then the first tool and every slicer tool of the file, as head numbers
    {% set ns = namespace(l=[0]) %}
    {% set cand = [it] %}
    {% if info and info.found and printer.print_stats.state in ["printing", "paused"] %}
        {% for x in info.tools %}
            {% set cand = cand + [x|int] %}
        {% endfor %}
    {% endif %}
    {% for x in cand %}
        {% set ph = v['box_modify_t%d' % x]|default(x)|int if 0 <= x <= 3 else x %}
        {% if 0 <= ph <= 3 and ph not in ns.l %}
            {% set ns.l = ns.l + [ph] %}
        {% endif %}
    {% endfor %}
    _WM_TOOL_GATE TOOLS={ns.l|join(',')}

[gcode_macro _WM_GATE_NOTE]
description: A grey tool button (tool not in its dock) was tapped: say why, then open the window again (REOPEN= is the command that draws it)
gcode:
    RESPOND MSG="T{params.T|default(0)|int + 1} is not in its dock. Put it into its dock first, then tap it again"
    {% if params.REOPEN is defined %}
        {params.REOPEN}
    {% endif %}
