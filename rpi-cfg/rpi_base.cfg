# rpi_base.cfg  -  the Pi's small always-on helpers: switch pins, start-up safety check, print end, tool LEDs, head filament
# sensors and load queue, unload menu, the SET_GCODE_OFFSET wrapper (live Z adjust per tool), and heating at the wipe position.
# Until 2.9.0 these were separate files; each part below starts with the old file name. Installed by the installer from rpi-cfg/.
# [wm_virtual_pins] is first: Klipper must read it before rpi_calibration.cfg uses a wm_pin switch, so printer.cfg includes
# this file before rpi_calibration.cfg.

# ======================================================================================================================
# ===== rpi_virtual_pins.cfg
# ======================================================================================================================

# rpi_virtual_pins.cfg  -  virtual output pins for on / off switches in Fluidd and KlipperScreen
#
# A virtual pin exists only in software. An [output_pin] on a "wm_pin:" pin shows as a switch under Outputs.
# The driver is wm_virtual_pins.py (klippy/extras). It does not need the ACE driver and does not clash with it:
# the ACE driver's own virtual pins use the name "virtual_pin:", these use "wm_pin:".
# This file must be included before any file that uses a "wm_pin:" pin (rpi_zoffset.cfg).
[wm_virtual_pins]


# ======================================================================================================================
# ===== rpi_safety.cfg
# ======================================================================================================================

# rpi_safety.cfg  -  checks two saved safety switches once after Klipper starts
#
# if_check_extruder_status: the filament insert routine sets it to 0 for a moment (grip check and cold extrude protection off)
#   and back to 1. A power cut or an error in between leaves it at 0 for good, so it is put back to 1 here.
# is_nozzle_setting: 1 while a nozzle change or Extruder Setup is open (the dock sensor check is off). It can be meant,
#   so it is only reported here, not changed.
[delayed_gcode WM_SAFETY_START]
initial_duration: 8
gcode:
    _WM_SAFETY_CHECK

[gcode_macro _WM_SAFETY_CHECK]
description: Start-up check of the saved switches if_check_extruder_status and is_nozzle_setting
gcode:
    {% set v = printer.save_variables.variables %}
    {% if v.if_check_extruder_status|default(1)|int != 1 %}
        SAVE_VARIABLE VARIABLE=if_check_extruder_status VALUE=1
        RESPOND TYPE=error MSG="Safety check: the grip check was left off by an interrupted filament insert. It is on again"
    {% endif %}
    {% if v.is_nozzle_setting|default(0)|int == 1 %}
        RESPOND TYPE=error MSG="Safety check: a nozzle change or Extruder Setup is still open, so the tool change check is off. Put the tools in their docks and run _WM_NOZZLE_CHANGE_END"
    {% endif %}


# ======================================================================================================================
# ===== rpi_print_end.cfg
# ======================================================================================================================

# rpi_print_end.cfg  -  run PRINT_END when a print finishes
#
# The original WonderMaker screen board ran PRINT_END itself when a print reached its end, so the slicer end G-code
# is only the comment ";PRINT_END" (a semicolon makes it a comment, Klipper skips it). Without the screen board nothing
# runs it: the tool head stays over the print, the heaters stay on and the motors stay locked.
# This watcher does what the screen board did: when the print state is "complete" and PRINT_END has not run yet
# (START_PRINT.print_body_ready is still True), it runs PRINT_END once. A G-code file that already calls PRINT_END
# (without the semicolon) is not run twice.
[delayed_gcode WM_PRINT_END_WATCH]
initial_duration: 5
gcode:
    {% if printer.print_stats.state == "complete" and printer["gcode_macro START_PRINT"].print_body_ready %}
        RESPOND MSG="Print finished: running PRINT_END (the slicer end G-code is only a comment)"
        PRINT_END
    {% endif %}
    {% if "gcode_macro _WM_PAUSE_STATE" in printer and printer["gcode_macro _WM_PAUSE_STATE"].active|int == 1 %}
        _WM_PAUSE_STATE
    {% endif %}
    UPDATE_DELAYED_GCODE ID=WM_PRINT_END_WATCH DURATION=2


# ======================================================================================================================
# ===== rpi_tool_leds.cfg
# ======================================================================================================================

# Tool head LEDs with the FACTORY macros: _RGB_CURRENT (green) for the tool on the carriage when it has filament, _RGB_LOAD (blue) for other tools with
# filament in their tool head, _RGB_UNLOAD (red) when a tool has none.
# The factory screen called these itself. On the Pi nothing did, so the LEDs stayed dark.
# Checked every 2 seconds, but a factory macro is only called when the state of a tool CHANGES (remembered in _WM_LED_STATE): Klipper
# ignores a "filament inserted" event while its idle state is "Printing", and an LED call (SYNC) keeps it there for a moment, so
# a call every 2 s would stop the automatic load. Uses WM's [neopixel T0_RGB] .. T3_RGB, _RGB_* macros and [filament_switch_sensor filament0] .. 3.
[gcode_macro _WM_LED_STATE]
variable_seen: [-1, -1, -1, -1]      # last state per tool: 1 filament, 0 none, -1 not set yet
gcode:

[delayed_gcode WM_TOOL_LEDS]
initial_duration: 5
gcode:
    {% set st = printer["gcode_macro _WM_LED_STATE"].seen %}
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% set ns = namespace(l=[]) %}
    {% for t in range(printer.save_variables.variables.thr_number|default(4)|int) %}
        {% set s = printer["filament_switch_sensor filament%d" % t] %}
        {% set has = (s is defined and s.filament_detected) %}
        {% set now = 2 if (has and t == cur) else (1 if has else 0) %}
        {% if st[t] != now %}
            {% if now == 2 %}
                _RGB_CURRENT T={t}
            {% elif now == 1 %}
                _RGB_LOAD T={t}
            {% else %}
                _RGB_UNLOAD T={t}
            {% endif %}
        {% endif %}
        {% set ns.l = ns.l + [now] %}
    {% endfor %}
    {% for t in range(ns.l|length, 4) %}
        {% set ns.l = ns.l + [st[t]] %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_WM_LED_STATE VARIABLE=seen VALUE=[{ns.l|join(",")}]
    UPDATE_DELAYED_GCODE ID=WM_TOOL_LEDS DURATION=2


# ======================================================================================================================
# ===== rpi_head_sensors.cfg
# ======================================================================================================================

# rpi_head_sensors.cfg  -  head filament sensors of the docked tools back on when no print runs (fixes B-021)
#
# WonderMaker's tool change (_CHECK_CHANGE_TOOL in change_macros.cfg) calls _ENABLE_SENSOR after every pick-up. It switches the
# head filament sensors filament0..3 OFF and only the one of the tool just picked up ON. That is right during a print: a docked
# tool must not pause the print or start its load routine. But nothing switched them on again, so after any tool change (also the
# T0 pick-up of G28) filament pushed into a docked tool by hand did not start the load (tested 2026-11-15 17:11 with T1 and T2).
#
# WM_HEAD_SENSOR_WATCH (every 2 s) switches every head sensor that is OFF back ON when:
#   no print is running or paused, no tool change is running (changing_tool 0), the ACE macros are idle, and Klipper is not busy
#   (idle_timeout not Printing). During a print or a pause nothing is touched, the factory behaviour stays.
# A sensor switched on with filament already inside does not start a load (Klipper only reacts to a change of the sensor).
#
# Queue (fixes B-031): stock Klipper starts insert_gcode only when Klipper is not busy. A filament pushed into a second tool
# while another tool is loading is dropped and never comes back. Each insert_gcode (extruder0-3.cfg) now starts with
# _WM_HEAD_MARK T=n ("Klipper started the load of Tn"). The watcher remembers the filament state of every tool. When a tool got
# filament but no mark came, and the printer is idle (no print, no pause, no tool change, ACE idle, Klipper not busy) for two
# checks in a row, the tool goes into the queue. The first tool of the queue is loaded with _WM_HEAD_LOAD (the same steps as the
# factory insert_gcode), one after the other, in the order they were inserted. Nothing is queued during a print or a pause.

[gcode_macro _WM_HEAD_QUEUE]
description: State of the head sensor watcher and the load queue (do not run)
variable_prev: [-1, -1, -1, -1]  # filament seen at the last check, -1 = not known yet
variable_marks: [0, 0, 0, 0]     # 1 = Klipper started the insert_gcode of this tool since the last check
variable_cand: [0, 0, 0, 0]      # idle checks in a row that saw new filament without a mark
variable_queue: []               # tools waiting for their load, in the order they were inserted
gcode:
    RESPOND MSG="_WM_HEAD_QUEUE holds the state of WM_HEAD_SENSOR_WATCH"

[gcode_macro _WM_HEAD_MARK]
description: First line of each insert_gcode (extruder0-3.cfg): Klipper started the load of tool T
gcode:
    {% set t = params.T|int %}
    {% set m = printer["gcode_macro _WM_HEAD_QUEUE"].marks %}
    {% set new = [] %}
    {% for i in range(m|length) %}
        {% set _ = new.append(1 if i == t else m[i]) %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=marks VALUE="{new}"

[gcode_macro _WM_HEAD_LOAD]
description: Load of a queued tool T: the same steps as the factory insert_gcode in extruderN.cfg
gcode:
    {% set t = params.T|int %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% set key = "filament_switch_sensor filament%d" % t %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND MSG="Queued load of T{t} skipped, a print is running"
    {% elif key not in printer or not printer[key].filament_detected %}
        RESPOND MSG="Queued load of T{t} skipped, the T{t} head has no filament any more"
    {% elif "gcode_macro _WM_ACE" in printer and printer["gcode_macro _WM_ACE"].mode != "idle" %}
        RESPOND MSG="Queued load of T{t} skipped, the ACE is busy"
    {% else %}
        {% if "gcode_macro _WM_ACE_HEAD" in printer %}
            _WM_ACE_HEAD T={t}
        {% endif %}
        RESPOND MSG="Push filament until resistance is felt after blue light turns on (Load operation required before printing)"
        UPDATE_DELAYED_GCODE ID=delayed_pause{t} DURATION=0
        ACTIVATE_EXTRUDER EXTRUDER={en}
        SAVE_VARIABLE VARIABLE=if_check_extruder_status value=0
        {% if "gcode_macro _WM_ACE_GRAB" in printer %}
            _WM_ACE_GRAB T={t}
        {% endif %}
        filament_insert
        SAVE_VARIABLE VARIABLE=if_check_extruder_status value=1
        M104 S220 T{t}
        T{t}
        M109 S220 T{t}
        filament_insert_gcode T={t}
        M104 S0 T{t}
        PARK_CURRENT_TOOL
        {% if "gcode_macro _WM_ACE_HEAD_DONE" in printer %}
            _WM_ACE_HEAD_DONE T={t}
        {% endif %}
    {% endif %}

[delayed_gcode WM_HEAD_SENSOR_WATCH]
initial_duration: 12
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set n = sv.thr_number|default(4)|int %}
    {% set q = printer["gcode_macro _WM_HEAD_QUEUE"] %}
    {% set in_print = printer.print_stats.state in ["printing", "paused"] %}
    {% set ace_busy = "gcode_macro _WM_ACE" in printer and printer["gcode_macro _WM_ACE"].mode != "idle" %}
    {% set busy = in_print or ace_busy
        or sv.changing_tool|default(0)|int == 1
        or printer.idle_timeout.state == "Printing" %}
    {% set ns = namespace(off=[], prev=[], marks=[], cand=[], queue=q.queue, added=[]) %}
    {% for t in range(4) %}
        {% set key = "filament_switch_sensor filament%d" % t %}
        {% set f = 1 if (t < n and key in printer and printer[key].filament_detected) else 0 %}
        {% set p = q.prev[t]|int %}
        {% set m = q.marks[t]|int %}
        {% set c = q.cand[t]|int %}
        {% if in_print or ace_busy or p < 0 or f == 0 %}
            # during a print, a pause or an ACE load nothing is queued; no filament = nothing to load
            {% set m, c = 0, 0 %}
            {% if f == 0 and t in ns.queue %}
                {% set ns.queue = ns.queue|reject("equalto", t)|list %}
            {% endif %}
        {% elif p == 0 %}
            # new filament since the last check: handled when Klipper started its insert_gcode, else watch it
            {% set c = 0 if m == 1 else 1 %}
            {% set m = 0 %}
        {% elif c > 0 %}
            {% if m == 1 %}
                {% set m, c = 0, 0 %}
            {% elif not busy %}
                {% set c = c + 1 %}
                {% if c >= 2 %}
                    {% set c = 0 %}
                    {% if t not in ns.queue %}
                        {% set ns.queue = ns.queue + [t] %}
                        {% set ns.added = ns.added + ["T%d" % t] %}
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
        {% set ns.prev = ns.prev + [f] %}
        {% set ns.marks = ns.marks + [m] %}
        {% set ns.cand = ns.cand + [c] %}
        {% if not busy and t < n and key in printer and not printer[key].enabled %}
            SET_FILAMENT_SENSOR SENSOR=filament{t} ENABLE=1
            {% set ns.off = ns.off + ["T%d" % t] %}
        {% endif %}
    {% endfor %}
    {% if ns.off|length > 0 %}
        RESPOND MSG="Head filament sensors back on for {ns.off|join(', ')} (no print running)"
    {% endif %}
    {% if ns.added|length > 0 %}
        RESPOND MSG="Filament inserted in {ns.added|join(', ')} while the printer was busy. It is loaded when the printer is free"
    {% endif %}
    {% set go = -1 %}
    {% if not busy and ns.queue|length > 0 and ns.added|length == 0 %}
        {% set go = ns.queue[0] %}
        {% set ns.queue = ns.queue[1:] %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=prev VALUE="{ns.prev}"
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=marks VALUE="{ns.marks}"
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=cand VALUE="{ns.cand}"
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=queue VALUE="{ns.queue}"
    UPDATE_DELAYED_GCODE ID=WM_HEAD_SENSOR_WATCH DURATION=2
    {% if go >= 0 %}
        RESPOND MSG="Loading T{go} now (it was inserted while the printer was busy)"
        _WM_HEAD_LOAD T={go}
    {% endif %}


# ======================================================================================================================
# ===== rpi_unload.cfg
# ======================================================================================================================

# =====================================================================
#  rpi_unload.cfg - unload menu for Fluidd and KlipperScreen
#
#  WM_UNLOAD_MENU   opens a popup: pick one tool or "All tools", then confirm
#  _WM_UNLOAD_GO     T=0..3 or T=ALL   starts the unload (the popup runs it)
#  WM_UNLOAD_STOP   drops the rest of the list (the tool that is running finishes its step)
#
#  With an ACE connected every tool is unloaded with ACE_WM_UNLOAD (rpi_ace.cfg).
#  Without an ACE every tool is unloaded with ZR_RETRACT (zr_tools.cfg).
#  Tools go one after the other: T0, T1, T2, T3. A tool with nothing to unload is skipped.
#  The temperature is the saved ZR Tools temperature of the tool (220 C when none is saved).
# =====================================================================

[gcode_macro _WM_UNLOAD]
description: State of the unload menu (nothing to run here)
variable_active: 0           # 1 while a list is being unloaded
variable_queue: ""           # tools still to do, e.g. "2,3"
variable_total: 0            # how many tools the list started with
variable_step: 0            # how many of them were handled (unloaded or skipped)
variable_current: -1         # the tool that is being unloaded now
variable_ok: 0               # 1 when the unload command of the current tool finished without an error
variable_done: ""            # tools that were unloaded, e.g. "0 1"
gcode:
    RESPOND MSG="_WM_UNLOAD only holds values"

# ---------------------------------------------------------------- close / reset
[gcode_macro _WM_UNLOAD_CLOSE]
description: Close the popup (the Cancel buttons)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if params.MSG is defined %}
        M118 {params.MSG}
    {% endif %}

[gcode_macro _WM_UNLOAD_RESET]
description: Back to idle (list cleared, ACE unload temperature back to 220)
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=queue VALUE='""'
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=total VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=step VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=current VALUE=-1
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=ok VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=done VALUE='""'
    {% if "gcode_macro _WM_ACE_UNLOAD_RUN" in printer %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE_UNLOAD_RUN VARIABLE=temp VALUE=220
    {% endif %}

# ---------------------------------------------------------------- first popup: which tool
[gcode_macro WM_UNLOAD_MENU]
description: Popup to unload one tool or all tools (ACE or not)
gcode:
    {% set u = printer["gcode_macro _WM_UNLOAD"] %}
    {% set ace = ("gcode_macro _WM_ACE" in printer) and (("ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance) in printer) and (printer["ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance].connection_state == "connected") %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("WM_UNLOAD_MENU: not while printing or paused")}
    {% elif u.active %}
        {action_raise_error("WM_UNLOAD_MENU: an unload is already running. Stop it with WM_UNLOAD_STOP")}
    {% elif ace and printer["gcode_macro _WM_ACE"].mode != "idle" %}
        {action_raise_error("WM_UNLOAD_MENU: the ACE is busy (" ~ printer["gcode_macro _WM_ACE"].mode ~ ")")}
    {% endif %}
    {% set v = printer.save_variables.variables %}
    {% set mats = {1: "PLA", 2: "PLA+", 3: "PLA Silk", 4: "PLA Matte", 5: "PLA-CF", 6: "PETG", 7: "PETG-CF", 8: "ABS", 9: "ASA", 10: "TPU", 11: "PA", 12: "PC", 13: "PVA", 14: "HIPS", 15: "PLA Metal"} %}
    {% set pal = [["White", 255, 255, 255], ["Beige", 243, 232, 200], ["Brown", 154, 103, 56], ["Grey", 199, 213, 223], ["Black", 0, 0, 0], ["Cyan", 0, 221, 227], ["Light blue", 19, 167, 232], ["Dark blue", 11, 75, 216], ["Light green", 22, 233, 0], ["Dark green", 0, 168, 79], ["Yellow", 255, 242, 0], ["Orange", 255, 90, 31], ["Light pink", 221, 191, 222], ["Magenta", 231, 45, 190], ["Red", 255, 28, 46]] %}
    {% set labels = [] %}
    {% for i in range(4) %}
        {% set mkey = "zr_t%d_mat" % i %}
        {% set ckey = "zr_t%d_color" % i %}
        {% set code = v[mkey]|int if mkey in v else 0 %}
        {% set mat = mats.get(code, "") %}
        {% set rgb = [0, 0, 0] %}
        {% set have = False %}
        {% if ckey in v and v[ckey]|int > 0 %}
            {% set c = v[ckey]|int %}
            {% set rgb = [(c // 65536) % 256, (c // 256) % 256, c % 256] %}
            {% set have = True %}
        {% endif %}
        {% if ace %}
            {% set slot = printer["ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance].slots[i] %}
            {% if mat == "" and slot.material not in ["", "Unknown"] %}
                {% set mat = slot.material %}
            {% endif %}
            {% if not have and slot.color|sum > 0 %}
                {% set rgb = slot.color %}
                {% set have = True %}
            {% endif %}
        {% endif %}
        {% set ns = namespace(best="", d=999999999) %}
        {% if have %}
            {% for p in pal %}
                {% set d = (p[1] - rgb[0]) * (p[1] - rgb[0]) + (p[2] - rgb[1]) * (p[2] - rgb[1]) + (p[3] - rgb[2]) * (p[3] - rgb[2]) %}
                {% if d < ns.d %}
                    {% set ns.d = d %}
                    {% set ns.best = p[0] %}
                {% endif %}
            {% endfor %}
        {% endif %}
        {% set lab = "T%d" % i %}
        {% if mat != "" %}
            {% set lab = lab ~ " " ~ mat %}
        {% endif %}
        {% if ns.best != "" %}
            {% set lab = lab ~ " " ~ ns.best %}
        {% endif %}
        {% set _ = labels.append(lab) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Unload filament"
    {% if ace %}
        RESPOND TYPE=command MSG="action:prompt_text ACE connected. Choose the tool to unload, or all tools one after the other."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Choose the tool to unload, or all tools one after the other."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button {labels[0]}|_WM_UNLOAD_ASK T=0|primary"
    RESPOND TYPE=command MSG="action:prompt_button {labels[1]}|_WM_UNLOAD_ASK T=1|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button {labels[2]}|_WM_UNLOAD_ASK T=2|primary"
    RESPOND TYPE=command MSG="action:prompt_button {labels[3]}|_WM_UNLOAD_ASK T=3|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button All tools|_WM_UNLOAD_ASK T=ALL|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_UNLOAD_CLOSE MSG=Cancelled|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ---------------------------------------------------------------- second popup: confirm
[gcode_macro _WM_UNLOAD_ASK]
description: Confirm popup (T=0..3 or T=ALL)
gcode:
    {% set t = params.T|default("")|string|upper %}
    {% if t == "ALL" %}
        RESPOND TYPE=command MSG="action:prompt_begin Unload all tools?"
        RESPOND TYPE=command MSG="action:prompt_text T0, T1, T2 and T3 are unloaded one after the other. A tool with nothing to unload is skipped. Each nozzle heats to its saved temperature and the tools go back to their docks at the end."
    {% elif t in ["0", "1", "2", "3"] %}
        RESPOND TYPE=command MSG="action:prompt_begin Unload T{t}?"
        RESPOND TYPE=command MSG="action:prompt_text The nozzle of T{t} heats to its saved temperature and the filament is pulled out. The tool goes back to its dock at the end."
    {% else %}
        {action_raise_error("_WM_UNLOAD_ASK: T must be 0-3 or ALL")}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Yes, unload|_WM_UNLOAD_GO T={t}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_UNLOAD_CLOSE MSG=Cancelled|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ---------------------------------------------------------------- start
[gcode_macro _WM_UNLOAD_GO]
description: _WM_UNLOAD_GO T=0..3 or T=ALL - unload one tool or all tools, one after the other
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set t = params.T|default("")|string|upper %}
    {% set u = printer["gcode_macro _WM_UNLOAD"] %}
    {% set ace = ("gcode_macro _WM_ACE" in printer) and (("ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance) in printer) and (printer["ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance].connection_state == "connected") %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("_WM_UNLOAD_GO: not while printing or paused")}
    {% elif u.active %}
        {action_raise_error("_WM_UNLOAD_GO: an unload is already running. Stop it with WM_UNLOAD_STOP")}
    {% elif ace and printer["gcode_macro _WM_ACE"].mode != "idle" %}
        {action_raise_error("_WM_UNLOAD_GO: the ACE is busy (" ~ printer["gcode_macro _WM_ACE"].mode ~ ")")}
    {% endif %}
    {% if t == "ALL" %}
        {% set q = "0,1,2,3" %}
        {% set n = 4 %}
    {% elif t in ["0", "1", "2", "3"] %}
        {% set q = t %}
        {% set n = 1 %}
    {% else %}
        {action_raise_error("_WM_UNLOAD_GO: T must be 0-3 or ALL")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=queue VALUE='"{q}"'
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=total VALUE={n}
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=step VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=current VALUE=-1
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=ok VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=done VALUE='""'
    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=active VALUE=1
    RESPOND MSG="Unload started: {'all tools' if n == 4 else 'T' ~ t}{' (ACE)' if ace else ''}"
    UPDATE_DELAYED_GCODE ID=_wm_unload_runner DURATION=0.5

# ---------------------------------------------------------------- stop
[gcode_macro WM_UNLOAD_STOP]
description: Drop the rest of the unload list. The tool that is running finishes its step.
gcode:
    {% set u = printer["gcode_macro _WM_UNLOAD"] %}
    {% if u.active %}
        RESPOND MSG="Unload stopped{' after T' ~ u.current if u.current >= 0 else ''}. The rest of the list is dropped"
        _WM_UNLOAD_RESET
    {% elif params.QUIET is not defined %}
        RESPOND MSG="Unload: nothing is running"
    {% endif %}

[gcode_macro _WM_UNLOAD_ABORT]
description: Called when the ACE reports a failure (from _WM_ACE_FAIL)
gcode:
    {% set u = printer["gcode_macro _WM_UNLOAD"] %}
    {% if u.active %}
        RESPOND TYPE=error MSG="Unload stopped at T{u.current}. The rest of the list is dropped"
        _WM_UNLOAD_RESET
    {% endif %}

# ---------------------------------------------------------------- the end of a list
[gcode_macro _WM_UNLOAD_END]
description: All tools of the list are handled - heaters off, tool back in its dock
gcode:
    {% set u = printer["gcode_macro _WM_UNLOAD"] %}
    {% for i in range(4) %}
        SET_HEATER_TEMPERATURE HEATER={'extruder' if i == 0 else 'extruder' ~ i} TARGET=0
    {% endfor %}
    {% if printer.save_variables.variables.current_extruder|int < 4 %}
        PARK_CURRENT_TOOL
    {% endif %}
    {% if u.done != "" %}
        RESPOND MSG="Unload finished: T{u.done|replace(' ', ' T')} unloaded"
    {% else %}
        RESPOND MSG="Unload finished: nothing was unloaded"
    {% endif %}
    _WM_UNLOAD_RESET

# ---------------------------------------------------------------- the runner: one tool after the other
[delayed_gcode _wm_unload_runner]
gcode:
    {% set u = printer["gcode_macro _WM_UNLOAD"] %}
    {% set ace = ("gcode_macro _WM_ACE" in printer) and (("ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance) in printer) and (printer["ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance].connection_state == "connected") %}
    {% if u.active %}
        {% if printer.print_stats.state in ["printing", "paused"] %}
            RESPOND TYPE=error MSG="Unload stopped: a print started"
            _WM_UNLOAD_RESET
        {% elif ace and printer["gcode_macro _WM_ACE"].mode != "idle" %}
            UPDATE_DELAYED_GCODE ID=_wm_unload_runner DURATION=1
        {% else %}
            {% set ns = namespace(failed=0, done=u.done) %}
            {% if u.current >= 0 %}
                {% if u.ok == 1 %}
                    RESPOND MSG="Unload: T{u.current} unloaded"
                    {% set ns.done = (u.done ~ " " ~ u.current)|trim %}
                    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=done VALUE='"{ns.done}"'
                    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=current VALUE=-1
                    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=ok VALUE=0
                {% else %}
                    {% set ns.failed = 1 %}
                    RESPOND TYPE=error MSG="Unload stopped at T{u.current}: the unload did not finish, see the message above. The rest of the list is dropped"
                    _WM_UNLOAD_RESET
                {% endif %}
            {% endif %}
            {% if ns.failed == 0 %}
                {% set q = u.queue.split(",") if u.queue else [] %}
                {% if q|length == 0 %}
                    _WM_UNLOAD_END
                {% else %}
                    {% set t = q[0]|int %}
                    {% set rest = q[1:] %}
                    {% set step = u.step + 1 %}
                    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=queue VALUE='"{rest|join(",")}"'
                    SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=step VALUE={step}
                    {% set sname = "filament_switch_sensor filament%d" % t %}
                    {% set head = printer[sname].filament_detected if sname in printer else True %}
                    {% set skip = not head %}
                    {% if skip %}
                        RESPOND MSG="Unload: T{t} has nothing to unload, skipped ({step} of {u.total})"
                        UPDATE_DELAYED_GCODE ID=_wm_unload_runner DURATION=0.2
                    {% else %}
                        {% set v = printer.save_variables.variables %}
                        {% set tkey = "zr_t%d_temp" % t %}
                        {% set saved = v[tkey]|int if tkey in v else 0 %}
                        {% set temp = saved if saved >= 180 else 220 %}
                        RESPOND MSG="Unloading T{t} ({step} of {u.total}) at {temp} C"
                        SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=current VALUE={t}
                        SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=ok VALUE=0
                        UPDATE_DELAYED_GCODE ID=_wm_unload_runner DURATION=1
                        {% if ace %}
                            SET_GCODE_VARIABLE MACRO=_WM_ACE_UNLOAD_RUN VARIABLE=temp VALUE={temp}
                            ACE_WM_UNLOAD T={t}
                        {% else %}
                            ZR_RETRACT T={t} TEMP={temp}
                        {% endif %}
                        SET_GCODE_VARIABLE MACRO=_WM_UNLOAD VARIABLE=ok VALUE=1
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}


# ======================================================================================================================
# ===== SET_GCODE_OFFSET wrapper (was in rpi_pi.cfg)
# ======================================================================================================================

# ---------------------------------------------------------------- SET_GCODE_OFFSET while Z is not homed
# WM's tool change ends with SET_GCODE_OFFSET X Y Z MOVE=1 (the new tool's offsets). While Z is not homed that move is refused
# ("Must home axis first") and the tool change aborts after the tool is already mounted. While Z is not homed nothing is known about
# Z anyway, so this wrapper sets the offsets WITHOUT the move then. With Z homed it passes everything through unchanged.
[gcode_macro SET_GCODE_OFFSET]
rename_existing: _WM_SET_GCODE_OFFSET
gcode:
    {% if "gcode_macro _WM_LIVEZ_SGO" in printer %}
        # live Z adjust per tool (rpi_zoffset.cfg of WM_Ultra_Vanilla_Klipper): it does the same pass-through and keeps a Z_ADJUST per tool
        _WM_LIVEZ_SGO {rawparams}
    {% elif "z" not in printer.toolhead.homed_axes %}
        _WM_SET_GCODE_OFFSET {rawparams|replace("MOVE=1", "MOVE=0")|replace("move=1", "move=0")|replace("Move=1", "MOVE=0")}
    {% else %}
        _WM_SET_GCODE_OFFSET {rawparams}
    {% endif %}

# ---------------------------------------------------------------- heat at the wipe position (called by M109 and _WAIT_TOOL_TEMPERATURE)
# During a print (its start and a pause too) a nozzle that still has to heat waits at the wipe position, so what drips while it
# heats falls there and not on the part or the bed. Only the nozzle on the carriage, only when it is more than min_below C under
# its target, only with X Y Z homed. After the heating _WM_HEAT_BACK puts it back where it was (2 mm higher on the way), so the
# macro that asked for the heat goes on exactly as before.
[gcode_macro _WM_HEAT_AT_WIPE]
description: T=heater number S=target: go to the wipe position before waiting for the nozzle on the carriage (in a print only)
variable_back: 0                 # 1 = the nozzle was moved and _WM_HEAT_BACK has to bring it back
variable_ox: 0.0                 # where it was (G-code X and Y)
variable_oy: 0.0
variable_min_below: 5.0          # C  no trip when the nozzle is closer than this to its target
variable_speed: 12000            # mm/min
variable_hop: 2.0                # mm  Z lift for the trip (after a tool change the nozzle already stands on the part)
variable_hopped: 0.0             # mm  lift really made (0 near the top of the printer)
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set s = params.S|default(0)|float %}
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% set ename = "extruder" if t == 0 else "extruder" ~ t %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if t == cur and t >= 0 and t <= 3 and s > 0 and ename in printer and printer[ename].temperature < s - min_below|float
          and printer.print_stats.state in ["printing", "paused"] and "x" in homed and "y" in homed and "z" in homed %}
        {% set wp = printer.save_variables.variables.wipe_position|default([-13.0, 240.0]) %}
        {% set p = printer.gcode_move.gcode_position %}
        SET_GCODE_VARIABLE MACRO=_WM_HEAT_AT_WIPE VARIABLE=ox VALUE={p.x}
        SET_GCODE_VARIABLE MACRO=_WM_HEAT_AT_WIPE VARIABLE=oy VALUE={p.y}
        SET_GCODE_VARIABLE MACRO=_WM_HEAT_AT_WIPE VARIABLE=back VALUE=1
        RESPOND MSG="T{t} heats to {s|int} C at the wipe position"
        SAVE_GCODE_STATE NAME=_wm_heat
        {% set lift = hop|float if (printer.toolhead.position.z + hop|float) < printer.toolhead.axis_maximum.z else 0.0 %}
        SET_GCODE_VARIABLE MACRO=_WM_HEAT_AT_WIPE VARIABLE=hopped VALUE={lift}
        {% if lift > 0 %}
            G91
            G1 Z{lift} F900
        {% endif %}
        G90
        G0 Y{wp[1]} F{speed}
        G0 X{wp[0]} F{speed}
    {% elif back|int != 0 %}
        # left over from a wait that was stopped (cancel, error): never go back to an old position
        SET_GCODE_VARIABLE MACRO=_WM_HEAT_AT_WIPE VARIABLE=back VALUE=0
    {% endif %}

[gcode_macro _WM_HEAT_BACK]
description: After the heating: back to where the nozzle was before _WM_HEAT_AT_WIPE moved it
gcode:
    {% set w = printer["gcode_macro _WM_HEAT_AT_WIPE"] %}
    {% if w.back|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_WM_HEAT_AT_WIPE VARIABLE=back VALUE=0
        G90
        G0 X{w.ox} F{w.speed}
        G0 Y{w.oy} F{w.speed}
        {% if w.hopped|float > 0 %}
            G91
            G1 Z-{w.hopped} F900
            G90
        {% endif %}
        RESTORE_GCODE_STATE NAME=_wm_heat
    {% endif %}
