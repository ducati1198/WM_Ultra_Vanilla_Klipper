# rpi_virtual_pins.cfg  -  virtual output pins for on / off switches in Fluidd and KlipperScreen
#
# A virtual pin exists only in software. An [output_pin] on a "wm_pin:" pin shows as a switch under Outputs.
# The driver is wm_virtual_pins.py (klippy/extras). It does not need the ACE driver and does not clash with it:
# the ACE driver's own virtual pins use the name "virtual_pin:", these use "wm_pin:".
# This file must be included before any file that uses a "wm_pin:" pin (rpi_zoffset.cfg).
[wm_virtual_pins]
