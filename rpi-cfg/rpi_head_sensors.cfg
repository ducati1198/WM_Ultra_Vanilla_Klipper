# rpi_head_sensors.cfg  -  head filament sensors of the docked tools back on when no print runs (fixes B-021)
#
# WonderMaker's tool change (_CHECK_CHANGE_TOOL in change_macros.cfg) calls _ENABLE_SENSOR after every pick-up. It switches the
# head filament sensors filament0..3 OFF and only the one of the tool just picked up ON. That is right during a print: a docked
# tool must not pause the print or start its load routine. But nothing switched them on again, so after any tool change (also the
# T0 pick-up of G28) filament pushed into a docked tool by hand did not start the load (tested 2026-11-15 17:11 with T1 and T2).
#
# WM_HEAD_SENSOR_WATCH (every 2 s) switches every head sensor that is OFF back ON when:
#   no print is running or paused, no tool change is running (changing_tool 0), the ACE macros are idle, and Klipper is not busy
#   (idle_timeout not Printing). During a print or a pause nothing is touched, the factory behaviour stays.
# A sensor switched on with filament already inside does not start a load (Klipper only reacts to a change of the sensor).
#
# Queue (fixes B-031): stock Klipper starts insert_gcode only when Klipper is not busy. A filament pushed into a second tool
# while another tool is loading is dropped and never comes back. Each insert_gcode (extruder0-3.cfg) now starts with
# _WM_HEAD_MARK T=n ("Klipper started the load of Tn"). The watcher remembers the filament state of every tool. When a tool got
# filament but no mark came, and the printer is idle (no print, no pause, no tool change, ACE idle, Klipper not busy) for two
# checks in a row, the tool goes into the queue. The first tool of the queue is loaded with _WM_HEAD_LOAD (the same steps as the
# factory insert_gcode), one after the other, in the order they were inserted. Nothing is queued during a print or a pause.

[gcode_macro _WM_HEAD_QUEUE]
description: State of the head sensor watcher and the load queue (do not run)
variable_prev: [-1, -1, -1, -1]  # filament seen at the last check, -1 = not known yet
variable_marks: [0, 0, 0, 0]     # 1 = Klipper started the insert_gcode of this tool since the last check
variable_cand: [0, 0, 0, 0]      # idle checks in a row that saw new filament without a mark
variable_queue: []               # tools waiting for their load, in the order they were inserted
gcode:
    RESPOND MSG="_WM_HEAD_QUEUE holds the state of WM_HEAD_SENSOR_WATCH"

[gcode_macro _WM_HEAD_MARK]
description: First line of each insert_gcode (extruder0-3.cfg): Klipper started the load of tool T
gcode:
    {% set t = params.T|int %}
    {% set m = printer["gcode_macro _WM_HEAD_QUEUE"].marks %}
    {% set new = [] %}
    {% for i in range(m|length) %}
        {% set _ = new.append(1 if i == t else m[i]) %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=marks VALUE="{new}"

[gcode_macro _WM_HEAD_LOAD]
description: Load of a queued tool T: the same steps as the factory insert_gcode in extruderN.cfg
gcode:
    {% set t = params.T|int %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% set key = "filament_switch_sensor filament%d" % t %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND MSG="Queued load of T{t} skipped, a print is running"
    {% elif key not in printer or not printer[key].filament_detected %}
        RESPOND MSG="Queued load of T{t} skipped, the T{t} head has no filament any more"
    {% elif "gcode_macro _WM_ACE" in printer and printer["gcode_macro _WM_ACE"].mode != "idle" %}
        RESPOND MSG="Queued load of T{t} skipped, the ACE is busy"
    {% else %}
        {% if "gcode_macro _WM_ACE_HEAD" in printer %}
            _WM_ACE_HEAD T={t}
        {% endif %}
        RESPOND MSG="Push filament until resistance is felt after blue light turns on (Load operation required before printing)"
        UPDATE_DELAYED_GCODE ID=delayed_pause{t} DURATION=0
        ACTIVATE_EXTRUDER EXTRUDER={en}
        SAVE_VARIABLE VARIABLE=if_check_extruder_status value=0
        {% if "gcode_macro _WM_ACE_GRAB" in printer %}
            _WM_ACE_GRAB T={t}
        {% endif %}
        filament_insert
        SAVE_VARIABLE VARIABLE=if_check_extruder_status value=1
        M104 S220 T{t}
        T{t}
        M109 S220 T{t}
        filament_insert_gcode T={t}
        M104 S0 T{t}
        PARK_CURRENT_TOOL
        {% if "gcode_macro _WM_ACE_HEAD_DONE" in printer %}
            _WM_ACE_HEAD_DONE T={t}
        {% endif %}
    {% endif %}

[delayed_gcode WM_HEAD_SENSOR_WATCH]
initial_duration: 12
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set n = sv.thr_number|default(4)|int %}
    {% set q = printer["gcode_macro _WM_HEAD_QUEUE"] %}
    {% set in_print = printer.print_stats.state in ["printing", "paused"] %}
    {% set ace_busy = "gcode_macro _WM_ACE" in printer and printer["gcode_macro _WM_ACE"].mode != "idle" %}
    {% set busy = in_print or ace_busy
        or sv.changing_tool|default(0)|int == 1
        or printer.idle_timeout.state == "Printing" %}
    {% set ns = namespace(off=[], prev=[], marks=[], cand=[], queue=q.queue, added=[]) %}
    {% for t in range(4) %}
        {% set key = "filament_switch_sensor filament%d" % t %}
        {% set f = 1 if (t < n and key in printer and printer[key].filament_detected) else 0 %}
        {% set p = q.prev[t]|int %}
        {% set m = q.marks[t]|int %}
        {% set c = q.cand[t]|int %}
        {% if in_print or ace_busy or p < 0 or f == 0 %}
            # during a print, a pause or an ACE load nothing is queued; no filament = nothing to load
            {% set m, c = 0, 0 %}
            {% if f == 0 and t in ns.queue %}
                {% set ns.queue = ns.queue|reject("equalto", t)|list %}
            {% endif %}
        {% elif p == 0 %}
            # new filament since the last check: handled when Klipper started its insert_gcode, else watch it
            {% set c = 0 if m == 1 else 1 %}
            {% set m = 0 %}
        {% elif c > 0 %}
            {% if m == 1 %}
                {% set m, c = 0, 0 %}
            {% elif not busy %}
                {% set c = c + 1 %}
                {% if c >= 2 %}
                    {% set c = 0 %}
                    {% if t not in ns.queue %}
                        {% set ns.queue = ns.queue + [t] %}
                        {% set ns.added = ns.added + ["T%d" % t] %}
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
        {% set ns.prev = ns.prev + [f] %}
        {% set ns.marks = ns.marks + [m] %}
        {% set ns.cand = ns.cand + [c] %}
        {% if not busy and t < n and key in printer and not printer[key].enabled %}
            SET_FILAMENT_SENSOR SENSOR=filament{t} ENABLE=1
            {% set ns.off = ns.off + ["T%d" % t] %}
        {% endif %}
    {% endfor %}
    {% if ns.off|length > 0 %}
        RESPOND MSG="Head filament sensors back on for {ns.off|join(', ')} (no print running)"
    {% endif %}
    {% if ns.added|length > 0 %}
        RESPOND MSG="Filament inserted in {ns.added|join(', ')} while the printer was busy. It is loaded when the printer is free"
    {% endif %}
    {% set go = -1 %}
    {% if not busy and ns.queue|length > 0 and ns.added|length == 0 %}
        {% set go = ns.queue[0] %}
        {% set ns.queue = ns.queue[1:] %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=prev VALUE="{ns.prev}"
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=marks VALUE="{ns.marks}"
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=cand VALUE="{ns.cand}"
    SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=queue VALUE="{ns.queue}"
    UPDATE_DELAYED_GCODE ID=WM_HEAD_SENSOR_WATCH DURATION=2
    {% if go >= 0 %}
        RESPOND MSG="Loading T{go} now (it was inserted while the printer was busy)"
        _WM_HEAD_LOAD T={go}
    {% endif %}
