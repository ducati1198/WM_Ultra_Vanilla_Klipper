# Tool head LEDs with the FACTORY macros: _RGB_CURRENT (green) for the tool on the carriage when it has filament, _RGB_LOAD (blue) for other tools with
# filament in their tool head, _RGB_UNLOAD (red) when a tool has none.
# The factory screen called these itself. On the Pi nothing did, so the LEDs stayed dark.
# Checked every 2 seconds, but a factory macro is only called when the state of a tool CHANGES (remembered in _WM_LED_STATE): Klipper
# ignores a "filament inserted" event while its idle state is "Printing", and an LED call (SYNC) keeps it there for a moment, so
# a call every 2 s would stop the automatic load. Uses WM's [neopixel T0_RGB] .. T3_RGB, _RGB_* macros and [filament_switch_sensor filament0] .. 3.
[gcode_macro _WM_LED_STATE]
variable_seen: [-1, -1, -1, -1]      # last state per tool: 1 filament, 0 none, -1 not set yet
gcode:

[delayed_gcode WM_TOOL_LEDS]
initial_duration: 5
gcode:
    {% set st = printer["gcode_macro _WM_LED_STATE"].seen %}
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% set ns = namespace(l=[]) %}
    {% for t in range(printer.save_variables.variables.thr_number|default(4)|int) %}
        {% set s = printer["filament_switch_sensor filament%d" % t] %}
        {% set has = (s is defined and s.filament_detected) %}
        {% set now = 2 if (has and t == cur) else (1 if has else 0) %}
        {% if st[t] != now %}
            {% if now == 2 %}
                _RGB_CURRENT T={t}
            {% elif now == 1 %}
                _RGB_LOAD T={t}
            {% else %}
                _RGB_UNLOAD T={t}
            {% endif %}
        {% endif %}
        {% set ns.l = ns.l + [now] %}
    {% endfor %}
    {% for t in range(ns.l|length, 4) %}
        {% set ns.l = ns.l + [st[t]] %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_WM_LED_STATE VARIABLE=seen VALUE=[{ns.l|join(",")}]
    UPDATE_DELAYED_GCODE ID=WM_TOOL_LEDS DURATION=2
