# rpi_timelapse.cfg: timelapse settings window (WM_TIMELAPSE), e-step window model (F-232)
# Moonraker holds the real settings; wm_timelapse.py changes them and reopens the window.
# The encoder preset is locked by moonraker.conf, so Quality changes the CRF only.

# ---- INDEX (auto, wm_cfg_index.py) ----
# rpi_timelapse.cfg: 11 macros (1 visible in Fluidd, 10 hidden with a leading underscore)
# Visible:
#   WM_TIMELAPSE                       - Timelapse settings window: video quality, mode, head parking
# Hidden helpers:
#   _WM_TL_STATE                       - Remembers that a timelapse setting was changed while the window was open
#   _WM_TL_SHOW                        - Reopen the timelapse main window with the current settings (Back buttons)
#   _WM_TL_CANCEL                      - Cancel in the timelapse window: close it without restarting Klipper
#   _WM_TL_CLOSE                       - Close the timelapse window; restart Klipper when a setting was changed and no print is run
#   _WM_TL_MAIN                        - Timelapse main window, opened by the helper with the current settings
#   _WM_TL_QUALITY                     - Timelapse video quality choice (the picked one is green)
#   _WM_TL_MODE                        - Timelapse mode choice: every layer or by time
#   _WM_TL_PARK                        - Timelapse head parking choice
#   _WM_TL_SET                         - _WM_TL_SET K=quality|mode|park V=value - save one timelapse setting, then reopen the windo
#   _WM_TL_INFO                        - What it does window of WM_TIMELAPSE
# ---- END INDEX ----


[gcode_shell_command wm_timelapse]
command: bash -c 'exec python3 "$HOME/printer_data/wm-tools/wm_timelapse.py" "$@"' wm_timelapse
timeout: 10.0
verbose: False

[gcode_macro _WM_TL_STATE]
description: Remembers that a timelapse setting was changed while the window was open
variable_changed: 0
gcode:
    {% set x = 0 %}

[gcode_macro _WM_TL_SHOW]
description: Reopen the timelapse main window with the current settings (Back buttons)
gcode:
    RUN_SHELL_COMMAND CMD=wm_timelapse PARAMS="show"

[gcode_macro _WM_TL_CANCEL]
description: Cancel in the timelapse window: close it without restarting Klipper
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer["gcode_macro _WM_TL_STATE"].changed|int == 1 %}
        M118 Timelapse window closed. Your choices are saved but Klipper was not restarted.
    {% else %}
        M118 Timelapse window closed.
    {% endif %}

[gcode_macro _WM_TL_CLOSE]
description: Close the timelapse window; restart Klipper when a setting was changed and no print is running
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer["gcode_macro _WM_TL_STATE"].changed|int == 1 %}
        {% if printer.print_stats.state in ["printing", "paused"] %}
            M118 Timelapse settings are saved. Klipper was not restarted because a print is running. Restart it after the print.
        {% else %}
            M118 Timelapse settings are saved. Restarting Klipper to load them...
            SET_GCODE_VARIABLE MACRO=_WM_TL_STATE VARIABLE=changed VALUE=0
            RESTART
        {% endif %}
    {% else %}
        M118 Timelapse: nothing was changed.
    {% endif %}

[gcode_macro WM_TIMELAPSE]
description: Timelapse settings window: video quality, mode, head parking
gcode:
    {% if 'gcode_shell_command wm_timelapse' not in printer.configfile.settings %}
        {action_raise_error("WM_TIMELAPSE: the wm_timelapse helper is missing")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_TL_STATE VARIABLE=changed VALUE=0
    RUN_SHELL_COMMAND CMD=wm_timelapse PARAMS="show"

[gcode_macro _WM_TL_MAIN]
description: Timelapse main window, opened by the helper with the current settings
gcode:
    {% set en = params.EN|default(1)|int %}
    {% set mode = params.MODE|default("layermacro") %}
    {% set crf = params.CRF|default(23)|int %}
    {% set park = params.PARK|default(0)|int %}
    {% set fps = params.FPS|default(30) %}
    {% set cyc = params.CYC|default(30) %}
    {% set q = "Fast" if crf == 26 else ("Better" if crf == 20 else ("Best" if crf == 17 else "Custom, CRF " ~ crf)) %}
    {% set m = "Every layer" if mode == "layermacro" else "Every " ~ cyc ~ " seconds" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Timelapse"
    RESPOND TYPE=command MSG="action:prompt_text Now: {'On' if en else 'Off'}, {m}."
    RESPOND TYPE=command MSG="action:prompt_text Video: {q} quality, {fps} fps. Head parking: {'On' if park else 'Off'}."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Quality|_WM_TL_QUALITY CRF={crf}|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Mode|_WM_TL_MODE MODE={mode}|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Head parking|_WM_TL_PARK PARK={park}|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button What it does|_WM_TL_INFO|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Save and restart|_WM_TL_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_TL_CANCEL|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_TL_QUALITY]
description: Timelapse video quality choice (the picked one is green)
gcode:
    {% set crf = params.CRF|default(23)|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Video quality"
    RESPOND TYPE=command MSG="action:prompt_text Better takes longer to make the video after the print."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Fast, small file|_WM_TL_SET K=quality V=fast|{'primary' if crf == 26 else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button Better|_WM_TL_SET K=quality V=better|{'primary' if crf == 20 else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button Best, slow|_WM_TL_SET K=quality V=best|{'primary' if crf == 17 else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_TL_SHOW|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_PROMPT_CLOSE MSG=Cancelled|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_TL_MODE]
description: Timelapse mode choice: every layer or by time
gcode:
    {% set mode = params.MODE|default("layermacro") %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Timelapse mode"
    RESPOND TYPE=command MSG="action:prompt_text Every layer takes one photo at each layer. By time takes one photo every 30 seconds."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Every layer|_WM_TL_SET K=mode V=layer|{'primary' if mode == 'layermacro' else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button By time|_WM_TL_SET K=mode V=time|{'primary' if mode != 'layermacro' else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_TL_SHOW|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_PROMPT_CLOSE MSG=Cancelled|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_TL_PARK]
description: Timelapse head parking choice
gcode:
    {% set park = params.PARK|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Head parking"
    RESPOND TYPE=command MSG="action:prompt_text On: the head moves to the back right for each photo, so the part is clear. Off is faster but can leave small marks."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Parking on|_WM_TL_SET K=park V=on|{'primary' if park else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button Parking off|_WM_TL_SET K=park V=off|{'secondary' if park else 'primary'}"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_TL_SHOW|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_PROMPT_CLOSE MSG=Cancelled|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_TL_SET]
description: _WM_TL_SET K=quality|mode|park V=value - save one timelapse setting, then reopen the window
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_VARIABLE MACRO=_WM_TL_STATE VARIABLE=changed VALUE=1
    RUN_SHELL_COMMAND CMD=wm_timelapse PARAMS="set {params.K|default('')} {params.V|default('')}"

[gcode_macro _WM_TL_INFO]
description: What it does window of WM_TIMELAPSE
gcode:
    _WM_WIN_INFO TITLE="Timelapse" L1="Quality: Fast, Better or Best. Better and Best take longer to make the video after the print. The video is made by the printer by itself." L2="Mode: a photo at every layer, or one every 30 seconds." L3="Head parking: moves the head out of the way for each photo. Slower, but no marks on the part." L4="When you click Save and restart after a change, Klipper restarts to load the settings (not during a print). The video is saved in the Timelapse files." BACK="_WM_TL_SHOW"
