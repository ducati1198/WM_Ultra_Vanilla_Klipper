#   _WM_AUTO_SPEED_RESULT              - Window with the last speed test result: Check first, Save (writes printer.cfg), Do not sav
#   _WM_AUTO_SPEED_SAVE                - Writes ACCEL and VELOCITY into [printer] of printer.cfg (Save button of the speed test win
#   _WM_AUTO_SPEED_RESTART             - Restarts Klipper after the speed limits were saved (refused while a print runs)
#   _WM_AUTO_SPEED_SHAPER              - Calibrate input shaper button (WM_VIBRATION_COMP, SAVE_CONFIG restarts Klipper, then the s
#   _WM_AUTO_SPEED_REOPEN             [delayed] 
#   _WM_ESTEP                          - State of the e-step calibration (not a command, shows the state)
#   _WM_ESTEP_OFF                     [delayed] 
#   _WM_ESTEP_START                    - Tool button of the e-step window: checks, remembers the tool and its rotation_distance, ta
#   _WM_ESTEP_POS                      - E-step: puts the chosen tool on the carriage (no tool on it: picks it up), homes only when
