[gcode_shell_command wm_nozzle]
command: bash -c 'exec python3 "$HOME/printer_data/wm-tools/wm_nozzle.py" "$@"' wm_nozzle
timeout: 10.0
verbose: True

[gcode_shell_command wm_canids]
command: bash -c 'exec python3 "$HOME/printer_data/wm-tools/wm_canids.py" "$@"' wm_canids
timeout: 10.0
verbose: True

# ------------------------------------------------------------------ Nozzle Type

[gcode_macro _WM_NOZZLE_TYPE]
description: Set the nozzle material and diameter of a tool head, in a Fluidd window (app: General > Nozzle Type)
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nozzle Type not started.")}
    {% endif %}
    {% set vars = printer.save_variables.variables %}
    {% set count = vars.thr_number|default(4)|int %}
    {% set info = [] %}
    {% for t in range(count) %}
        {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
        {% set dia = printer.configfile.settings[hn].nozzle_diameter|default(0)|float if hn in printer.configfile.settings else 0 %}
        {% set ty = vars['nozzle_type%d' % t]|default(0)|int %}
        {% set _ = info.append("Nozzle %d: %s, %s mm" % (t + 1, "stainless steel" if ty == 1 else "hardened steel", dia)) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle Type"
    RESPOND TYPE=command MSG="action:prompt_text Tell the printer which nozzle is on which tool head. Now: {info|join(' | ')}."
    RESPOND TYPE=command MSG="action:prompt_text Pick the nozzle you changed. Next you choose its material and its diameter. Nothing is written until you confirm at the end."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for t in range(count) %}
        RESPOND TYPE=command MSG="action:prompt_button Nozzle {t + 1}|_WM_NOZZLE_MATERIAL T={t}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_MATERIAL]
description: Nozzle Type, step 2: material of nozzle T (0-3)
gcode:
    {% set t = params.T|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1}: material"
    RESPOND TYPE=command MSG="action:prompt_text Hardened steel is for abrasive filaments (carbon fiber, glow in the dark). Stainless steel is the normal nozzle."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Hardened steel|_WM_NOZZLE_DIAMETER T={t} TYPE=0|primary"
    RESPOND TYPE=command MSG="action:prompt_button Stainless steel|_WM_NOZZLE_DIAMETER T={t} TYPE=1|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_NOZZLE_TYPE"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_DIAMETER]
description: Nozzle Type, step 3: diameter of nozzle T (0-3), material TYPE (0 hardened, 1 stainless)
gcode:
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1}: diameter"
    RESPOND TYPE=command MSG="action:prompt_text Diameter of the nozzle you put on tool head {t + 1}."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 0.2 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.2|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.4 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.4|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.6 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.6|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.8 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.8|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_NOZZLE_MATERIAL T={t}"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_SURE]
description: Nozzle Type, step 4: show what will be written
gcode:
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    {% set d = params.D|default(0.4)|float %}
    RESPOND TYPE=command MSG="action:prompt_begin Confirm Nozzle {t + 1}"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {t + 1}: {'stainless steel' if ty == 1 else 'hardened steel'}, {d} mm."
    RESPOND TYPE=command MSG="action:prompt_text This saves the material in saved_variables.cfg and sets nozzle_diameter in printer.cfg (a copy of printer.cfg is kept). Klipper must be restarted afterwards to read the diameter."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Apply|_WM_NOZZLE_APPLY T={t} TYPE={ty} D={d}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_APPLY]
description: Nozzle Type, last step: write the material and the diameter
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nothing was changed.")}
    {% endif %}
    {% if 'gcode_shell_command wm_nozzle' not in printer.configfile.settings %}
        {action_raise_error("The wm_nozzle shell command is not loaded. Run ./installer.sh --rpi-cfg and restart Klipper.")}
    {% endif %}
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    {% set d = params.D|default(0.4)|float %}
    SAVE_VARIABLE VARIABLE=nozzle_type{t} VALUE={ty}
    RUN_SHELL_COMMAND CMD=wm_nozzle PARAMS="set {t} {d} {ty}"
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1} saved"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {t + 1} is now {'stainless steel' if ty == 1 else 'hardened steel'}, {d} mm. Klipper reads the new diameter when it restarts."
    RESPOND TYPE=command MSG="action:prompt_text If you changed the nozzle itself, run WM_NOZZLE_FULL_PID (hotend PID) and the extruder offsets afterwards, because the new nozzle sits a little differently."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Restart Klipper now|_WM_RESTART_KLIPPER|primary"
    RESPOND TYPE=command MSG="action:prompt_button Set another nozzle|_WM_NOZZLE_TYPE|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Later|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ------------------------------------------------------------------ Change nozzles (Pi only)

[gcode_macro WM_NOZZLE_CHANGE]
description: Release the tool heads so you can change nozzles, in a Fluidd window (Pi only: the app has no such page)
gcode:
    _WM_NCHANGE_CHECK
    RESPOND TYPE=command MSG="action:prompt_begin Change nozzles"
    RESPOND TYPE=command MSG="action:prompt_text Operating instructions: please hang the extruders on the rear support, and avoid tangling of the wires."
    RESPOND TYPE=command MSG="action:prompt_text What happens when you click Next: the printer turns the tool change check off (is_nozzle_setting = 1), moves the tool that is on the carriage to its dock and unlocks it. Nothing heats. Then you take the tool heads out and work on the nozzles."
    RESPOND TYPE=command MSG="action:prompt_text When you are done you click Done, and the next window lets you record the new nozzle (material and diameter). After a nozzle change also tune the hotend (WM_NOZZLE_FULL_PID) and the extruder offsets (WM_OFFSETS_RAPID)."
    RESPOND TYPE=command MSG="action:prompt_text Before you start: heaters off and hotends cold (below 50 C), bed clear, hand ready to hold the tool when it is released. When you finish, put the tools back in their docks and click Done. If you close this window before that, the tool change check stays off: type _WM_NOZZLE_CHANGE_END to turn it on again."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Next|_WM_NCHANGE_RUN|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NCHANGE_CHECK]
description: Stop unless it is safe to release the tool heads
gcode:
    {% macro fail(why) %}
        {% set _ = action_respond_info("action:prompt_begin Cannot start") %}
        {% set _ = action_respond_info("action:prompt_text " ~ why) %}
        {% set _ = action_respond_info("action:prompt_text Nothing was changed.") %}
        {% set _ = action_respond_info("action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end") %}
        {% set _ = action_respond_info("action:prompt_show") %}
        {action_raise_error(why)}
    {% endmacro %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {fail("A print is running or paused. Nozzle change not started.")}
    {% endif %}
    {% for h in printer.heaters.available_heaters %}
        {% if printer[h].target|float > 0 %}
            {fail("%s has a target of %s C. Turn it off first (_WM_CAL_STOP in the console), then start again." % (h, printer[h].target))}
        {% endif %}
        {% if h.startswith('extruder') and printer[h].temperature|float > 50 %}
            {fail("%s is still at %s C. Wait until it is below 50 C." % (h, printer[h].temperature|float|round(0)|int))}
        {% endif %}
    {% endfor %}

[gcode_macro _WM_NCHANGE_RUN]
description: Change nozzles, step 2: tool change check off, park and unlock the tool on the carriage
gcode:
    _WM_NCHANGE_CHECK
    {% set vars = printer.save_variables.variables %}
    {% set current = vars.current_extruder|default(99)|int %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_NCHANGE_FAILED REASON="WonderMaker's tool change error flag (fail_flag) is {vars.fail_flag}. The printer needs that cleared before it moves a tool."
    {% else %}
        {% if current != 99 %}
            RESPOND MSG="Parking tool T{current} in its dock and unlocking it..."
            _UNLOCK_TOOL T={current}
            M400
        {% endif %}
        _WM_NCHANGE_AFTER
    {% endif %}

[gcode_macro _WM_NCHANGE_AFTER]
description: Change nozzles, step 3: tell the result of the unlock
gcode:
    {% set vars = printer.save_variables.variables %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_NCHANGE_FAILED REASON="The unlock did not succeed (fail_flag {vars.fail_flag}, tool T{vars.fail_tool}). Check that the tool is seated in its dock."
    {% else %}
        SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=1
        RESPOND TYPE=command MSG="action:prompt_begin Change nozzles: tools released"
        RESPOND TYPE=command MSG="action:prompt_text The carriage is free. Hang the tool heads on the rear support, mind the wires, and change the nozzles."
        RESPOND TYPE=command MSG="action:prompt_text When you are done, put every tool back in its dock and click Done. The printer then turns the tool change check on again and tells you if a dock looks empty. The next window lets you record the new nozzles (material and diameter)."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Done|_WM_NOZZLE_CHANGE_END|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _WM_NCHANGE_FAILED]
description: Nozzle change stopped: put the switch back and say why
gcode:
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle change stopped"
    RESPOND TYPE=command MSG="action:prompt_text {params.REASON}"
    RESPOND TYPE=command MSG="action:prompt_text The tool change check is on again (is_nozzle_setting = 0). Nothing else was changed."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_CHANGE_END]
description: Finish the nozzle change: tool change check back on (is_nozzle_setting = 0), and a look at the docks
gcode:
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set empty = [] %}
    {% for t in range(count) %}
        {% if 'filament_switch_sensor docked%d' % t in printer.configfile.settings %}
            {% if not printer['filament_switch_sensor docked%d' % t].filament_detected %}
                {% set _ = empty.append(t + 1) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle change finished"
    {% if empty|length > 0 %}
        RESPOND TYPE=command MSG="action:prompt_text The dock sensor of tool head {empty|join(', ')} shows an empty dock. Put it back in its dock before you print or change tools."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Every tool head is seen in its dock. The tool change check is on again."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text If you changed a nozzle, record it with the Nozzle Type button, then tune the hotend (WM_NOZZLE_FULL_PID) and the extruder offsets (WM_OFFSETS_RAPID)."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Nozzle Type|_WM_NOZZLE_TYPE|primary"
    RESPOND TYPE=command MSG="action:prompt_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ------------------------------------------------------------------ Extruder Setup (the screen's page: instructions + Set Up = matching)

[gcode_macro _WM_MATCH_STATE]
description: Memory of WM_EXTRUDER_SETUP (Set Up): the dock that was empty after each pick (do not run)
variable_actual: []                           # for each pick so far, the number of the dock that was empty afterwards
variable_next: 0                              # number of the tool to pick up next (0 to 3)
gcode:

[delayed_gcode _WM_MATCH_NEXT]
gcode:
    _WM_MATCH_STEP N={printer["gcode_macro _WM_MATCH_STATE"].next|int}

[gcode_macro _WM_MATCH_CHECK]
description: Stop unless the matching can start
gcode:
    {% macro fail(why) %}
        {% set _ = action_respond_info("action:prompt_begin Cannot start") %}
        {% set _ = action_respond_info("action:prompt_text " ~ why) %}
        {% set _ = action_respond_info("action:prompt_text Nothing was changed.") %}
        {% set _ = action_respond_info("action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end") %}
        {% set _ = action_respond_info("action:prompt_show") %}
        {action_raise_error(why)}
    {% endmacro %}
    _WM_NCHANGE_CHECK
    {% set vars = printer.save_variables.variables %}
    {% set count = vars.thr_number|default(4)|int %}
    {% if 'gcode_shell_command wm_canids' not in printer.configfile.settings %}
        {fail("The wm_canids shell command is not loaded. Run ./installer.sh --rpi-cfg and restart Klipper.")}
    {% endif %}
    {% if vars.is_nozzle_setting|default(0)|int == 1 %}
        {fail("The nozzle change is still on. Put the tool heads back in their docks and click Done (or run _WM_NOZZLE_CHANGE_END) first.")}
    {% endif %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        {fail("WonderMaker's tool change error flag (fail_flag) is %s. The printer needs that cleared before it moves a tool." % vars.fail_flag)}
    {% endif %}
    {% for t in range(count) %}
        {% if 'filament_switch_sensor docked%d' % t not in printer.configfile.settings %}
            {fail("There is no dock sensor docked%d. The matching cannot tell which dock is empty." % t)}
        {% elif not printer['filament_switch_sensor docked%d' % t].filament_detected %}
            {fail("Tool head %d is not seen in its dock. The matching needs all %d tool heads hanging in their docks. If a tool head is on the carriage, release it on the printer's screen (KlipperScreen, Calibration, Unload gripper) while you hold it. Do not unlock it from Fluidd: the tool head then falls onto the bed." % (t + 1, count))}
        {% endif %}
        {% set sec = 'mcu t%d' % t %}
        {% if sec not in printer.configfile.settings or not printer.configfile.settings[sec].canbus_uuid|default('') %}
            {fail("[mcu T%d] has no canbus_uuid in the config. Fix the CAN ids first (./installer.sh --can-ids)." % t)}
        {% endif %}
    {% endfor %}

[gcode_macro WM_EXTRUDER_SETUP]
description: The screen's Extruder Setup page: instructions and Set Up, which matches the tool heads to their CAN ids (app: General > Extruder Setup)
gcode:
    _WM_MATCH_CHECK
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set ids = [] %}
    {% for t in range(count) %}
        {% set _ = ids.append("T%d %s" % (t, printer.configfile.settings['mcu t%d' % t].canbus_uuid)) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Extruder Setup"
    RESPOND TYPE=command MSG="action:prompt_text Operating instructions: please hang the extruders on the rear support, and avoid tangling of the wires."
    RESPOND TYPE=command MSG="action:prompt_text Once all extruders are in place, ensure there are no obstructions in their path. Ensure the above operations are completed before clicking Set Up for extruder sequencing."
    RESPOND TYPE=command MSG="action:prompt_text If a tool head is on the carriage, take it off first: HOLD THE TOOL HEAD with your hand, then on the printer's screen open KlipperScreen, Calibration (ZR Tools), press Unlock gripper and confirm, and hang the head in its dock. WARNING: do not unlock the gripper from Fluidd (console or a macro). Nothing holds the tool head then and it falls onto the bed."
    RESPOND TYPE=command MSG="action:prompt_text Set Up picks up T0, T1, T2 and T3 one after the other (about 2 minutes) and after each pick looks at the dock sensors to see which dock came out empty. Heaters off, hotends cold, bed clear. The printer homes first if it is not homed."
    RESPOND TYPE=command MSG="action:prompt_text CAN ids now: {ids|join(' | ')}. Nothing is written while it runs. If every tool came out of its own dock nothing changes. If the ids would change you are asked before they are written."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Set Up|_WM_MATCH_RUN|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_MATCH_RUN]
description: Matching, step 2: home, park the tool on the carriage, then pick the tools one by one
gcode:
    _WM_MATCH_CHECK
    {% set vars = printer.save_variables.variables %}
    SET_GCODE_VARIABLE MACRO=_WM_MATCH_STATE VARIABLE=actual VALUE="[]"
    RESPOND TYPE=command MSG="action:prompt_end"
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=1
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing..."
        G28
    {% endif %}
    {% if vars.current_extruder|default(99)|int != 99 %}
        RESPOND MSG="Parking the tool that is on the carriage..."
        PARK_CURRENT_TOOL
        M400
    {% endif %}
    _WM_MATCH_STEP N=0

[gcode_macro _WM_MATCH_STEP]
description: Matching: pick up tool N and see which dock came out empty
gcode:
    {% set n = params.N|default(0)|int %}
    {% set vars = printer.save_variables.variables %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_MATCH_STOP REASON="WonderMaker's tool change error flag (fail_flag) is {vars.fail_flag} before T{n}."
    {% else %}
        RESPOND MSG="Matching: picking up T{n} ({n + 1} of {vars.thr_number|default(4)|int})..."
        T{n}
        M400
        G4 P1000
        _WM_MATCH_AFTER N={n}
    {% endif %}

[gcode_macro _WM_MATCH_AFTER]
description: Matching: note the empty dock after the pick of tool N, then go on with the next tool or finish
gcode:
    {% set n = params.N|default(0)|int %}
    {% set vars = printer.save_variables.variables %}
    {% set count = vars.thr_number|default(4)|int %}
    {% set found = [] %}
    {% for t in range(count) %}
        {% if not found and not printer['filament_switch_sensor docked%d' % t].filament_detected %}
            {% set _ = found.append(t) %}
        {% endif %}
    {% endfor %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_MATCH_STOP REASON="T{n} could not be picked up (fail_flag {vars.fail_flag}, tool T{vars.fail_tool|default(n)}). Check that its tool head hangs in the dock."
    {% elif not found %}
        _WM_MATCH_STOP REASON="After the pick of T{n} no dock sensor shows an empty dock. Check that the tool head hangs in the dock."
    {% else %}
        {% set seen = printer['gcode_macro _WM_MATCH_STATE'].actual + [found[0]] %}
        SET_GCODE_VARIABLE MACRO=_WM_MATCH_STATE VARIABLE=actual VALUE="{seen}"
        RESPOND MSG="Matching: asked for T{n}, the empty dock is tool head {found[0] + 1}."
        {% if n + 1 < count %}
            SET_GCODE_VARIABLE MACRO=_WM_MATCH_STATE VARIABLE=next VALUE={n + 1}
            UPDATE_DELAYED_GCODE ID=_WM_MATCH_NEXT DURATION=0.5
        {% else %}
            _WM_MATCH_FINISH
        {% endif %}
    {% endif %}

[gcode_macro _WM_MATCH_FINISH]
description: Matching: park the tool, switch off, show what the result means
gcode:
    PARK_CURRENT_TOOL
    M400
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set actual = printer['gcode_macro _WM_MATCH_STATE'].actual %}
    {% set old = [] %}
    {% for t in range(count) %}
        {% set _ = old.append(printer.configfile.settings['mcu t%d' % t].canbus_uuid|lower) %}
    {% endfor %}
    {% set new = [] %}
    {% for t in range(count) %}
        {% set _ = new.append(old[actual[t]]) %}
    {% endfor %}
    {% set dup = [] %}
    {% for a in range(count) %}
        {% for b in range(a + 1, count) %}
            {% if new[a] == new[b] %}
                {% set _ = dup.append("T%d and T%d" % (a, b)) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% set docks = [] %}
    {% for t in range(count) %}
        {% set _ = docks.append("T%d: dock %d" % (t, actual[t] + 1)) %}
    {% endfor %}
    {% set moves = [] %}
    {% for t in range(count) %}
        {% if new[t] != old[t] %}
            {% set _ = moves.append("T%d: %s -> %s (from dock %d)" % (t, old[t], new[t], actual[t] + 1)) %}
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Matching result"
    {% if dup %}
        RESPOND TYPE=command MSG="action:prompt_text {dup|join(', ')} would get the same CAN id, so nothing was written (the dock that was empty after each pick: {docks|join(', ')}). Check that every tool head hangs in its own dock and run the matching again."
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    {% elif not moves %}
        RESPOND TYPE=command MSG="action:prompt_text Every tool came out of its own dock (T0 to T{count - 1} in order). The CAN ids are right and nothing was changed."
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text The tools did not come out of the docks in the order asked. WonderMaker's screen gives each tool the CAN id that was stored for the dock it came out of:"
        RESPOND TYPE=command MSG="action:prompt_text {moves|join(' | ')}"
        RESPOND TYPE=command MSG="action:prompt_text Apply writes these into wm_zru_thr0.cfg ... wm_zru_thr{count - 1}.cfg (a copy of each changed file is kept) and restarts the firmware."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Apply and restart|_WM_MATCH_APPLY ID0={new[0]} ID1={new[1]} ID2={new[2]} ID3={new[3]}|primary"
        RESPOND TYPE=command MSG="action:prompt_button Leave as is|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_RESTART_KLIPPER]
description: Close the open Fluidd window, then restart Klipper (the Restart Klipper now button)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    G4 P500
    RESTART

[gcode_macro _WM_MATCH_APPLY]
description: Matching, last step: write the four CAN ids and restart the firmware
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nothing was changed.")}
    {% endif %}
    {% if 'gcode_shell_command wm_canids' not in printer.configfile.settings %}
        {action_raise_error("The wm_canids shell command is not loaded. Run ./installer.sh --rpi-cfg and restart Klipper.")}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RUN_SHELL_COMMAND CMD=wm_canids PARAMS="apply {params.ID0} {params.ID1} {params.ID2} {params.ID3}"
    RESPOND MSG="CAN ids written. Restarting the firmware..."
    FIRMWARE_RESTART

[gcode_macro _WM_MATCH_STOP]
description: Matching stopped: switch is_nozzle_setting off and say why, nothing is written
gcode:
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    RESPOND TYPE=command MSG="action:prompt_begin Matching stopped"
    RESPOND TYPE=command MSG="action:prompt_text {params.REASON}"
    RESPOND TYPE=command MSG="action:prompt_text Nothing was written to the CAN id files. The tool change check is on again (is_nozzle_setting = 0). A tool may still be on the carriage: check the printer before you move anything. If this was part of the First Run Calibration, it did not go on."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ======================================================================================================================
# ===== Speed test of the X and Y motors (WM_AUTO_SPEED). Joined into this file from rpi_auto_speed.cfg (it needs the same
# ===== shell command extension, and the speed test module auto_speed.py)
# ======================================================================================================================

# speed test of the X and Y motors (Raspberry Pi, not part of WonderMaker's files)
#
# Uses klipper_auto_speed by Anonoei (MIT licence, github.com/Anonoei/klipper_auto_speed, commit 6331531), files
# klippy/extras/auto_speed.py and klippy/extras/autospeed/. It moves the tool head faster and faster, homes X and Y after each
# move and compares the motor positions. When a motor lost steps, that speed was too much. The result is the highest
# acceleration and speed without lost steps, and 80 percent of it as the recommended value.
#
#   WM_AUTO_SPEED               window with Start and Cancel. Takes about 5 to 20 minutes. At the end a window shows the result
#                               with Check first, Save and Do not save. Save writes max_accel and max_velocity into [printer] of
#                               printer.cfg (backup first, script wm-tools/wm_speed_limits.py), then offers a Klipper restart.
#                               The saved acceleration is never higher than the input shaper allows for clean prints.
#                               Without a calibrated input shaper the test does not start (it would find a too low
#                               speed): the window offers Calibrate input shaper (WM_VIBRATION_COMP), Klipper restarts,
#                               then the speed test window opens again. A result measured without shaper is not saved.
#   _WM_AUTO_SPEED_RESULT       opens that window again with the last result (kept after a restart).
#   _WM_AUTO_SPEED_VALIDATE ACCEL=5000 VELOCITY=600
#                               runs a fast pattern 50 times with these values and checks for lost steps (about 5 to 10 minutes).
#
# The tool docks are inside the Y range of this printer (Y 310 and above), so the test may only use the zone below. The
# test_* settings are an addition to the module made for this printer, the original always uses the full axis range.
# All test moves end at X 270 Y 260 or X 30 Y 260, the validate pattern stays inside X 30-270 Y 30-260.

[auto_speed]
axis: diag_x, diag_y        # on a corexy printer each diagonal turns one motor
margin: 20
test_x_min: 10
test_x_max: 290
test_y_min: 10
test_y_max: 280
max_missed: 1.0             # full steps a motor may be off after a move (homing itself is not exact)
endstop_samples: 3
accel_min: 1000
accel_max: 30000            # the search never tries more than this
velocity_min: 50
velocity_max: 1200          # the search never tries more than this
derate: 0.8                 # recommended value = 80 percent of the highest value that worked
validate_margin: 20
validate_inner_margin: 20
validate_iterations: 50

[gcode_macro WM_AUTO_SPEED]
description: Window: speed test of the X and Y motors (finds the highest acceleration and speed without lost steps). Needs a calibrated input shaper
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer.auto_speed.shaper_accel|default(0)|int <= 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin Input shaper first"
        RESPOND TYPE=command MSG="action:prompt_text The speed test needs a calibrated input shaper. Without it the tool head shakes more and loses steps much earlier, so the test would find a speed that is too low (on this printer 390 instead of 700)."
        RESPOND TYPE=command MSG="action:prompt_text Calibrate input shaper shakes the tool head and measures it (loud, a few minutes, bed clear). Then Klipper restarts and this speed test window opens again by itself."
        RESPOND TYPE=command MSG="action:prompt_footer_button Calibrate input shaper|_WM_AUTO_SPEED_SHAPER|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_PROMPT_CLOSE"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Speed test"
        RESPOND TYPE=command MSG="action:prompt_text Finds the highest acceleration and speed of X and Y without lost steps. Takes about 5 to 20 minutes and gets loud. It cannot be paused, only the emergency stop ends it. The bed must be empty and all heaters off. At the end a window offers to save the result."
        RESPOND TYPE=command MSG="action:prompt_footer_button Start test|_WM_AUTO_SPEED_RUN|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_PROMPT_CLOSE"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _WM_AUTO_SPEED_READY]
description: Checks before a speed test, then homes when needed and takes T0 when the carriage is empty
gcode:
    _WM_CAL_PRECHECK
    {% if printer.toolhead.homed_axes|lower != "xyz" %}
        RESPOND MSG="Speed test: homing first"
        G28
    {% elif printer.save_variables.variables.current_extruder|default(99)|int not in [0, 1, 2, 3] %}
        RESPOND MSG="Speed test: taking T0, the test needs the weight of a tool on the carriage"
        T0
    {% endif %}

[gcode_macro _WM_AUTO_SPEED_RUN]
description: Runs the speed test (called by the Start button of WM_AUTO_SPEED). Refused without a calibrated input shaper
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer.auto_speed.shaper_accel|default(0)|int <= 0 %}
        _WM_FAIL MSG="Speed test: not started, the input shaper is not calibrated. Run WM_AUTO_SPEED and press Calibrate input shaper first."
    {% else %}
        _WM_AUTO_SPEED_READY
        RESPOND MSG="Speed test started. Results come in the console."
        AUTO_SPEED LEVEL=0
        RESPOND MSG="Speed test finished. The result window is open."
        _WM_AUTO_SPEED_RESULT
    {% endif %}

[gcode_macro _WM_AUTO_SPEED_VALIDATE]
description: Runs a fast pattern 50 times with ACCEL and VELOCITY and checks for lost steps. Without values it uses the limits of the printer
gcode:
    {% set a = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|float %}
    {% set v = params.VELOCITY|default(printer.configfile.settings.printer.max_velocity)|float %}
    {% if a < 500 or a > 30000 or v < 50 or v > 1200 %}
        _WM_FAIL MSG="{"Speed test: ACCEL must be 500 to 30000 and VELOCITY 50 to 1200."}"
    {% endif %}
    _WM_AUTO_SPEED_READY
    G90
    G1 Z30 F1200
    RESPOND MSG="Speed check started with acceleration {a|int} and speed {v|int}"
    AUTO_SPEED_VALIDATE ACCEL={a} VELOCITY={v}
    {% if params.RESULT|default(0)|int == 1 %}
        _WM_AUTO_SPEED_RESULT
    {% endif %}

[gcode_shell_command wm_speed_limits]
command: bash -c 'exec python3 "$HOME/printer_data/wm-tools/wm_speed_limits.py" "$@"' wm_speed_limits
timeout: 10.0
verbose: True

[gcode_macro _WM_AUTO_SPEED_RESULT]
description: Window with the last speed test result: Check first, Save (writes printer.cfg), Do not save. No Save without input shaper
gcode:
    {% set r = printer.auto_speed %}
    {% if r.done|default(0)|int != 1 %}
        _WM_FAIL MSG="Speed test: no result yet. Run WM_AUTO_SPEED first."
    {% else %}
        {% set cfg = printer.configfile.settings.printer %}
        {% set sh = r.shaper_accel|default(0)|int %}
        {% set tested_with_shaper = r.shaper_at_test|default(1)|int > 0 %}
        {% set ns = namespace(a=r.rec_accel|int) %}
        {% if sh > 0 and sh < ns.a %}
            {% set ns.a = sh %}
        {% endif %}
        {% set a = (ns.a // 100) * 100 %}
        {% set v = (r.rec_velocity|int // 10) * 10 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Speed test result"
        RESPOND TYPE=command MSG="action:prompt_text Test of {r.time}: no lost steps up to acceleration {r.max_accel} and speed {r.max_velocity}. With the 80 percent margin: acceleration {r.rec_accel} and speed {r.rec_velocity}."
        RESPOND TYPE=command MSG="action:prompt_text Now in printer.cfg: acceleration {cfg.max_accel|int} and speed {cfg.max_velocity|int}."
        {% if sh <= 0 %}
            RESPOND TYPE=command MSG="action:prompt_text Your input shaper is not calibrated, so this result cannot be saved. Calibrate input shaper first (loud, a few minutes, Klipper restarts), then the speed test window opens again to test with the shaper on."
            RESPOND TYPE=command MSG="action:prompt_footer_button Calibrate input shaper|_WM_AUTO_SPEED_SHAPER|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Close|_WM_PROMPT_CLOSE"
        {% elif not tested_with_shaper %}
            RESPOND TYPE=command MSG="action:prompt_text This result was measured without input shaper, so its speed is too low and it cannot be saved. Your input shaper is calibrated now: run the speed test again."
            RESPOND TYPE=command MSG="action:prompt_footer_button Run speed test again|WM_AUTO_SPEED|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Close|_WM_PROMPT_CLOSE"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_text Your input shaper allows acceleration {sh} for clean prints, a higher value smears corners. Save never goes above it."
            {% if r.valid_done|default(0)|int == 1 and r.valid_accel|int == a and r.valid_velocity|int == v %}
                RESPOND TYPE=command MSG="action:prompt_text Check with these values: {'passed' if r.valid_ok|int == 1 else 'FAILED, steps were lost'} (missed X {r.valid_missed_x}, Y {r.valid_missed_y})."
            {% endif %}
            RESPOND TYPE=command MSG="action:prompt_text Save writes acceleration {a} and speed {v} into printer.cfg (a backup is made). Klipper uses them after a restart. Check first runs a fast pattern 50 times with them (about 5 minutes)."
            RESPOND TYPE=command MSG="action:prompt_button Check first|_WM_AUTO_SPEED_VALIDATE ACCEL={a} VELOCITY={v} RESULT=1|secondary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Save|_WM_AUTO_SPEED_SAVE ACCEL={a} VELOCITY={v}|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Do not save|_WM_PROMPT_CLOSE"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _WM_AUTO_SPEED_SAVE]
description: Writes ACCEL and VELOCITY into [printer] of printer.cfg (Save button of the speed test window)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set a = params.ACCEL|default(0)|int %}
    {% set v = params.VELOCITY|default(0)|int %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        _WM_FAIL MSG="Speed test: not saved, a print is running."
    {% elif printer.auto_speed.shaper_accel|default(0)|int <= 0 %}
        _WM_FAIL MSG="Speed test: not saved, the input shaper is not calibrated. Run WM_AUTO_SPEED and press Calibrate input shaper first."
    {% elif a < 500 or a > 30000 or v < 50 or v > 1200 %}
        _WM_FAIL MSG="Speed test: not saved, ACCEL must be 500 to 30000 and VELOCITY 50 to 1200."
    {% else %}
        RUN_SHELL_COMMAND CMD=wm_speed_limits PARAMS="{a} {v}"
        RESPOND TYPE=command MSG="action:prompt_begin Speed limits saved"
        RESPOND TYPE=command MSG="action:prompt_text printer.cfg now has max_accel {a} and max_velocity {v}. The old file is kept as a backup, the console line Speed limits shows the details."
        RESPOND TYPE=command MSG="action:prompt_text Klipper uses the new values after a restart."
        RESPOND TYPE=command MSG="action:prompt_footer_button Restart Klipper now|_WM_AUTO_SPEED_RESTART|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Later|_WM_PROMPT_CLOSE"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _WM_AUTO_SPEED_RESTART]
description: Restarts Klipper after the speed limits were saved (refused while a print runs)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer.print_stats.state in ["printing", "paused"] %}
        _WM_FAIL MSG="Speed test: no restart while a print runs. Restart later."
    {% else %}
        RESTART
    {% endif %}

[gcode_macro _WM_AUTO_SPEED_SHAPER]
description: Calibrate input shaper button (WM_VIBRATION_COMP, SAVE_CONFIG restarts Klipper, then the speed test window opens again)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    SAVE_VARIABLE VARIABLE=wm_as_reopen VALUE=1
    WM_VIBRATION_COMP CONFIRM=1

[delayed_gcode _WM_AUTO_SPEED_REOPEN]
initial_duration: 12
gcode:
    {% if printer.save_variables.variables.wm_as_reopen|default(0)|int == 1 %}
        SAVE_VARIABLE VARIABLE=wm_as_reopen VALUE=0
        {% if printer.auto_speed.shaper_accel|default(0)|int > 0 %}
            RESPOND MSG="Input shaper saved. The speed test window opens again: press Start test when the bed is empty."
            WM_AUTO_SPEED
        {% endif %}
    {% endif %}

# ======================================================================================================================
# ===== E-step calibration (WM_ESTEP_CAL, F-221). Joined into this file (it needs the same shell command extension, and
# ===== uses _WM_FAIL, _WM_PROMPT_CLOSE and _WM_CAL_PRECHECK from rpi_calibration.cfg)
# ======================================================================================================================
# rpi_estep.cfg  -  e-step (rotation_distance) calibration of one tool head (Raspberry Pi, not part of WonderMaker's files)
#
#   WM_ESTEP_CAL            window with the four tools (shows the rotation_distance of each). Pick one and follow the windows:
#                           1 Prepare: tube off, loose filament into the inlet, feed assist off (Acepro too).  Picture estep-prepare
#                           2 Heat the nozzle to 220 C. Insert filament (100 mm). Mark the filament 120 mm above the inlet.  Pictures
#                             estep-ruler (and estep-zero with the button)
#                           3 The printer extrudes 100 mm slowly (about 100 s)
#                           4 You read the mark in mm and type the number with the number keys.  Picture estep-measure
#                           5 Save writes the new rotation_distance into printer.cfg and keeps the old one behind it:
#                                 rotation_distance: 21.018 # old value 22.127
#                             (backup of printer.cfg first, script wm-tools/wm_estep.py). Klipper uses it after a restart.
#   WM_ESTEP_CAL T=2        skips the tool window and starts with tool 3 (T2)
#
#   new = old * (120 - measured) / 100          measured = mm of filament left above the inlet after the 100 mm extrusion
#
# Safety: refuses to start while a print is running or paused, or when a heater is on (_WM_CAL_PRECHECK). The nozzle goes off
# by itself after 15 minutes without a button press. The extruder that was active before is activated again at the end.
# Needs: gcode_shell_command (declared below), _WM_FAIL, _WM_PROMPT_CLOSE and _WM_CAL_PRECHECK from rpi_calibration.cfg, and the
# pictures estep-prepare, estep-ruler, estep-zero and estep-measure (Fluidd img/wm/<name>.svg, KlipperScreen wm_images/<name>.png).

[gcode_shell_command wm_estep]
command: bash -c 'exec python3 "$HOME/printer_data/wm-tools/wm_estep.py" "$@"' wm_estep
timeout: 10.0
verbose: True

[gcode_macro _WM_ESTEP]
description: State of the e-step calibration (not a command, shows the state)
variable_t: -1                  # tool being calibrated (0 to 3), -1 = none
variable_ext: ""                # its extruder section
variable_prev: ""               # extruder that was active before, activated again at the end
variable_old: 0.0               # rotation_distance in printer.cfg when the calibration started
variable_entry: "20.0"          # mm from the inlet to the mark after the extrusion, set with the buttons (starts at the 20.0 that is expected), as text
variable_mark: 120              # mm above the inlet where the filament is marked
variable_len: 100               # mm extruded
variable_temp: 220              # C
gcode:
    RESPOND MSG="E-step calibration: tool {t|int + 1}, extruder '{ext}', rotation_distance {old}, measured '{entry}' mm"

[delayed_gcode _WM_ESTEP_OFF]
gcode:
    {% if printer["gcode_macro _WM_ESTEP"].t|int >= 0 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        _WM_ESTEP_FINISH
        RESPOND MSG="E-step calibration stopped: 15 minutes without a button press. The nozzle is off, nothing was saved."
    {% endif %}

[gcode_macro WM_ESTEP_CAL]
description: Window: e-step (rotation_distance) calibration of one tool head, saves the new value in printer.cfg (T=0..3 starts with that tool)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set vars = printer.save_variables.variables %}
    {% set count = vars.thr_number|default(4)|int %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="A print is running or paused. E-step calibration not started."
    {% elif 'gcode_shell_command wm_estep' not in printer.configfile.settings %}
        _WM_FAIL MSG="E-step calibration: gcode_shell_command wm_estep is missing in the configuration (rpi_estep.cfg not included?)."
    {% elif params.T is defined and params.T|int >= 0 and params.T|int < count %}
        _WM_ESTEP_START T={params.T|int}
    {% else %}
        {% set info = [] %}
        {% for t in range(count) %}
            {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
            {% set rd = printer.configfile.settings[hn].rotation_distance|default(0)|float if hn in printer.configfile.settings else 0 %}
            {% set _ = info.append("T%d %s" % (t + 1, rd)) %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_begin E-step calibration"
        RESPOND TYPE=command MSG="action:prompt_text Pick the tool. Needs a ruler, a pen and loose filament."
        RESPOND TYPE=command MSG="action:prompt_text Now: {info|join('  ')}"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for t in range(count) %}
            RESPOND TYPE=command MSG="action:prompt_button Tool {t + 1}|_WM_ESTEP_START T={t}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_PROMPT_CLOSE"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _WM_ESTEP_START]
description: Tool button of the e-step window: checks, remembers the tool and its rotation_distance, takes the tool to X150 Y10 Z150, opens step 1
gcode:
    _WM_CAL_PRECHECK ALLOW_BED=1
    {% set t = params.T|default(-1)|int %}
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
    {% if t < 0 or t >= count %}
        _WM_FAIL MSG="E-step calibration: T is the tool number 0 to {count - 1}."
    {% elif hn not in printer.configfile.settings %}
        _WM_FAIL MSG="E-step calibration: no [{hn}] in the configuration."
    {% elif printer.configfile.settings[hn].rotation_distance|default(0)|float <= 0 %}
        _WM_FAIL MSG="E-step calibration: [{hn}] has no rotation_distance."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=t VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=ext VALUE='"{hn}"'
        SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=prev VALUE='"{printer.toolhead.extruder}"'
        SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=old VALUE={printer.configfile.settings[hn].rotation_distance|float}
        SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=entry VALUE='"20.0"'
        _WM_ESTEP_POS
        _WM_ESTEP_GUARD
        _WM_ESTEP_S1
    {% endif %}

[gcode_macro _WM_ESTEP_POS]
description: E-step: puts the chosen tool on the carriage (no tool on it: picks it up), homes only when not homed, goes to X150 Y10 Z150
gcode:
    {% set t = printer["gcode_macro _WM_ESTEP"].t|int %}
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% if t < 0 %}
        _WM_FAIL MSG="E-step calibration: no tool chosen. Start with WM_ESTEP_CAL."
    {% else %}
        {% if cur in [0, 1, 2, 3] and "xyz" not in printer.toolhead.homed_axes %}
            RESPOND MSG="E-step: homing first"
            {% if "xy" in printer.toolhead.homed_axes %}
                G28 Z
            {% else %}
                G28
            {% endif %}
            M400
        {% endif %}
        {% if cur != t %}
            {% if cur in [0, 1, 2, 3] %}
                RESPOND MSG="E-step: changing from tool {cur + 1} to tool {t + 1}"
            {% else %}
                RESPOND MSG="E-step: no tool on the carriage, picking up tool {t + 1}"
            {% endif %}
            _CHANGE_TOOL T={t}
            M400
        {% endif %}
        _WM_ESTEP_POS2
    {% endif %}

[gcode_macro _WM_ESTEP_POS2]
description: E-step: after the tool change, homes only what is not homed yet, then moves to X150 Y10 Z150
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="E-step: homing"
        {% if "xy" in printer.toolhead.homed_axes %}
            G28 Z
        {% else %}
            G28
        {% endif %}
        M400
    {% endif %}
    G90
    G1 X150 Y10 Z150 F3000
    M400
    RESPOND MSG="E-step: tool {printer['gcode_macro _WM_ESTEP'].t|int + 1} is at X150 Y10 Z150"

[gcode_macro _WM_ESTEP_PARK]
description: E-step Park tool button: nozzle off, timer off, the tool on the carriage goes back into its dock, then the motors are turned off (nothing saved)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="E-step calibration: not parked, a print is running."
    {% else %}
        _WM_ESTEP_FINISH
        {% if cur in [0, 1, 2, 3] and "xy" in printer.toolhead.homed_axes %}
            _WM_ESTEP_WAIT MSG="Please wait, parking tool {cur + 1}, then the motors go off."
            PARK_CURRENT_TOOL
            M400
            M84
            RESPOND TYPE=command MSG="action:prompt_end"
            RESPOND MSG="E-step calibration: nozzle off, tool {cur + 1} parked, motors off."
        {% else %}
            M84
            RESPOND MSG="E-step calibration: nozzle off, motors off. No tool on the carriage, nothing to park."
        {% endif %}
    {% endif %}

[gcode_macro _WM_ESTEP_GUARD]
description: E-step: while the filament is pushed in by hand the head sensor of the tool must not start the automatic load (insert_gcode), so its sensor is switched off. The head sensor watcher leaves it off while the calibration runs. _WM_ESTEP_FINISH puts it back
gcode:
    {% set t = printer["gcode_macro _WM_ESTEP"].t|int %}
    # The head sensor watcher (rpi_base.cfg) must not switch this sensor on again: its busy test has the line "or the e-step calibration is
    # running" (_WM_ESTEP t >= 0), see patches/rpi_base-watcher-busy.md. Without that line the watcher switches the sensor on after 2 s.
    {% if ("filament_switch_sensor filament%d" % t) in printer %}
        SET_FILAMENT_SENSOR SENSOR=filament{t} ENABLE=0
    {% endif %}

[gcode_macro _WM_ESTEP_AFTER_INSERT]
description: E-step: after Insert filament, asks the head filament sensor of the tool: no filament seen = the no filament window, else the mark page
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% set key = "filament_switch_sensor filament%d" % s.t|int %}
    {% if s.t|int < 0 %}
        RESPOND MSG="E-step calibration: stopped."
    {% elif key in printer and not printer[key].filament_detected %}
        _WM_ESTEP_NOFIL
    {% else %}
        RESPOND MSG="E-step: filament detected in tool {s.t|int + 1}."
        _WM_ESTEP_MARK
    {% endif %}

[gcode_macro _WM_ESTEP_NOFIL]
description: E-step window: the head sensor sees no filament, insert the filament (buttons Insert filament, Park tool, Cancel)
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
    RESPOND TYPE=command MSG="action:prompt_begin E-step: no filament inserted"
    RESPOND TYPE=command MSG="action:prompt_text No filament detected in tool {s.t|int + 1}: the filament sensor of the tool head does not see any filament."
    RESPOND TYPE=command MSG="action:prompt_text Push the loose filament into the inlet of tool {s.t|int + 1} until it stops, keep it straight, then press Insert filament again. It feeds 100 mm."
    RESPOND TYPE=command MSG="action:prompt_footer_button Insert filament|_WM_ESTEP_INSERT|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Park tool|_WM_ESTEP_PARK"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_ESTEP_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_S1]
description: E-step step 1 window: prepare the tool (picture estep-prepare)
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
    RESPOND TYPE=command MSG="action:prompt_begin E-step: prepare tool {s.t|int + 1}"
    RESPOND TYPE=command MSG="action:prompt_image estep-prepare"
    RESPOND TYPE=command MSG="action:prompt_text rotation_distance of tool {s.t|int + 1} now: {s.old}"
    RESPOND TYPE=command MSG="action:prompt_text 1) Pull the clear tube out of the tool inlet. 2) Push a loose filament into the inlet. 3) Feed assist off, on this tool and on the Acepro."
    RESPOND TYPE=command MSG="action:prompt_text The next step heats the nozzle to {s.temp} C. Keep your hands clear of the nozzle."
    RESPOND TYPE=command MSG="action:prompt_footer_button Heat nozzle|_WM_ESTEP_HEAT|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Park tool|_WM_ESTEP_PARK"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_ESTEP_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_HEAT]
description: E-step: activate the extruder of the tool and start heating its nozzle (no waiting here), the heating window shows the temperature and _WM_ESTEP_HEATWATCH opens step 2 when it is reached
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% if s.t|int < 0 %}
        _WM_FAIL MSG="E-step calibration: no tool chosen. Start with WM_ESTEP_CAL."
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="A print is running or paused. E-step calibration stopped."
    {% else %}
        UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
        RESPOND MSG="E-step: heating tool {s.t|int + 1} to {s.temp} C ..."
        ACTIVATE_EXTRUDER EXTRUDER={s.ext}
        M104 S{s.temp} T{s.t|int}
        _WM_ESTEP_HEATWIN
        UPDATE_DELAYED_GCODE ID=_WM_ESTEP_HEATWATCH DURATION=3
    {% endif %}

[gcode_macro _WM_ESTEP_HEATWIN]
description: E-step: heating window (shows the nozzle temperature, buttons Park tool and Cancel), redrawn every 3 seconds by _WM_ESTEP_HEATWATCH
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% if s.t|int >= 0 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin E-step: heating tool {s.t|int + 1}"
        RESPOND TYPE=command MSG="action:prompt_text Heating the nozzle of tool {s.t|int + 1}: {printer[s.ext].temperature|float|round(0)|int} of {s.temp|int} C."
        RESPOND TYPE=command MSG="action:prompt_text Please wait, the next window opens by itself when the nozzle is hot. Keep your hands clear of the nozzle."
        RESPOND TYPE=command MSG="action:prompt_footer_button Park tool|_WM_ESTEP_PARK"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_ESTEP_CANCEL"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[delayed_gcode _WM_ESTEP_HEATWATCH]
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% if s.t|int >= 0 %}
        {% if printer.print_stats.state in ['printing', 'paused'] %}
            RESPOND TYPE=command MSG="action:prompt_end"
            _WM_FAIL MSG="A print is running or paused. E-step calibration stopped."
        {% elif printer[s.ext].temperature|float >= s.temp|float - 3 %}
            RESPOND MSG="E-step: nozzle of tool {s.t|int + 1} is hot."
            _WM_ESTEP_S2
        {% else %}
            _WM_ESTEP_HEATWIN
            UPDATE_DELAYED_GCODE ID=_WM_ESTEP_HEATWATCH DURATION=3
        {% endif %}
    {% endif %}

[gcode_macro _WM_ESTEP_S2]
description: E-step step 2 window: insert the filament (button Insert filament, fast 100 mm), then the mark page
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
    RESPOND TYPE=command MSG="action:prompt_begin E-step: insert the filament"
    RESPOND TYPE=command MSG="action:prompt_image estep-prepare"
    RESPOND TYPE=command MSG="action:prompt_text The nozzle is hot. Push the loose filament (at least 40 cm long) into the inlet of tool {s.t|int + 1} until it stops, keep it straight, then press Insert filament."
    RESPOND TYPE=command MSG="action:prompt_text It feeds 100 mm fast, about 20 seconds, so the extruder surely grips the filament. Keep the filament free."
    {% set key = "filament_switch_sensor filament%d" % s.t|int %}
    {% if key in printer %}
        RESPOND TYPE=command MSG="action:prompt_text Filament sensor of tool {s.t|int + 1}: {'filament detected' if printer[key].filament_detected else 'NO filament detected'}."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Filament already inserted|_WM_ESTEP_MARK|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Insert filament|_WM_ESTEP_INSERT|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Park tool|_WM_ESTEP_PARK"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_ESTEP_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_MARK]
description: E-step mark page: mark the filament at 120 mm above the inlet (picture estep-ruler), button Extrude 100 mm. Also the page of Run again
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
    RESPOND TYPE=command MSG="action:prompt_begin E-step: mark the filament at {s.mark} mm"
    RESPOND TYPE=command MSG="action:prompt_image estep-ruler"
    RESPOND TYPE=command MSG="action:prompt_text Put the end of the ruler on the top of the tool and mark the filament at {s.mark} mm above the inlet. If there is an old mark, ignore it or wipe it off."
    RESPOND TYPE=command MSG="action:prompt_text Then press Extrude {s.len} mm. It moves the filament slowly, about {s.len|int + 5} seconds. Keep the filament free and the mark in sight."
    RESPOND TYPE=command MSG="action:prompt_button Picture: zero point|_WM_ESTEP_ZERO|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Extrude {s.len} mm|_WM_ESTEP_RUN|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Park tool|_WM_ESTEP_PARK"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_ESTEP_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_ZERO]
description: E-step: picture of the zero point (ruler end on the tool top), Back returns to the mark page
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
    RESPOND TYPE=command MSG="action:prompt_begin E-step: zero point"
    RESPOND TYPE=command MSG="action:prompt_image estep-zero"
    RESPOND TYPE=command MSG="action:prompt_text 0 mm is the end of the ruler resting on the top of the tool. The filament goes straight down into the inlet ring."
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_ESTEP_MARK|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_WM_ESTEP_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_WAIT]
description: E-step: "please wait" window without buttons, MSG="text". It stays open until the next window (or prompt_end) replaces it
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin E-step: please wait"
    RESPOND TYPE=command MSG="action:prompt_text {params.MSG|default('Please wait ...')}"
    RESPOND TYPE=command MSG="action:prompt_text Do not touch the filament or the tool. This window changes by itself when the step is done."
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_MOVE]
description: E-step: extrude (positive) or retract (negative) LEN mm of filament in steps of 25 mm at F SPEED mm/min, on the chosen extruder. WAIT="text" shows the please wait window with the mm done before each step
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% set total = params.LEN|default(0)|float %}
    {% set speed = params.SPEED|default(60)|int %}
    {% set step = 25.0 if total > 0 else -25.0 %}
    {% set n = ((total|abs) / 25.0)|round(0, 'ceil')|int %}
    ACTIVATE_EXTRUDER EXTRUDER={s.ext}
    M83
    G92 E0
    {% for i in range(n) %}
        {% set e = step if (total|abs) - i * 25.0 >= 25.0 else total - i * step %}
        {% if params.WAIT %}
            _WM_ESTEP_WAIT MSG="{params.WAIT} {i * 25} of {total|abs|int} mm done."
        {% endif %}
        G1 E{e} F{speed}
        {% if params.WAIT %}
            M400
        {% endif %}
    {% endfor %}
    M400

[gcode_macro _WM_ESTEP_HOTCHECK]
description: E-step: stop with a message when the nozzle is not hot any more (idle timeout) or a print started
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% if s.t|int < 0 %}
        _WM_FAIL MSG="E-step calibration: no tool chosen. Start with WM_ESTEP_CAL."
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="A print is running or paused. E-step calibration stopped."
    {% elif printer[s.ext].temperature|float < s.temp|float - 15 %}
        _WM_FAIL MSG="E-step calibration: the nozzle of tool {s.t|int + 1} is only {printer[s.ext].temperature|round(0)|int} C (idle timeout?). Start again with WM_ESTEP_CAL."
    {% endif %}

[gcode_macro _WM_ESTEP_INSERT]
description: E-step Insert filament button: extrudes 100 mm fast (F300, about 20 s, only here) so the extruder surely grips the loose filament, then the head sensor is checked (no filament: the no filament window), else the mark page
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _WM_ESTEP_HOTCHECK
    RESPOND MSG="E-step: inserting the filament, 100 mm, about 20 seconds ..."
    _WM_ESTEP_MOVE LEN=100 SPEED=300 WAIT="Please wait, the filament is being inserted fast."
    G4 P800
    _WM_ESTEP_AFTER_INSERT

[gcode_macro _WM_ESTEP_RUN]
description: E-step: extrude 100 mm slowly (F60), then the measure picture window (no filament at the head sensor: the no filament window instead)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _WM_ESTEP_HOTCHECK
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% set key = "filament_switch_sensor filament%d" % s.t|int %}
    {% if key in printer and not printer[key].filament_detected %}
        _WM_ESTEP_NOFIL
    {% else %}
        RESPOND MSG="E-step: extruding {s.len} mm at 1 mm/s, about {s.len|int + 5} seconds. Do not touch the filament."
        _WM_ESTEP_MOVE LEN={s.len} SPEED=60 WAIT="Please wait, extruding {s.len} mm slowly (1 mm/s)."
        RESPOND MSG="E-step: done. Measure where the mark is now."
        _WM_ESTEP_MEASPIC
    {% endif %}

[gcode_macro _WM_ESTEP_MEASPIC]
description: E-step window after the 100 mm: the picture of how to measure (estep-measure), button Enter the number opens the number keys window
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
    RESPOND TYPE=command MSG="action:prompt_begin E-step: measure the mark"
    RESPOND TYPE=command MSG="action:prompt_image estep-measure"
    RESPOND TYPE=command MSG="action:prompt_text 100 mm are extruded. Put the ruler end on the tool top and read how many mm the mark is above the inlet now."
    RESPOND TYPE=command MSG="action:prompt_footer_button Enter the number|_WM_ESTEP_S3|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Park tool|_WM_ESTEP_PARK"
    RESPOND TYPE=command MSG="action:prompt_footer_button Do not save|_WM_ESTEP_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_S3]
description: E-step number keys window: the user types the mm from the inlet to the mark, the window shows the new rotation_distance (no picture, so the keys fit the 800x480 screen)
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% set old = [s.old|float, 0.001]|max %}
    {% set e = s.entry|string %}
    {% set valid = e not in ["", "."] and s.old|float > 0 %}
    {% set meas = e|float if valid else 0.0 %}
    {% set moved = s.mark|float - meas %}
    {% set new = (old * moved / ([s.len|float, 1.0]|max))|round(3) %}
    {% set pct = ((new / old - 1.0) * 100.0)|round(1) %}
    {% set ok = valid and moved >= 60.0 and moved <= 140.0 and new >= old * 0.7 and new <= old * 1.3 %}
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
    RESPOND TYPE=command MSG="action:prompt_begin E-step: mark position"
    {% if ok %}
        RESPOND TYPE=command MSG="action:prompt_text Mark at {e} mm above the inlet (you read). Moved {'%.1f' % moved} of {s.len} mm. New rotation_distance {'%.3f' % new} (now {old}, {pct} %)."
        {% if pct|abs > 10 %}
            RESPOND TYPE=command MSG="action:prompt_text Big change: check the mark and the ruler, then measure again."
        {% endif %}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Mark at {e} mm does not fit (moved {'%.1f' % moved} of {s.len} mm). Read the ruler again."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button -5|_WM_ESTEP_STEP D=-5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button -1|_WM_ESTEP_STEP D=-1|secondary"
    RESPOND TYPE=command MSG="action:prompt_button -0.5|_WM_ESTEP_STEP D=-0.5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button -0.1|_WM_ESTEP_STEP D=-0.1|secondary"
    RESPOND TYPE=command MSG="action:prompt_button +0.1|_WM_ESTEP_STEP D=0.1|secondary"
    RESPOND TYPE=command MSG="action:prompt_button +0.5|_WM_ESTEP_STEP D=0.5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button +1|_WM_ESTEP_STEP D=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_button +5|_WM_ESTEP_STEP D=5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% if ok %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Save|_WM_ESTEP_CONFIRM|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Run again|_WM_ESTEP_BACK"
    RESPOND TYPE=command MSG="action:prompt_footer_button Park tool|_WM_ESTEP_PARK"
    RESPOND TYPE=command MSG="action:prompt_footer_button Do not save|_WM_ESTEP_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_STEP]
description: E-step measure window: D=-5 / -1 / -0.5 / -0.1 / 0.1 / 0.5 / 1 / 5 changes the mm from the inlet to the mark, then the window opens again
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% set e = s.entry|string %}
    {% set cur = e|float if e not in ["", "."] else 20.0 %}
    {% set v = [0.0, [60.0, cur + params.D|default(0)|float]|min]|max %}
    SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=entry VALUE='"{'%.1f' % v}"'
    _WM_ESTEP_S3

[gcode_macro _WM_ESTEP_SET]
description: E-step: _WM_ESTEP_SET MEAS=17.3 sets the mm from the inlet to the mark exactly (typed in the console), then the measure window opens again
gcode:
    {% set v = [0.0, [60.0, params.MEAS|default(20)|float]|min]|max %}
    SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=entry VALUE='"{'%.1f' % v}"'
    _WM_ESTEP_S3

[gcode_macro _WM_ESTEP_BACK]
description: E-step Run again button: no retract, the mark page opens (mark the filament again at 120 mm, then Extrude 100 mm)
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=entry VALUE='"20.0"'
    _WM_ESTEP_MARK

[gcode_macro _WM_ESTEP_CONFIRM]
description: E-step Save button: shows the new rotation_distance and asks Save and restart (nothing is written before the answer)
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% set old = s.old|float %}
    {% set e = s.entry|string %}
    {% set moved = s.mark|float - (e|float if e not in ["", "."] else 0.0) %}
    {% set new = (old * moved / ([s.len|float, 1.0]|max))|round(3) %}
    {% set pct = ((new / old - 1.0) * 100.0)|round(1) if old > 0 else 0.0 %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin E-step: save and restart?"
    RESPOND TYPE=command MSG="action:prompt_text Tool {s.t|int + 1}: new rotation_distance {'%.3f' % new}, now {old} (change {pct} %)."
    RESPOND TYPE=command MSG="action:prompt_text Save writes it into printer.cfg (the old value stays behind it as a comment, a backup is made). Then the filament is pulled out of the extruder and you take it out of the tool. After the Done button the tool goes to the wipe position, heats to {s.temp} C, wipes and is parked, and Klipper restarts."
    RESPOND TYPE=command MSG="action:prompt_footer_button Save and restart|_WM_ESTEP_SAVE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_ESTEP_S3"
    RESPOND TYPE=command MSG="action:prompt_footer_button Do not save|_WM_ESTEP_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_SAVE]
description: E-step Save and restart button: writes the new rotation_distance into printer.cfg (old value behind it), then the filament is pulled out (_WM_ESTEP_UNLOAD) and, after the Done button, wipe and park (_WM_ESTEP_WIPEPARK) and Klipper restarts
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% set old = s.old|float %}
    {% set e = s.entry|string %}
    {% set valid = e not in ["", "."] %}
    {% set moved = s.mark|float - (e|float if valid else 0.0) %}
    {% set new = (old * moved / s.len|float)|round(3) %}
    {% set t = s.t|int %}
    {% if t < 0 %}
        _WM_FAIL MSG="E-step calibration: nothing to save. Start with WM_ESTEP_CAL."
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="E-step calibration: not saved, a print is running."
    {% elif not valid or moved < 60.0 or moved > 140.0 or new < old * 0.7 or new > old * 1.3 %}
        _WM_FAIL MSG="E-step calibration: not saved, the measured value does not fit. Measure again."
    {% else %}
        _WM_ESTEP_WAIT MSG="Please wait, saving the new rotation_distance {'%.3f' % new} for tool {t + 1} in printer.cfg."
        RUN_SHELL_COMMAND CMD=wm_estep PARAMS="{t} {'%.3f' % new} {old}"
        G4 P1500
        RESPOND MSG="E-step: tool {t + 1} rotation_distance {'%.3f' % new} saved (old {old}). Now the filament comes out, then wipe, park, restart."
        _WM_ESTEP_UNLOAD
    {% endif %}

[gcode_macro _WM_ESTEP_UNLOAD]
description: E-step after Save: heats if needed, pulls the filament back out of the extruder (150 mm, F600) and opens the take the filament out page
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% if s.t|int < 0 %}
        _WM_FAIL MSG="E-step calibration: stopped."
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="E-step calibration: stopped, a print is running."
    {% else %}
        _WM_ESTEP_WAIT MSG="Saved. Please wait, the nozzle of tool {s.t|int + 1} is checked ({s.temp} C) and the filament is pulled out of the extruder."
        M109 S{s.temp} T{s.t|int}
        _WM_ESTEP_MOVE LEN=-150 SPEED=600 WAIT="Please wait, pulling the filament out of the extruder."
        _WM_ESTEP_REMOVE
    {% endif %}

[gcode_macro _WM_ESTEP_REMOVE]
description: E-step page: take the filament out of the tool, button Done starts wipe, park and the Klipper restart
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=900
    RESPOND TYPE=command MSG="action:prompt_begin E-step: take the filament out"
    RESPOND TYPE=command MSG="action:prompt_text The new rotation_distance is saved. The filament is pulled out of the extruder."
    RESPOND TYPE=command MSG="action:prompt_text Pull the loose filament out of the inlet of tool {s.t|int + 1} and put it aside. Press Done when it is out: the tool then goes to the wipe position, heats to {s.temp} C, wipes, is parked, and Klipper restarts."
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_WM_ESTEP_WIPEPARK|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_ESTEP_WIPEPARK]
description: E-step after the Done button (filament out): the tool goes to the wipe position, heats to 220 C, wipes, the nozzle goes off, the tool is parked, motors off, then Klipper restarts
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="E-step calibration: stopped, a print is running."
    {% else %}
        {% if cur in [0, 1, 2, 3] %}
            {% if "gcode_macro _WM_GO_WIPE" in printer %}
                _WM_ESTEP_WAIT MSG="Saved. Please wait, tool {cur + 1} goes to the wipe position."
                _WM_GO_WIPE
            {% endif %}
            _WM_ESTEP_WAIT MSG="Please wait, heating tool {cur + 1} to {s.temp} C at the wipe position."
            M109 S{s.temp} T{cur}
            _WM_ESTEP_WAIT MSG="Please wait, wiping the nozzle."
            WIPE_NOZZLE
            M400
        {% endif %}
        _WM_ESTEP_FINISH
        {% if cur in [0, 1, 2, 3] %}
            _WM_ESTEP_WAIT MSG="Please wait, parking tool {cur + 1}."
            PARK_CURRENT_TOOL
            M400
        {% endif %}
        M84
        _WM_ESTEP_WAIT MSG="Done. Klipper restarts now to use the new rotation_distance."
        RESPOND MSG="E-step: done, Klipper restarts now to use the new value."
        G4 P2000
        RESPOND TYPE=command MSG="action:prompt_end"
        RESTART
    {% endif %}

[gcode_macro _WM_ESTEP_CANCEL]
description: E-step Cancel / Do not save button: nothing saved, nozzle off, the tool is parked and the motors are turned off
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="E-step calibration stopped, nothing saved."
    _WM_ESTEP_PARK

[gcode_macro _WM_ESTEP_FINISH]
description: E-step: stop the 15 minute timer, nozzle of the tool off, head sensor back on, activate the extruder that was active before
gcode:
    {% set s = printer["gcode_macro _WM_ESTEP"] %}
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_OFF DURATION=0
    UPDATE_DELAYED_GCODE ID=_WM_ESTEP_HEATWATCH DURATION=0
    {% if s.t|int >= 0 %}
        M104 S0 T{s.t|int}
        # the head sensor back on. The watcher gets the filament state of now as its last state, so the filament
        # that is still in the tool head is not taken for a new insert (it would start an automatic load)
        {% set ns = namespace(p=[]) %}
        {% for i in range(4) %}
            {% set k = "filament_switch_sensor filament%d" % i %}
            {% set ns.p = ns.p + [1 if (k in printer and printer[k].filament_detected) else 0] %}
        {% endfor %}
        {% if ("filament_switch_sensor filament%d" % s.t|int) in printer %}
            SET_FILAMENT_SENSOR SENSOR=filament{s.t|int} ENABLE=1
        {% endif %}
        {% if "gcode_macro _WM_HEAD_QUEUE" in printer %}
            SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=prev VALUE="{ns.p}"
            SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=cand VALUE="[0, 0, 0, 0]"
            SET_GCODE_VARIABLE MACRO=_WM_HEAD_QUEUE VARIABLE=marks VALUE="[0, 0, 0, 0]"
        {% endif %}
        {% if s.prev != "" and s.prev != s.ext %}
            ACTIVATE_EXTRUDER EXTRUDER={s.prev}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ESTEP VARIABLE=t VALUE=-1
    {% endif %}
