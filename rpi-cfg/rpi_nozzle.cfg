#   _WM_ESTEP_AFTER_INSERT             - E-step: after Insert filament, asks the head filament sensor of the tool: no filament seen
#   _WM_ESTEP_NOFIL                    - E-step window: the head sensor sees no filament, insert the filament (buttons Insert filam
#   _WM_ESTEP_S1                       - E-step step 1 window: prepare the tool (picture estep-prepare)
#   _WM_ESTEP_HEAT                     - E-step: activate the extruder of the tool and start heating its nozzle (no waiting here), 
#   _WM_ESTEP_HEATWIN                  - E-step: heating window (shows the nozzle temperature, buttons Park tool and Cancel), redra
