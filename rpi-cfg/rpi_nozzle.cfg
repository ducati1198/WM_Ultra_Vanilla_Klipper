# rpi_nozzle.cfg  -  Nozzle Type and Extruder Setup for the Raspberry Pi (not part of WonderMaker's files)
#
# These macros do from Fluidd what two pages of the WonderMaker screen app (General) do, plus one that only the Pi has:
#   screen: General > Nozzle Type             _WM_NOZZLE_TYPE     (hidden) pick a nozzle, its material (hardened / stainless steel) and diameter; WM_NOZZLE_CHANGE offers it when you are done
#   screen: General > Extruder Setup          WM_EXTRUDER_SETUP   the app's page: the instructions and Set Up, which matches the tool heads to their docks and fixes the CAN ids
#   (no page in the app)                      WM_NOZZLE_CHANGE    release the tool heads so you can change nozzles (Pi only)
#                                             _WM_NOZZLE_CHANGE_END   (hidden) finish it: the Done button of WM_NOZZLE_CHANGE runs it; type it if you cancel or the wizard stops half way
# Each one opens a window in Fluidd and walks you through it, like WM_FIRST_RUN_CAL.
#
# How they work, so nothing is a surprise:
#   _WM_NOZZLE_TYPE   saves the material as nozzle_type0..3 in saved_variables.cfg, and writes the diameter into
#                    "nozzle_diameter:" of [extruder] / [extruder1] ... in printer.cfg (a copy of printer.cfg is kept first).
#                    That edit is done by wm_nozzle.py through Klipper's gcode shell command extension, so this file needs it
#                    (the installer adds both). Klipper has to be restarted to read the new diameter; the window offers it.
#                    Klipper itself only uses the diameter as a label; your slicer's nozzle setting is what counts.
#   WM_NOZZLE_CHANGE sets is_nozzle_setting = 1 in saved_variables.cfg (WonderMaker's own switch: the tool change macros then
#                    stop complaining that a tool is missing from its dock), parks the tool that is on the carriage in its dock
#                    and unlocks it. _WM_NOZZLE_CHANGE_END puts the switch back to 0. The calibration macros refuse to start while
#                    the switch is 1, because with it on the printer cannot tell that a tool is missing.
#
#   WM_EXTRUDER_SETUP  does what the app's Set Up button does (read from the app, not guessed): it picks up T0, T1, T2 and T3 one after the other with
#                    is_nozzle_setting = 1, and after each pick looks at the dock sensors for the first dock that is empty. If tool n came out of
#                    dock m, then tool n gets the CAN id that was stored for dock m. Nothing is written while it runs. At the end it parks the
#                    tool and shows the result. If every tool came out of its own dock nothing changes. If the ids would change it asks, and on
#                    Apply wm_canids.py writes them into wm_zru_thr0.cfg ... wm_zru_thr3.cfg (a copy of each changed file is kept) and Klipper
#                    does FIRMWARE_RESTART. If two tools would end up with the same id it writes nothing. Unlike the app, it also stops at the
#                    first tool that cannot be picked up, instead of going on.
#
# The speed test (WM_AUTO_SPEED, _WM_AUTO_SPEED_VALIDATE) is at the end of this file: it needs the same shell command extension (its Save script).
#
# Safety: all of them refuse to start while a print is running or paused. Both Extruder Setup and the nozzle change need every heater off and the hotends below 50 C.

# ---- INDEX (auto, wm_cfg_index.py) ----
# rpi_nozzle.cfg: 65 macros (4 visible in Fluidd, 61 hidden with a leading underscore)
# Visible:
#   WM_NOZZLE_CHANGE                   - Release the tool heads so you can change nozzles, in a Fluidd window (Pi only: the app has
#   WM_EXTRUDER_SETUP                  - The screen's Extruder Setup page: instructions and Set Up, which matches the tool heads to
#   WM_AUTO_SPEED                      - Window: speed test of the X and Y motors (finds the highest acceleration and speed without
#   WM_ESTEP_CAL                       - Window: e-step (rotation_distance) calibration of one tool head, saves the new value in pr
# Hidden helpers:
#   _WM_NOZZLE_TYPE                    - Set the nozzle material and diameter of a tool head, in a Fluidd window (app: General > No
#   _WM_NOZZLE_MATERIAL                - Nozzle Type, step 2: material of nozzle T (0-3)
#   _WM_NOZZLE_DIAMETER                - Nozzle Type, step 3: diameter of nozzle T (0-3), material TYPE (0 hardened, 1 stainless)
#   _WM_NOZZLE_SURE                    - Nozzle Type, step 4: show what will be written
#   _WM_NOZZLE_APPLY                   - Nozzle Type, last step: write the material and the diameter
#   _WM_NCHANGE_CHECK                  - Stop unless it is safe to release the tool heads
#   _WM_NCHANGE_RUN                    - Change nozzles, step 2: tool change check off, park and unlock the tool on the carriage
#   _WM_NCHANGE_AFTER                  - Change nozzles, step 3: tell the result of the unlock
#   _WM_NCHANGE_FAILED                 - Nozzle change stopped: put the switch back and say why
#   _WM_NOZZLE_CHANGE_END              - Finish the nozzle change: tool change check back on (is_nozzle_setting = 0), and a look at
#   _WM_MATCH_STATE                    - Memory of WM_EXTRUDER_SETUP (Set Up): the dock that was empty after each pick (do not run)
#   _WM_MATCH_NEXT                    [delayed] 
#   _WM_MATCH_CHECK                    - Stop unless the matching can start
#   _WM_MATCH_RUN                      - Matching, step 2: home, park the tool on the carriage, then pick the tools one by one
#   _WM_MATCH_STEP                     - Matching: pick up tool N and see which dock came out empty
#   _WM_MATCH_AFTER                    - Matching: note the empty dock after the pick of tool N, then go on with the next tool or f
#   _WM_MATCH_FINISH                   - Matching: park the tool, switch off, show what the result means
#   _WM_RESTART_KLIPPER                - Close the open Fluidd window, then restart Klipper (the Restart Klipper now button)
#   _WM_MATCH_APPLY                    - Matching, last step: write the four CAN ids and restart the firmware
