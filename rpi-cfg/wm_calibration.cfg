# wm_calibration.cfg  -  calibration macros for the Raspberry Pi (not part of WonderMaker's files)
#
# These macros do from Fluidd what the buttons in the WonderMaker screen app do:
#   screen: General > Maintenance             Pi macro
#   Bed Leveling                              WM_BED_LEVELING
#   Vibration Compensation                    WM_VIBRATION_COMP
#   Nozzle Temperature Calibration            WM_NOZZLE_TEMP_CAL
#   Extruder Offsets Calibration              WM_OFFSETS_RAPID  or  WM_OFFSETS_ACCURATE
#   PROBE_CALIBRATE                           WM_PROBE_CALIBRATE
#   Heated bed PID                            WM_BED_PID  (the app has no button for it)
#   Extruder Setup                            WM_EXTRUDER_SETUP     (file wm_nozzle.cfg)
#   one click, hands-off                      WM_FULL_CALIBRATION   (extruder setup, bed mesh, tool offsets, shaper, bed PID, hotend PID; Z height is offered at the end)
#
# They call WonderMaker's own macros (G29, CALIBRATE_OFFSET_ALL_*, PROBE_CALIBRATE, ...), so they need the factory
# macros.cfg and offset_calibrate.cfg from this repository (or from a WonderMaker release) to be installed too.
#
# Safety, in every macro:
#   - refuses to start while a print is running or paused, or while any heater has a target above 0
#   - asks you to confirm in Fluidd first (a window with Start / Cancel). Stay at the printer.
#   - turns the heaters off when it ends. _WM_CAL_STOP (hidden; the Stop heaters button of the windows) does that on demand.
#   - SAVE_CONFIG restarts Klipper. Macros that change [bed_mesh] / [input_shaper] / PID values save at the end;
#     WM_FULL_CALIBRATION saves once, after its last stage, when you click Save and Restart.
#
# Not included on purpose: Feed & Discharge (it needs the nozzle removed and your hands on the printer).
# Extruder Setup and the nozzle change have their own file, wm_nozzle.cfg: WM_EXTRUDER_SETUP and WM_NOZZLE_CHANGE (the nozzle type window is part of the nozzle change).
# Printer must be Ready. The app's own G-code sequences were read from WonderMaker's screen app; see rpi-cfg/README.md.

# ------------------------------------------------------------------ helpers

[gcode_macro WM_CAL_HELP]
description: List the Pi calibration macros
gcode:
    RESPOND MSG="WM_FULL_CALIBRATION - one click: explains it in a window, then runs everything hands-off (extruder setup, bed leveling, tool offsets, vibration compensation, bed PID, hotend PID) and saves once"
    RESPOND MSG="WM_EXTRUDER_SETUP   - match the tool heads to their docks and fix the CAN ids (app: Extruder Setup > Set Up). It is also the first stage of WM_FULL_CALIBRATION"
    RESPOND MSG="WM_BED_LEVELING     - 49 point bed mesh (app: Bed Leveling)"
    RESPOND MSG="WM_SCREWS_CAL       - bed screws: probes the 4 screws and tells you how far to turn each one (SCREWS_TILT_CALCULATE). Run it again until all say 00:00"
    RESPOND MSG="WM_PROBE_CALIBRATE  - Z height, with the bed warm. You adjust with TESTZ then ACCEPT"
    RESPOND MSG="WM_OFFSETS_RAPID / WM_OFFSETS_ACCURATE [TEMP=220] - offsets of all tool heads (app: Extruder Offsets Calibration)"
    RESPOND MSG="WM_VIBRATION_COMP   - input shaper (app: Vibration Compensation)"
    RESPOND MSG="WM_BED_PID [TARGET=60] - PID tuning of the heated bed"
    RESPOND MSG="WM_NOZZLE_TEMP_CAL [T=all|0..3] [TARGET=210..280] [FAN=30..100] - hotend PID of all four tool heads (or one) one after the other, windows ask the temperature (210 to 280), the fan speed (30, 50, 70, 100) and the head, one Save and Restart at the end"
    RESPOND MSG="WM_NOZZLE_CHANGE    - release the tool heads to change nozzles (Pi only). Its Done button turns the tool change check back on and offers the Nozzle Type window (material and diameter of the new nozzle)"
    RESPOND MSG="Hidden helpers (names start with _, type them in the console if a window was closed half way): _WM_CAL_STOP turns heaters and fan off, _WM_NOZZLE_CHANGE_END finishes a nozzle change, _WM_NOZZLE_TYPE opens the nozzle type window"

[gcode_macro _WM_CAL_STOP]
description: Heaters and fan off (use after an interrupted calibration)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    TURN_OFF_HEATERS
    M106 S0
    RESPOND MSG="Heaters and fan are off."

[gcode_macro _WM_PROMPT_CLOSE]
description: Close the Fluidd / screen window, then show MSG (used by the window buttons)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if params.MSG is defined %}
        M118 {params.MSG}
    {% endif %}

[gcode_macro _WM_SAVE]
description: Close the Fluidd / screen window, then SAVE_CONFIG (Klipper restarts)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    SAVE_CONFIG

[gcode_macro _WM_FAIL]
description: Stop a macro with an error AFTER its window was closed (action_raise_error inside the macro text runs before any line of it)
gcode:
    {action_raise_error(params.MSG|default("Calibration stopped."))}

[gcode_macro _WM_CAL_PRECHECK]
description: Stop unless the printer is idle and every heater is off (ALLOW_BED=1 lets the bed be warm)
gcode:
    # Fluidd closes its own window when a button is pressed, the screen's window does not: tell it to close too.
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set allow_bed = params.ALLOW_BED|default(0)|int %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="{"A print is running or paused. Calibration not started."}"
    {% endif %}
    {% if printer.save_variables.variables.is_nozzle_setting|default(0)|int == 1 %}
        _WM_FAIL MSG="{"Extruder Setup or a nozzle change is still on (is_nozzle_setting = 1): the printer cannot tell that a tool is missing. Put the tools in their docks and run _WM_NOZZLE_CHANGE_END, then start again."}"
    {% endif %}
    {% for h in printer.heaters.available_heaters %}
        {% if printer[h].target|float > 0 and not (allow_bed == 1 and h == 'heater_bed') %}
            _WM_FAIL MSG="{"%s has a target of %s C. Turn it off first (_WM_CAL_STOP), then start again." % (h, printer[h].target)}"
        {% endif %}
    {% endfor %}

[gcode_macro _WM_CAL_ASK]
description: Show the Start / Cancel window in Fluidd for one stage (STAGE=level|probe|offsets|screws|shaper|bedpid|pid)
gcode:
    {% set stage = params.STAGE|default('level') %}
    {% set mode = params.MODE|default('rapid') %}
    {% set t = params.T|default(0)|int %}
    {% if stage == 'level' %}
        {% set title = "Bed Leveling" %}
        {% set text = "Heats the bed to 55 C and a nozzle to 140 C, wipes the nozzle and probes 49 points. Bed screws removed and bed clear?" %}
        {% set go = "WM_BED_LEVELING CONFIRM=1" %}
    {% elif stage == 'probe' %}
        {% set title = "PROBE_CALIBRATE" %}
        {% set text = "Warms the bed, moves to the middle and starts the Z height routine. You then use TESTZ Z=-0.1 and TESTZ Z=+0.05 and so on, and finish with ACCEPT." %}
        {% set go = "WM_PROBE_CALIBRATE CONFIRM=1" %}
    {% elif stage == 'offsets' %}
        {% set title = "Extruder Offsets Calibration (" ~ mode ~ ")" %}
        {% set text = "Calibrates every tool head with the nozzle gauge. Nozzles heat (accurate mode up to 220 C) and tools are picked up and parked." ~ (" Filament must be loaded in every tool head before you start." if mode == "accurate" else "") ~ " Bed clear?" %}
        {% set go = "WM_OFFSETS_" ~ mode|upper ~ " CONFIRM=1" %}
    {% elif stage == 'shaper' %}
        {% set title = "Vibration Compensation" %}
        {% set text = "The printer shakes the tool head on purpose and measures it. It is loud. Bed clear and nothing loose on the printer?" %}
        {% set go = "WM_VIBRATION_COMP CONFIRM=1" %}
    {% elif stage == 'screws' %}
        {% set title = "Bed Screws" %}
        {% set text = "Heats the bed to 55 C and a nozzle to 140 C, wipes the nozzle, then probes the four bed screws and tells you how far to turn each one (the first, front_right, is the reference and stays as it is). The result is printed in the console. Run it again until every screw shows 00:00. Bed clear?" %}
        {% set go = "WM_SCREWS_CAL CONFIRM=1" %}
    {% elif stage == 'bedpid' %}
        {% set title = "Bed PID" %}
        {% set text = "Heats the bed up and down several times to tune its PID. Takes several minutes. Plate installed and bed clear?" %}
        {% set go = "WM_BED_PID TARGET=" ~ params.TARGET|default(60)|int ~ " CONFIRM=1" %}
    {% else %}
        {% set title = "Nozzle Temperature Calibration T" ~ t %}
        {% set text = "Heats this hotend to the target with the fan at full and tunes its PID. Stay at the printer." %}
        {% set go = "WM_NOZZLE_TEMP_CAL T=" ~ t ~ " TARGET=" ~ params.TARGET|default(220)|int ~ " CONFIRM=1" %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin {title}"
    RESPOND TYPE=command MSG="action:prompt_text {text}"
    {% if stage == 'offsets' %}
        RESPOND TYPE=command MSG="action:prompt_text BEFORE YOU START: 1) Clean the nozzle tip of every tool head (pull off any filament, brush off the residue). 2) Check that probe_position in saved_variables.cfg is right: the nozzle tip must touch the tool setter at the height shown in the WonderMaker guide (the nozzle's tip shoulder level with the top of the tool setter). 3) Watch the first touch: if a nozzle hits the tool setter, cut the power at once so the nozzle is not bent. Guide: https://wiki.wondermaker3d.com/en/ZR-Ultra-S/Maintenance-Guide/Tool-Offsets-Calibration"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Start|{go}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_PROMPT_CLOSE MSG=Cancelled|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ------------------------------------------------------------------ one macro per app menu item

[gcode_macro WM_BED_LEVELING]
description: App "Bed Leveling": G29 (49 point mesh), then save
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set save = params.SAVE|default(1)|int %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=level
    {% else %}
        RESPOND MSG="Bed leveling started."
        RESPOND MSG="Bed leveling - step 1 of {3 if save == 1 else 2}: homing all axes"
        G28
        RESPOND MSG="Bed leveling - step 2 of {3 if save == 1 else 2}: heating the bed and a nozzle, wiping, then probing 49 points (several minutes)"
        G29
        TURN_OFF_HEATERS
        {% if save == 1 %}
            RESPOND MSG="Bed leveling - step 3 of 3: saving (Klipper restarts)"
            RESPOND MSG="Bed leveling done. Saving (Klipper restarts)."
            SAVE_CONFIG
        {% else %}
            RESPOND MSG="Bed leveling done (not saved yet)."
        {% endif %}
    {% endif %}

[gcode_macro WM_SCREWS_CAL]
description: Bed screws: heats, wipes, then SCREWS_TILT_CALCULATE probes the four bed screws and prints how far to turn each one. Run it again until every screw says 00:00
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    _WM_CAL_PRECHECK
    {% if 'screws_tilt_adjust' not in printer.configfile.settings %}
        _WM_FAIL MSG="{"There is no [screws_tilt_adjust] section in printer.cfg, so the bed screws cannot be measured."}"
    {% endif %}
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=screws
    {% else %}
        {% set original_tool = printer.save_variables.variables.current_extruder|default(-1)|int %}
        RESPOND MSG="Bed screws started."
        RESPOND MSG="Bed screws - step 1 of 4: homing all axes"
        G28
        RESPOND MSG="Bed screws - step 2 of 4: heating the bed to 55 C and a nozzle to 140 C{', picking up T0' if original_tool != 0 else ''}"
        M140 S55
        {% if original_tool != 0 %}
            T0
        {% endif %}
        G1 X150 Y135 F3000
        M104 S140
        M190 S55
        M109 S140
        RESPOND MSG="Bed screws - step 3 of 4: wiping the nozzle, then probing the four screws"
        WIPE_NOZZLE
        SCREWS_TILT_CALCULATE
        TURN_OFF_HEATERS
        RESPOND MSG="Bed screws - step 4 of 4: done. Turn each screw by the amount above (time style: 00:15 is a quarter turn, 00:30 a half turn, 01:00 a full turn, CW is clockwise seen from above). Then run WM_SCREWS_CAL again until every screw says 00:00."
    {% endif %}

[gcode_macro WM_PROBE_CALIBRATE]
description: App "PROBE_CALIBRATE": warm the bed, then WonderMaker's PROBE_CALIBRATE; you finish with TESTZ / ACCEPT
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set bed = params.BED|default(60)|int %}
    _WM_CAL_PRECHECK ALLOW_BED=1
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=probe
    {% else %}
        {% if bed > 100 %}
            {action_raise_error("BED=%d is above 100 C. This macro keeps the bed at 100 C or below." % bed)}
        {% endif %}
        RESPOND MSG="Warming the bed to {bed} C, then starting PROBE_CALIBRATE."
        M190 S{bed}
        PROBE_CALIBRATE
        RESPOND MSG="Now adjust with TESTZ Z=-0.1 (or +0.05, -0.025, ...). When the paper test feels right run ACCEPT, then _WM_PROBE_DONE."
    {% endif %}

[gcode_macro _WM_PROBE_DONE]
description: After ACCEPT: bed off, then save (SAVE=0 to skip the save)
gcode:
    {% set save = params.SAVE|default(1)|int %}
    M140 S0
    {% if save == 1 %}
        RESPOND MSG="Saving (Klipper restarts)."
        SAVE_CONFIG
    {% else %}
        RESPOND MSG="Bed off. Not saved yet."
    {% endif %}

[gcode_macro WM_OFFSETS_RAPID]
description: App "Extruder Offsets Calibration" - Rapid: G28, RAPID_MODE for every tool, PARK_CURRENT_TOOL (like the screen)
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=offsets MODE=rapid
    {% else %}
        RESPOND MSG="Rapid tool offset calibration started."
        G28
        M400
        {% for t in range(count) %}
            RESPOND MSG="Rapid: measuring T{t} ({t + 1} of {count})..."
            RAPID_MODE T={t}
            M400
        {% endfor %}
        PARK_CURRENT_TOOL
        M400
        TURN_OFF_HEATERS
        RESPOND MSG="Tool offsets done. WonderMaker's macros store them in saved_variables."
    {% endif %}

[gcode_macro WM_OFFSETS_ACCURATE]
description: App "Extruder Offsets Calibration" - Accurate (TEMP=220). Per tool NOZZLE_PREPARE, you remove the purged debris and click OK, NOZZLE_CALIBRATE_TOOL_OFFSET; then RAPID_MODE for every tool
gcode:
    # The same order as the screen app (read from its code). Klipper has no "wait for a button", so the macro ends
    # after preparing a tool and shows a window; its OK button runs this macro again with STEP=clean for that tool.
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set step = params.STEP|default('')|lower %}
    {% set n = params.N|default(0)|int %}
    {% set temp = params.TEMP|default(220)|int %}
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set do_prep = -1 %}
    {% set do_rapid = 0 %}
    {% if temp < 180 or temp > 260 %}
        _WM_FAIL MSG="{"TEMP=%d is outside 180 to 260 C." % temp}"
    {% endif %}
    {% if step == '' %}
        _WM_CAL_PRECHECK
        {% if confirm != 1 %}
            _WM_CAL_ASK STAGE=offsets MODE=accurate
        {% else %}
            {% set missing = [] %}
            {% for i in range(count) %}
                {% if not printer["filament_switch_sensor filament" ~ i].filament_detected %}
                    {% set _ = missing.append("T" ~ i) %}
                {% endif %}
            {% endfor %}
            {% if missing %}
                _WM_FAIL MSG="{"No filament in %s. Load filament in every tool head and start again." % (missing|join(", "))}"
            {% endif %}
            RESPOND MSG="Accurate tool offset calibration started."
            G28
            M400
            {% set do_prep = 0 %}
        {% endif %}
    {% elif step == 'clean' %}
        {% if printer.print_stats.state in ['printing', 'paused'] %}
            _WM_FAIL MSG="{"A print is running or paused. Calibration not continued."}"
        {% endif %}
        NOZZLE_CALIBRATE_TOOL_OFFSET T={n}
        M400
        {% if n + 1 < count %}
            {% set do_prep = n + 1 %}
        {% else %}
            {% set do_rapid = 1 %}
        {% endif %}
    {% else %}
        _WM_FAIL MSG="{"STEP must be empty or clean."}"
    {% endif %}
    {% if do_prep >= 0 %}
        RESPOND MSG="Accurate: preparing T{do_prep} ({do_prep + 1} of {count})..."
        _WM_NOZZLE_PREPARE S={temp} T={do_prep}
        M400
        RESPOND TYPE=command MSG="action:prompt_begin Tool head T{do_prep}"
        RESPOND TYPE=command MSG="action:prompt_text Before clicking 'OK' to continue, ensure the button-like purged debris has been manually removed from the nozzle tip."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button OK|WM_OFFSETS_ACCURATE STEP=clean N={do_prep} TEMP={temp}|primary"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_CAL_STOP|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif do_rapid == 1 %}
        {% for t in range(count) %}
            RESPOND MSG="Accurate: measuring T{t} ({t + 1} of {count})..."
            RAPID_MODE T={t}
            M400
        {% endfor %}
        PARK_CURRENT_TOOL
        M400
        TURN_OFF_HEATERS
        RESPOND MSG="Tool offsets done. WonderMaker's macros store them in saved_variables."
    {% endif %}

[gcode_macro _WM_NOZZLE_PREPARE]
description: Nozzle preparation for WM_OFFSETS_ACCURATE (S=hot temperature, T=tool). The factory NOZZLE_PREPARE steps, with the ACE feed assist on during the button purge when an ACE is present.
gcode:
    {% set T = params.T|default(99)|int %}
    {% set hot = params.S|default(220)|int %}
    {% set ace = "ace" in printer %}
    {% if not printer["filament_switch_sensor filament" ~ T].filament_detected %}
        _WM_FAIL MSG="{"No filament in T%d. Load filament and start again." % T}"
    {% endif %}
    T{T}
    {% if T < 1 %}
        M104 S140 T0
        G28 Z
    {% endif %}
    M400
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G1 X150.0 Y1 F5000.0
    PROBE
    _APPLY_PRE_Z_OFFSET  T={T}
    G91
    G1 Z1 F2000.0
    G90
    G92 E0
    M109 S{hot} T{T}
    {% if ace %}
        ACE_ENABLE_FEED_ASSIST T={T}
    {% endif %}
    G91
    G1 E120 F800            ; the button: extrude 120 mm
    G1 E-3 F800             ; retract 3 mm
    M400
    G90
    {% if ace %}
        ACE_DISABLE_FEED_ASSIST T={T}
    {% endif %}
    M106 S255               ; fan full on
    M109 S100 T{T}          ; cool to 100 C (prevents oozing)
    G1 Z80 F5000.0          ; lift to a safe height
    M106 S0                 ; fan off

[gcode_macro WM_VIBRATION_COMP]
description: App "Vibration Compensation": input shaper test (needs the lis2dw accelerometer on the EX_T board)
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set save = params.SAVE|default(1)|int %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=shaper
    {% else %}
        RESPOND MSG="Vibration compensation started."
        RESPOND MSG="Vibration compensation - step 1 of {3 if save == 1 else 2}: homing all axes"
        G28
        M400
        COLLISION_DETECT_DISABLE
        RESPOND MSG="Vibration compensation - step 2 of {3 if save == 1 else 2}: shaking the tool head and measuring (loud, a few minutes)"
        SHAPER_CALIBRATE
        {% if save == 1 %}
            RESPOND MSG="Vibration compensation - step 3 of 3: saving (Klipper restarts)"
            RESPOND MSG="Vibration compensation done. Saving (Klipper restarts)."
            SAVE_CONFIG
        {% else %}
            RESPOND MSG="Vibration compensation done (not saved yet)."
        {% endif %}
    {% endif %}

[gcode_macro WM_NOZZLE_TEMP_CAL]
description: Hotend PID of all four tool heads (or one) one after the other, each in the middle of the bed. Windows ask the temperature (210 to 280), the fan speed (30, 50, 70, 100) and the head, then one Save and Restart at the end
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set save = params.SAVE|default(1)|int %}
    {% set target = params.TARGET|default(0)|int %}
    {% set fan = params.FAN|default(0)|int %}
    {% set which = params.T|default('')|string|lower %}
    {% if confirm == 1 and target == 0 %}
        {% set target = 220 %}
    {% endif %}
    {% if confirm == 1 and fan == 0 %}
        {% set fan = 100 %}
    {% endif %}
    {% if confirm == 1 and which == '' %}
        {% set which = 'all' %}
    {% endif %}
    {% set chosen = [] %}
    {% if which == 'all' %}
        {% for t in range(4) %}
            {% set _ = chosen.append(t) %}
        {% endfor %}
    {% elif which in ['0', '1', '2', '3'] %}
        {% set _ = chosen.append(which|int) %}
    {% endif %}
    {% set ok = [] %}
    {% set bad = [] %}
    {% for t in chosen %}
        {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
        {% if hn in printer.heaters.available_heaters and printer.configfile.settings[hn].control|default('watermark') == 'pid' %}
            {% set _ = ok.append(t) %}
        {% else %}
            {% set _ = bad.append(t) %}
        {% endif %}
    {% endfor %}
    {% set okn = [] %}
    {% for t in ok %}
        {% set _ = okn.append("T%d" % t) %}
    {% endfor %}
    {% set badn = [] %}
    {% for t in bad %}
        {% set _ = badn.append("T%d" % t) %}
    {% endfor %}
    {% set fix = "To tune a head its heater section must have the line control: pid. Open printer.cfg in Fluidd, find the section (extruder for T0, extruder1 for T1, extruder2 for T2, extruder3 for T3) and add control: pid above the SAVE_CONFIG line, then restart Klipper. Or, on the Pi in the wm-ultra-rpi folder, run ./installer.sh --pid-cfg and it fixes all heads for you." %}
    _WM_CAL_PRECHECK
    {% if target != 0 and (target < 150 or target > 280) %}
        _WM_FAIL MSG="TARGET={target} is outside 150 to 280 C. Choose a value in that range."
    {% elif fan < 0 or fan > 100 %}
        _WM_FAIL MSG="FAN={fan} is outside 0 to 100 percent."
    {% elif which != '' and chosen|length == 0 %}
        _WM_FAIL MSG="T must be all or a tool head from 0 to 3."
    {% elif target == 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin Hotend PID"
        RESPOND TYPE=command MSG="action:prompt_text Choose the temperature to tune the hotends at. Pick the temperature you print at most. Each head is tuned at the same temperature."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for tmp in range(210, 281, 10) %}
            {% if loop.index0 == 4 %}
                RESPOND TYPE=command MSG="action:prompt_button_group_end"
                RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% endif %}
            RESPOND TYPE=command MSG="action:prompt_button {tmp} C|WM_NOZZLE_TEMP_CAL TARGET={tmp}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif fan == 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin Hotend PID at {target} C"
        RESPOND TYPE=command MSG="action:prompt_text Choose the part cooling fan speed during the tuning. Pick the speed you print at most. The tuning then matches the cooling you have in a print."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button 30%|WM_NOZZLE_TEMP_CAL TARGET={target} FAN=30|secondary"
        RESPOND TYPE=command MSG="action:prompt_button 50%|WM_NOZZLE_TEMP_CAL TARGET={target} FAN=50|secondary"
        RESPOND TYPE=command MSG="action:prompt_button 70%|WM_NOZZLE_TEMP_CAL TARGET={target} FAN=70|secondary"
        RESPOND TYPE=command MSG="action:prompt_button 100%|WM_NOZZLE_TEMP_CAL TARGET={target} FAN=100|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button Back|WM_NOZZLE_TEMP_CAL"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif which == '' %}
        RESPOND TYPE=command MSG="action:prompt_begin Hotend PID at {target} C, fan {fan}%"
        RESPOND TYPE=command MSG="action:prompt_text Choose the tool head to tune. Each head is picked up and tuned in the middle of the bed, one after the other."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button All heads|WM_NOZZLE_TEMP_CAL TARGET={target} FAN={fan} T=all|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for t in range(4) %}
            {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
            {% if hn in printer.heaters.available_heaters and printer.configfile.settings[hn].control|default('watermark') == 'pid' %}
                RESPOND TYPE=command MSG="action:prompt_button T{t}|WM_NOZZLE_TEMP_CAL TARGET={target} FAN={fan} T={t}|secondary"
            {% else %}
                RESPOND TYPE=command MSG="action:prompt_button T{t} (no PID)|WM_NOZZLE_TEMP_CAL TARGET={target} FAN={fan} T={t}|warning"
            {% endif %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button Back|WM_NOZZLE_TEMP_CAL TARGET={target}"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif confirm != 1 and ok|length == 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin Hotend PID: cannot tune"
        RESPOND TYPE=command MSG="action:prompt_text {badn|join(', ')} cannot be tuned because the heater does not use control: pid."
        RESPOND TYPE=command MSG="action:prompt_text {fix}"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Back|WM_NOZZLE_TEMP_CAL TARGET={target} FAN={fan}|primary"
        RESPOND TYPE=command MSG="action:prompt_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif confirm != 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Hotend PID"
        RESPOND TYPE=command MSG="action:prompt_text Tunes {okn|join(', ')} at {target} C with the part cooling fan at {fan}%, one after the other. Each head is picked up and heated in the middle of the bed, then cooled below 80 C before the next one. It takes about 5 to 10 minutes per head. Stay at the printer, bed clear."
        {% if bad|length > 0 %}
            RESPOND TYPE=command MSG="action:prompt_text Skipped: {badn|join(', ')}, the heater does not use control: pid. {fix}"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_text The new values are shown at the end and are saved only when you press Save and Restart."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Start|WM_NOZZLE_TEMP_CAL TARGET={target} FAN={fan} T={which} CONFIRM=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_PROMPT_CLOSE MSG=Cancelled|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif ok|length == 0 %}
        RESPOND MSG="Hotend PID skipped: {badn|join(', ')} do not use control: pid."
        RESPOND MSG="{fix}"
    {% else %}
        {% if bad|length > 0 %}
            RESPOND MSG="Hotend PID: skipping {badn|join(', ')}, the heater does not use control: pid. {fix}"
        {% endif %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        RESPOND MSG="Hotend PID of {okn|join(', ')} at {target} C started with the fan at {fan}%. If a head fails, the heads done so far are kept: run _WM_NOZZLE_TEMP_CAL_RESULT to save them and _WM_CAL_STOP to turn the heaters off."
        {% for t in ok %}
            RESPOND MSG="Hotend PID {loop.index} of {ok|length}: T{t} at {target} C"
            _WM_PID_HEAD T={t} TARGET={target} FAN={fan} LAST={1 if loop.last else 0}
        {% endfor %}
        PARK_CURRENT_TOOL
        TURN_OFF_HEATERS
        M106 S0
        {% if save == 1 %}
            _WM_NOZZLE_TEMP_CAL_RESULT
        {% else %}
            RESPOND MSG="Hotend PID done (not saved yet)."
        {% endif %}
    {% endif %}

[gcode_macro _WM_PID_HEAD]
description: One hotend PID run of WM_NOZZLE_TEMP_CAL - pick up the tool, middle of the bed, tune, cool below 80 C unless it is the last head
gcode:
    {% set t = params.T|int %}
    {% set target = params.TARGET|int %}
    {% set last = params.LAST|default(0)|int %}
    {% set fan = params.FAN|default(100)|int %}
    {% set heater = "extruder" if t == 0 else "extruder%d" % t %}
    T{t}
    G90
    G1 Z50 F3000
    G1 X150 Y150 F6000
    M106 S{(fan * 255 / 100)|round|int}
    PID_CALIBRATE HEATER={heater} TARGET={target}
    TURN_OFF_HEATERS
    {% if last == 0 %}
        RESPOND MSG="Cooling {heater} below 80 C before the next head"
        M106 S255
        TEMPERATURE_WAIT SENSOR={heater} MAXIMUM=80
    {% endif %}
    M106 S0

[gcode_macro _WM_NOZZLE_TEMP_CAL_RESULT]
description: Show the new hotend PID values that wait to be saved (also after a stopped run), with Save and Restart / Discard
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set pend = printer.configfile.save_config_pending_items|default({}) %}
    {% set lines = [] %}
    {% for t in range(4) %}
        {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
        {% if hn in pend and 'pid_Kp' in pend[hn] %}
            {% set old = printer.configfile.settings[hn]|default({}) %}
            {% set _ = lines.append("T%d: Kp %.2f to %.2f, Ki %.2f to %.2f, Kd %.2f to %.2f" % (t, old.pid_kp|default(0)|float, pend[hn].pid_Kp|float, old.pid_ki|default(0)|float, pend[hn].pid_Ki|float, old.pid_kd|default(0)|float, pend[hn].pid_Kd|float)) %}
        {% endif %}
    {% endfor %}
    {% if lines|length == 0 %}
        _WM_FAIL MSG="There are no new hotend PID values waiting to be saved."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Hotend PID done"
        RESPOND TYPE=command MSG="action:prompt_text New values, old to new:"
        {% for l in lines %}
            RESPOND TYPE=command MSG="action:prompt_text {l}"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_text Nothing is saved yet. Save and Restart stores the new values and restarts Klipper. Discard restarts Klipper without saving."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Save and Restart|_WM_SAVE|primary"
        RESPOND TYPE=command MSG="action:prompt_button Discard|_WM_RESTART_KLIPPER|error"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro WM_BED_PID]
description: Heated bed PID (PID_CALIBRATE HEATER=heater_bed). TARGET=60 (40 to 110). Only if the bed uses control: pid
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set save = params.SAVE|default(1)|int %}
    {% set target = params.TARGET|default(60)|int %}
    {% if 'heater_bed' not in printer.heaters.available_heaters %}
        {action_raise_error("There is no heater_bed.")}
    {% endif %}
    {% if target < 40 or target > 110 %}
        {action_raise_error("TARGET=%d is outside 40 to 110 C. Choose a value in that range." % target)}
    {% endif %}
    {% if printer.configfile.settings['heater_bed'].control|default('watermark') != 'pid' %}
        {action_raise_error("heater_bed uses control: %s. PID tuning has no effect unless its section in printer.cfg says control: pid." % printer.configfile.settings['heater_bed'].control|default('watermark'))}
    {% endif %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=bedpid TARGET={target}
    {% else %}
        RESPOND MSG="Bed PID tuning at {target} C started. It takes several minutes."
        {% if "xyz" not in printer.toolhead.homed_axes %}
            RESPOND MSG="Bed PID - step 1 of {3 if save == 1 else 2}: homing all axes"
            G28
        {% endif %}
        RESPOND MSG="Bed PID - heating the bed up and down at {target} C to tune it (step 2 of {3 if save == 1 else 2})"
        PID_CALIBRATE HEATER=heater_bed TARGET={target}
        TURN_OFF_HEATERS
        {% if save == 1 %}
            RESPOND MSG="Bed PID - step 3 of 3: saving (Klipper restarts)"
            RESPOND MSG="Bed PID tuning done. Saving (Klipper restarts)."
            SAVE_CONFIG
        {% else %}
            RESPOND MSG="Bed PID tuning done (not saved yet)."
        {% endif %}
    {% endif %}

# ------------------------------------------------------------------ WM_FULL_CALIBRATION (hands-off)

[gcode_macro WM_FULL_CALIBRATION]
description: One click calibration of the Pi: extruder setup, bed mesh, tool offsets, input shaper, bed PID, hotend PID. Explains it in a Fluidd window first
gcode:
    _WM_CAL_PRECHECK
    {% set pid_ok = [] %}
    {% for t in range(4) %}
        {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
        {% if hn in printer.heaters.available_heaters and printer.configfile.settings[hn].control|default('watermark') == 'pid' %}
            {% set _ = pid_ok.append(t) %}
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Full Calibration"
    RESPOND TYPE=command MSG="action:prompt_text This runs the calibrations your printer needs after a new Raspberry Pi, new hardware or a move. It runs by itself and saves once at the end."
    RESPOND TYPE=command MSG="action:prompt_text What it runs, in this order: 1) Extruder setup: picks up T0 to T3 one after the other and checks that each tool head has the CAN id of its dock. 2) Bed leveling: heats the bed to 55 C and a nozzle to 140 C, wipes, probes 49 points. 3) Extruder offsets (rapid): calibrates every tool head. 4) Vibration compensation: input shaping with the accelerometer, the printer shakes loudly. 5) Bed PID: tunes the heated bed at 60 C. {'6) Hotend PID: tunes the hotends that use control pid, one after the other in the middle of the bed.' if pid_ok|length > 0 else '6) Hotend PID: skipped, your hotends use control watermark (fix: ./installer.sh --pid-cfg).'}"
    RESPOND TYPE=command MSG="action:prompt_text Before you start: no print running, plate installed and clean, bed clear of tools, nozzles clean. All four tool heads must hang in their docks (hang the extruders on the rear support and keep their wires from tangling). If one is on the carriage, HOLD IT with your hand and release it with Unlock gripper in KlipperScreen (Calibration), never unlock the gripper from Fluidd, the tool head would fall onto the bed. Do not touch or bump the printer, and keep the door and lid closed. Heaters turn on by themselves, so stay nearby."
    RESPOND TYPE=command MSG="action:prompt_text If the extruder setup finds tool heads in other docks, it asks you to apply the new CAN ids. Klipper then restarts and you start the Full Calibration again (the setup then finds nothing to change and goes on). It takes roughly 60 to 85 minutes."
    RESPOND TYPE=command MSG="action:prompt_text Nothing else is saved until the end: a window then asks Save and Restart, which restarts Klipper. If you do not save, the results are lost at the next restart. Z height (PROBE_CALIBRATE) needs you at the printer, so it is offered at the end."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Start Calibration|_WM_FULL_CALIBRATION|primary"
    RESPOND TYPE=command MSG="action:prompt_button Stop heaters|_WM_CAL_STOP|error"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_FULL_CALIBRATION]
description: The work of WM_FULL_CALIBRATION (use WM_FULL_CALIBRATION instead, it asks first). Stage 1 is the extruder setup; _WM_MATCH_FINISH goes on with _WM_FULL_CALIBRATION_REST
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _WM_CAL_PRECHECK
    # the setup must be able to start before the flag is set, or a stopped start would leave the flag on
    _WM_MATCH_CHECK
    RESPOND MSG="Full calibration - 1 of 6: extruder setup"
    SET_GCODE_VARIABLE MACRO=_WM_MATCH_STATE VARIABLE=full VALUE=1
    _WM_MATCH_RUN

[gcode_macro _WM_FULL_CALIBRATION_REST]
description: Stages 2 to 6 of WM_FULL_CALIBRATION, run by the extruder setup when every tool came out of its own dock
gcode:
    _WM_CAL_PRECHECK
    RESPOND MSG="Full calibration - 2 of 6: bed leveling"
    WM_BED_LEVELING CONFIRM=1 SAVE=0
    RESPOND MSG="Full calibration - 3 of 6: extruder offsets (rapid)"
    WM_OFFSETS_RAPID CONFIRM=1
    RESPOND MSG="Full calibration - 4 of 6: vibration compensation"
    WM_VIBRATION_COMP CONFIRM=1 SAVE=0
    RESPOND MSG="Full calibration - 5 of 6: bed PID"
    {% if printer.configfile.settings['heater_bed'].control|default('watermark') == 'pid' %}
        WM_BED_PID CONFIRM=1 SAVE=0
    {% else %}
        RESPOND MSG="Full calibration - bed PID skipped: the bed uses control watermark."
    {% endif %}
    RESPOND MSG="Full calibration - 6 of 6: hotend PID"
    WM_NOZZLE_TEMP_CAL TARGET=220 T=all CONFIRM=1 SAVE=0
    TURN_OFF_HEATERS
    M106 S0
    RESPOND MSG="------------- Full Calibration Complete! -------------"
    _WM_FULL_CALIBRATION_DONE

[gcode_macro _WM_FULL_CALIBRATION_DONE]
description: Window shown when WM_FULL_CALIBRATION has finished (Save and Restart / probe calibration)
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Full Calibration Complete"
    RESPOND TYPE=command MSG="action:prompt_text Calibration is complete. The bed mesh, input shaper and PID values are saved when you press Save and Restart. Klipper then restarts. The tool offsets are already stored by WonderMaker's macros."
    RESPOND TYPE=command MSG="action:prompt_text Z height is not part of the full calibration. After the restart run WM_PROBE_CALIBRATE with the PEI plate installed."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Save and Restart|_WM_SAVE|primary"
    RESPOND TYPE=command MSG="action:prompt_button Not now|_WM_PROMPT_CLOSE MSG=Not saved. Run SAVE_CONFIG to keep the results.|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"
