[gcode_macro EXTRUDE_FILAMENT]
variable_extrude_length:100
gcode:
    z_rise
    RESPOND MSG="Extruding filament on T{params.T|default(0)|int}"
    {% set T = params.T|default(0)|int %}
    {% if printer[printer.toolhead.extruder].temperature < printer.configfile.settings.extruder.min_extrude_temp %} 
        M109 S220 T{T}
    {% endif %}
    M400
    M106 S0
    G90
    # F-164/F-187: the purge is at the purge location; no own-position fallback
    _WM_PURGE_LOCATION
    M83
    G92 E0 
    G91
    # G1 Z-6 F2000.0
    G1 E{extrude_length} F400
    G90
    M106 S255
    M400
    M109 S160 T{T}
    M106 S0
    M400
    WIPE_NOZZLE
    PARK_CURRENT_TOOL


[gcode_macro RETRACT_FILAMENT]
gcode:
    z_rise
    RESPOND MSG="Retracting filament"
    G90
    # F-187: the retract is at the purge location too (before: X-13 Y232)
    _WM_PURGE_LOCATION
    M83
    G92 E0 
    G91
    G1 E3 F600
    G1 E-20 F3500   
    G4 P5000       
    G1 E10 F1000  
    G1 E-50 F1000
    G90
    M400

[gcode_macro LOAD_FILAMENT]
variable_extrude_length:100
gcode:
    RESPOND MSG="Loading filament on T{params.T|default(0)|int}"
    {% set T = params.T|default(0)|int %}
    {% set en = "extruder" if T == 0 else "extruder%d" % T %}
    # F-150: the head is picked up if it is not on the carriage, heats at the wipe position, is wiped after the move and parked
    {% set at_wipe = "gcode_macro _WM_GO_WIPE_HEAT" in printer %}
    {% if at_wipe %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        {% if printer.save_variables.variables.current_extruder|default(99)|int != T %}
            _CHANGE_TOOL T={T}
        {% endif %}
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER={en}
    {% if at_wipe %}
        _WM_GO_WIPE_HEAT T={T} S=220
    {% else %}
        M109 S220 T{T}
    {% endif %}
    M83
    G92 E0
    G91
    G1 E{extrude_length} F400
    G90
    M400
    {% if at_wipe %}
        WIPE_NOZZLE
    {% endif %}
    M104 S0 T{T}
    SET_STEPPER_ENABLE STEPPER={en} ENABLE=0
    {% if at_wipe %}
        PARK_CURRENT_TOOL
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
variable_extrude_length:2
variable_retract_length:45
gcode:
    RESPOND MSG="Unloading filament on T{params.T|default(0)|int}"
    {% set T = params.T|default(0)|int %}
    {% set en = "extruder" if T == 0 else "extruder%d" % T %}
    # F-150: the head is picked up if it is not on the carriage, heats at the wipe position, is wiped after the move and parked
    {% set at_wipe = "gcode_macro _WM_GO_WIPE_HEAT" in printer %}
    {% if at_wipe %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        {% if printer.save_variables.variables.current_extruder|default(99)|int != T %}
            _CHANGE_TOOL T={T}
        {% endif %}
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER={en}
    {% if at_wipe %}
        _WM_GO_WIPE_HEAT T={T} S=220
    {% else %}
        M109 S220 T{T}
    {% endif %}
    M83
    G92 E0
    G91
    G1 E{extrude_length} F400
    G1 E-{retract_length} F600
    G90
    M400
    {% if at_wipe %}
        WIPE_NOZZLE
    {% endif %}
    M104 S0 T{T}
    SET_STEPPER_ENABLE STEPPER={en} ENABLE=0
    {% if at_wipe %}
        PARK_CURRENT_TOOL
    {% endif %}

