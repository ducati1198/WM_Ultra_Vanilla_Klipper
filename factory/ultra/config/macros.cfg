[delayed_gcode PRINTER_INIT]
initial_duration:5.0
gcode:
    RESET_FLOW_EXTRUDER


[gcode_macro START_PRINT] #start-print macro
variable_adaptive_mesh: False
variable_adaptive_mesh_enable:True
variable_print_body_ready: False
gcode:
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=False
    M118 START_PRINT begin
    G90                            # G90: a jog error can leave G91 on (F-181), every print start begins in absolute mode
    {% if "gcode_macro _WM_LIVEZ_RESET" in printer %}
        _WM_LIVEZ_RESET
    {% endif %}
    {% if "gcode_macro WM_CHAMBER_LIGHT" in printer %}
        WM_CHAMBER_LIGHT STATE=on
    {% endif %}
    {% set BED = params.BED|int %}
    {% set EXTRUDER = params.EXTRUDER|int %}
    {% set INITIAL_TOOL = params.INITIAL_TOOL|int %}
    {% if params.MESH_MIN_X is defined and params.MESH_MIN_Y is defined and params.MESH_MAX_X is defined and params.MESH_MAX_Y is defined and params.PROBE_COUNT_X is defined and params.PROBE_COUNT_Y is defined %}
        {% set MESH_MIN_X = params.MESH_MIN_X|float %}
        {% set MESH_MIN_Y = params.MESH_MIN_Y|float %}
        {% set MESH_MAX_X = params.MESH_MAX_X|float %}
        {% set MESH_MAX_Y = params.MESH_MAX_Y|float %}
        {% set PROBE_COUNT_X = params.PROBE_COUNT_X|int %}
        {% set PROBE_COUNT_Y = params.PROBE_COUNT_Y|int %}
        {% set adaptive_mesh = True %}
    {% else %}
        {% set adaptive_mesh = False %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh VALUE=0
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    {% if "gcode_macro _WM_BED_SOAK_MARK" in printer %}
        _WM_BED_SOAK_MARK              # bed temperature at the start, for the bed warp wait (rpi_bed_soak.cfg)
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED}
    # SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER}

    ;initialise the MMU-related macros
    # MMU_START_SETUP INITIAL_TOOL={initial_tool} REFERENCED_TOOLS=!referenced_tools! TOOL_COLORS=!colors! TOOL_TEMPS=!temperatures! TOOL_MATERIALS=!materials! PURGE_VOLUMES=!purge_volumes!
    ;call the start check
    # MMU_START_CHECK
    # _TOOL_CHECK
    
    BED_MESH_CLEAR                 # Unloading net beds
    {% set t = printer.save_variables.variables.box_modify_t0|int %}
    SAVE_VARIABLE VARIABLE=box_modify_t0  value=0
    M140 S{BED}
    M109 S{140} T0
    G28 
    M190 S{BED}
    {% if "gcode_macro _WM_BED_SOAK" in printer %}
        _WM_BED_SOAK BED={BED}         # bed warp wait: the plate stops bending before the wipe and the mesh (switch Bed_Warp_Stabilisation)
    {% endif %}
    WIPE_NOZZLE                    # T0 is the Z reference of the whole print, wipe it once more right before the mesh
    {% if adaptive_mesh_enable == True %}                              
        {% if adaptive_mesh == True %}
            # M118 adaptive_mesh:{adaptive_mesh}
            #SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh VALUE=1
            {action_respond_info("adaptive_mesh: %s" % adaptive_mesh) }
            BED_MESH_CALIBRATE PROFILE=adaptive_mesh MESH_MIN={MESH_MIN_X},{MESH_MIN_Y} MESH_MAX={MESH_MAX_X},{MESH_MAX_Y} PROBE_COUNT={PROBE_COUNT_X},{PROBE_COUNT_Y} #ADAPTIVE=0 #ALGORITHM=[bed_mesh_algo] #ADAPTIVE_MARGIN=0
            M118 START_PRINT adaptive_mesh
        {% elif params.ADAPTIVE is defined and params.ADAPTIVE|int == 1 %} #use klipper adaptive_mesh
            {% if params.ADAPTIVE_MARGIN is defined %}
                BED_MESH_CALIBRATE ADAPTIVE={params.ADAPTIVE} ADAPTIVE_MARGIN={params.ADAPTIVE_MARGIN}
            {% else %}
                BED_MESH_CALIBRATE ADAPTIVE={params.ADAPTIVE}
            {% endif %}
        {% else %}
            BED_MESH_CALIBRATE
            M118 START_PRINT default_mesh
        {% endif %}
    {% else %}
        BED_MESH_PROFILE LOAD="default"
    {% endif %}
    M104 S0 T0
    M400

    SAVE_VARIABLE VARIABLE=box_modify_t0  value={t}
    # print start purge (item 32, F-105, rpi_base.cfg): 20 mm + wipe at the wipe area for every used toolhead (the first tool last), then the KAMP line in front of the parts
    # F-186: the old factory left-edge purge fallback is removed, one purge only
    _WM_START_PURGE INITIAL_TOOL={INITIAL_TOOL} EXTRUDER={EXTRUDER}

    T{INITIAL_TOOL} 
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh_enable VALUE={True}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=True
    M118 START_PRINT finished

[gcode_macro PRINT_END]            # Set PRINT_END as the end-of-print macro to customise the after-print action.
gcode:
    RESPOND MSG="Print finished. Cooling down and parking."
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL} #ACCEL_TO_DECEL={RUN_DECEL}
    M220 S100
    M400                           

    {% if "z" in printer.toolhead.homed_axes %}
        {% set z_max = printer.configfile.settings.stepper_z.position_endstop|int %}
        {% set current_z = printer.gcode_move.position.z|int %}
        G90
        {% if (current_z+100) < z_max %}
            G1 Z{current_z+100} F6000
        {% else %}
            G1 Z{z_max} F6000
        {% endif %}
    {% endif %}
    
    TURN_OFF_HEATERS             # Close the hot end
    M107                           # Switch off the fan.
    G90                            # absolute positioning
    BED_MESH_CLEAR               # Unloading net beds
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh VALUE=0
    WIPE_NOZZLE                    # to the wiper area (saved wipe position, default Y240 X-13) and wipe
    PARK_CURRENT_TOOL              # tool into its dock
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=False
    M84
    RESET_FLOW_EXTRUDER
    {% if not printer.virtual_sdcard.is_active %}
        SDCARD_RESET_FILE          # only when PRINT_END is not running from the print file (Klipper refuses it there)
    {% endif %}
    SAVE_VARIABLE VARIABLE=box_modify_t0 VALUE=0
    SAVE_VARIABLE VARIABLE=box_modify_t1 VALUE=1
    SAVE_VARIABLE VARIABLE=box_modify_t2 VALUE=2
    SAVE_VARIABLE VARIABLE=box_modify_t3 VALUE=3
    # the saved copies too (RESUME reads them): after an endless spool swap they still pointed the tool at the spare head
    {% for i in range(4) %}
        SAVE_VARIABLE VARIABLE=box_modify_t{i}_backup VALUE={i}
    {% endfor %}
    

[gcode_macro E_axis_move]
gcode:
    {% set len = params.L|default(0)|int %}
    {% set speed = params.S|default(10000)|int %}
    G91
    M83
    {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %} 
        G1 E{len} F{speed}
        M118 G1 E{len} F{speed}
    {% endif %}
    G90




[gcode_macro _WM_PAUSE_STATE]
description: Remembers that PAUSE already ran for this pause. Running it clears a flag that is left over (WM_PRINT_END_WATCH runs it)
variable_active: 0
gcode:
    {% if active|int == 1 and printer.print_stats.state != "paused" %}
        SET_GCODE_VARIABLE MACRO=_WM_PAUSE_STATE VARIABLE=active VALUE=0
    {% endif %}

[gcode_macro _WM_LOG_STATE]
description: Support log: writes one line (tool, G-code position, head position, offsets, heaters, state) that the log digest copies into wm-events.log. Called by PAUSE, RESUME and CANCEL_PRINT
gcode:
    {% set what = params.WHAT|default("STATE") %}
    {% set cur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% set gm = printer.gcode_move %}
    {% set th = printer.toolhead %}
    {% set en = "extruder" if cur == 0 else "extruder%d" % cur %}
    {% set nt = printer[en].temperature|round(0)|int if en in printer else 0 %}
    {% set ng = printer[en].target|round(0)|int if en in printer else 0 %}
    {% set bt = printer.heater_bed.temperature|round(0)|int if "heater_bed" in printer else 0 %}
    {% set bg = printer.heater_bed.target|round(0)|int if "heater_bed" in printer else 0 %}
    {% set hd = th.homed_axes if th.homed_axes else "none" %}
    RESPOND MSG="WMLOG {what} T{cur} gcode X{"%.2f"|format(gm.gcode_position.x)} Y{"%.2f"|format(gm.gcode_position.y)} Z{"%.2f"|format(gm.gcode_position.z)} head X{"%.2f"|format(th.position.x)} Y{"%.2f"|format(th.position.y)} Z{"%.2f"|format(th.position.z)} offset X{"%.2f"|format(gm.homing_origin.x)} Y{"%.2f"|format(gm.homing_origin.y)} Z{"%.2f"|format(gm.homing_origin.z)} homed {hd} nozzle {nt}/{ng} bed {bt}/{bg} speed {(gm.speed_factor * 100)|round(0)|int}% state {printer.print_stats.state}"

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% if printer["gcode_macro _WM_PAUSE_STATE"].active|int == 1 and printer.print_stats.state == "paused" %}
        RESPOND MSG="The print is already paused. PAUSE ignored"
    {% else %}
    SET_GCODE_VARIABLE MACRO=_WM_PAUSE_STATE VARIABLE=active VALUE=1
    RESPOND MSG="Print paused. Parking the tool head."
    # F-166: remember the print's tool (the one on the carriage now); RESUME puts it back if a load or unload while paused moved it
    SAVE_VARIABLE VARIABLE=wm_pause_tool VALUE={printer.save_variables.variables.current_extruder|default(99)|int}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% set x_park = params.X|default(150)|int %} 
    {% set y_park = params.Y|default(1)|int %} 
    {% if thr_number == 1 %}
        {% set current_temp0 = printer.extruder.target %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature0 VALUE={current_temp0}
    {% elif thr_number == 2 %}
        {% set current_temp0 = printer.extruder.target %}
        {% set current_temp1 = printer.extruder1.target %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature0 VALUE={current_temp0}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature1 VALUE={current_temp1}
    {% elif thr_number == 3 %}
        {% set current_temp0 = printer.extruder.target %}
        {% set current_temp1 = printer.extruder1.target %}
        {% set current_temp2 = printer.extruder2.target %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature0 VALUE={current_temp0}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature1 VALUE={current_temp1}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature2 VALUE={current_temp2}
    {% elif thr_number == 4 %}
        {% set current_temp0 = printer.extruder.target %}
        {% set current_temp1 = printer.extruder1.target %}
        {% set current_temp2 = printer.extruder2.target %}
        {% set current_temp3 = printer.extruder3.target %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature0 VALUE={current_temp0}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature1 VALUE={current_temp1}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature2 VALUE={current_temp2}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature3 VALUE={current_temp3}
    {% endif %}
    {% set current_bed = printer["heater_bed"].temperature %}
    {% set z = params.Z|default(10)|int %}                                                   
    {% set e = params.E|default(2.5) %} 
    
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=fan VALUE={printer["fan"].speed*255}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=afan VALUE={printer["fan_generic auxiliary_fan"].speed*255}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_bed VALUE={current_bed}
    {% if 'fan_generic air_fan' in printer %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=airfan VALUE={printer["fan_generic air_fan"].speed*255}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                             
    SAVE_GCODE_STATE NAME=PAUSE                                                                  
    _WM_LOG_STATE WHAT=PAUSE_START
    M25                                                                              
    {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       
        E_axis_move L=-{e} S={2100}
        G91
        G1 Z{z} F900
        G90
        G1 X{x_park} Y{y_park} F6000                                                                     
    {% else %}
        E_axis_move L=-{e} S={2100}
        G1 X{x_park} Y{y_park} F6000  
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
    {% endif %}
    SAVE_GCODE_STATE NAME=PAUSEPARK
    G90
    E_axis_move L={e} S={2100}     
    
    # keep the tool map of this print for RESUME (only once START_PRINT is done: it changes box_modify_t0 for a moment)
    {% if printer["gcode_macro START_PRINT"].print_body_ready %}
        {% for i in range(4) %}
            SAVE_VARIABLE VARIABLE=box_modify_t{i}_backup VALUE={printer.save_variables.variables["box_modify_t%d" % i]|default(i)|int}
        {% endfor %}
    {% endif %}
    # restore the identity mapping first, then turn heaters off, so that when remapped M104 Tx does not miss or wrongly switch off a physical head
    SAVE_VARIABLE VARIABLE=box_modify_t0 VALUE=0
    SAVE_VARIABLE VARIABLE=box_modify_t1 VALUE=1
    SAVE_VARIABLE VARIABLE=box_modify_t2 VALUE=2
    SAVE_VARIABLE VARIABLE=box_modify_t3 VALUE=3
    {% for i in range(thr_number) %}
        M104 S0 T{i}
    {% endfor %}
    M106 S0
    M106 P2 S0
    SET_STEPPER_ENABLE STEPPER={printer.toolhead.extruder} ENABLE=0
    _WM_LOG_STATE WHAT=PAUSE_PARKED
    {% endif %}


[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_resume_temperature0: 240
variable_resume_temperature1: 240
variable_resume_temperature2: 240
variable_resume_temperature3: 240
variable_resume_bed: 60
variable_zhop: 0
variable_etemp: 0
variable_fan:0.0
variable_afan: 0.0
variable_airfan: 0.0
gcode:
    {% if printer.print_stats.state != "paused" %}
        RESPOND MSG="Nothing to resume. The print is not paused"
    {% else %}
    RESPOND MSG="Resuming the print. Heating the bed and nozzles first."
    _WM_LOG_STATE WHAT=RESUME_START
    # F-166: the print's tool (saved by PAUSE) must be on the carriage with filament in its head sensor before anything heats or moves
    {% set pt = printer.save_variables.variables.wm_pause_tool|default(99)|int %}
    {% set pcur = printer.save_variables.variables.current_extruder|default(99)|int %}
    {% if pt >= 0 and pt <= 3 %}
        {% set psk = "filament_switch_sensor filament%d" % pt %}
        {% if psk in printer and not printer[psk].filament_detected %}
            {action_raise_error("RESUME: T%d has no filament in its head. Load it first (unload/load while paused), then RESUME again" % pt)}
        {% elif pcur != pt %}
            RESPOND MSG="RESUME: T{pt} is not on the carriage, picking it up"
            _CHANGE_TOOL T={pt}
        {% endif %}
    {% endif %}
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    M118 resume_temperature0 = {resume_temperature0}
    M118 resume_temperature1 = {resume_temperature1}
    M118 resume_temperature2 = {resume_temperature2}
    M118 resume_temperature3 = {resume_temperature3}
    {% if printer['heater_bed'].target < resume_bed %} 
        M190 S{resume_bed} 
    {% endif %}

    # F-164: the tool on the carriage heats at the purge location (cold move first), not at the pause park spot
    {% if "gcode_macro _WM_PURGE_LOCATION" in printer %}
        _WM_PURGE_LOCATION
    {% elif "gcode_macro _WM_GO_WIPE" in printer %}
        _WM_GO_WIPE
    {% endif %}
    {% if thr_number == 1 %}
        M104 S{resume_temperature0} T0
        M109 S{resume_temperature0} T0
    {% elif thr_number == 2 %}
        M104 S{resume_temperature0} T0
        M104 S{resume_temperature1} T1
        M109 S{resume_temperature0} T0
        M109 S{resume_temperature1} T1
    {% elif thr_number == 3 %}
        M104 S{resume_temperature0} T0
        M104 S{resume_temperature1} T1
        M104 S{resume_temperature2} T2
        M109 S{resume_temperature0} T0
        M109 S{resume_temperature1} T1
        M109 S{resume_temperature2} T2
    {% elif thr_number == 4 %}
        M104 S{resume_temperature0} T0
        M104 S{resume_temperature1} T1
        M104 S{resume_temperature2} T2
        M104 S{resume_temperature3} T3
        M109 S{resume_temperature0} T0
        M109 S{resume_temperature1} T1
        M109 S{resume_temperature2} T2
        M109 S{resume_temperature3} T3
    {% endif %}

    # restore the temperature first, then restore the mapping
    {% set value0 = printer.save_variables.variables.box_modify_t0_backup %}
    {% set value1 = printer.save_variables.variables.box_modify_t1_backup %}
    {% set value2 = printer.save_variables.variables.box_modify_t2_backup %}
    {% set value3 = printer.save_variables.variables.box_modify_t3_backup %}
    SAVE_VARIABLE VARIABLE=box_modify_t0 VALUE={value0}
    SAVE_VARIABLE VARIABLE=box_modify_t1 VALUE={value1}
    SAVE_VARIABLE VARIABLE=box_modify_t2 VALUE={value2}
    SAVE_VARIABLE VARIABLE=box_modify_t3 VALUE={value3}

    {% set e = params.E|default(2.5)|int %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    E_axis_move L=-{e} S=900
    # RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100

    # prime the nozzle next to the wiper: purge a little, then wipe it off (10 mm at 300 mm/min, no retract yet)
    {% set pr_t = printer.save_variables.variables.current_extruder|int %}
    {% set pr_ace = pr_t < 4 and "gcode_macro _WM_ACE" in printer and printer["gcode_macro _WM_ACE"].mode == "idle" and ("ace_instance_" ~ printer["gcode_macro _WM_ACE"].ace_instance) in printer %}
    {% if pr_ace %}
        _ACE_WM_ASSIST T={pr_t} STATE=on
    {% endif %}
    # F-164/F-187: the purge is at the purge location (X-13 Y80), the wiper (WIPE_NOZZLE) comes after it; no own-position fallback
    _WM_PURGE_LOCATION
    M400
    # F-166: purge length = 20 mm, or the length chosen in WM_RESUME_TOOL
    {% set pl = printer["gcode_macro _WM_RTOOL"].purge|default(20)|int if "gcode_macro _WM_RTOOL" in printer else 20 %}
    E_axis_move L={pl} S=300    # purge before the print continues (factory 10 mm)
    M400
    WIPE_NOZZLE
    G0 Y200 F12000
    M400
    M106 S{fan}
    M106 P2 S{afan}
    M106 P3 S{airfan}
    RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60 
    {% if "gcode_macro _WM_LIVEZ" in printer %}
        _WM_Z_TRIM_APPLY
    {% endif %}
    _WM_LOG_STATE WHAT=RESUME_DONE
    M24
    SET_GCODE_VARIABLE MACRO=_WM_PAUSE_STATE VARIABLE=active VALUE=0
    {% if pr_ace %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=manual VALUE=-2
    {% endif %}
    RESPOND MSG="Print resumed"
    {% endif %}


[gcode_macro CANCEL_PRINT]
variable_runout_detected: 0
rename_existing: BASE_CANCEL_PRINT
gcode:
    RESPOND MSG="Print cancelled. Heaters and fans off."
    _WM_LOG_STATE WHAT=CANCEL_START
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL}
    M220 S100
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} 
    M400                                        ; wait for buffer to clear
    G92 E0                                    ; zero the extruder
    {% if printer.save_variables.variables.current_extruder == 0 %} 
     {% set current_temp = printer['extruder'].target %}
    {% endif %}
    {% if printer.save_variables.variables.current_extruder == 1 %} 
      {% set current_temp = printer['extruder1'].target %}
    {% endif %}
    {% if printer.save_variables.variables.current_extruder == 2 %} 
     {% set current_temp = printer['extruder2'].target %}
    {% endif %}
    {% if printer.save_variables.variables.current_extruder == 3 %} 
      {% set current_temp = printer['extruder3'].target %}
    {% endif %}
    E_axis_move L=-1 S=1200
    TURN_OFF_HEATERS
    M107                                        ; turn off fan

    {% if "z" in printer.toolhead.homed_axes %}
        {% set z_max = printer.configfile.settings.stepper_z.position_endstop|int %}
        {% set current_z = printer.gcode_move.position.z|int %}
        G90
        {% if (current_z+100) < z_max %}
            G1 Z{current_z+100} F6000
        {% else %}
            G1 Z{z_max} F6000
        {% endif %}
    {% endif %}

    WIPE_NOZZLE                    # to the wiper area (saved wipe position, default Y240 X-13) and wipe
    PARK_CURRENT_TOOL              # tool into its dock
    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh VALUE=0
    M84
    RESET_FLOW_EXTRUDER
    SAVE_VARIABLE VARIABLE=box_modify_t0 VALUE=0
    SAVE_VARIABLE VARIABLE=box_modify_t1 VALUE=1
    SAVE_VARIABLE VARIABLE=box_modify_t2 VALUE=2
    SAVE_VARIABLE VARIABLE=box_modify_t3 VALUE=3
    # the saved copies too (RESUME reads them): after an endless spool swap they still pointed the tool at the spare head
    {% for i in range(4) %}
        SAVE_VARIABLE VARIABLE=box_modify_t{i}_backup VALUE={i}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=False
    _WM_LOG_STATE WHAT=CANCEL_DONE
    SDCARD_RESET_FILE


[gcode_macro PROBE_CALIBRATE]
description: Z offset calibration, please enable bed preheating first
rename_existing: PROBE_CALIBRATE_BASE
gcode:
    BED_MESH_CLEAR
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% else %}
        G90 
        G1 Z5 F15000
    {% endif %}   
    G1 X150 Y150 F3000
    PROBE_CALIBRATE_BASE

[gcode_macro G29]
variable_bed_leveling: False
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=bed_leveling VALUE={True}
    G28 X Y
    M400
    M140 S55
    # save the current tool state
    {% set original_tool = printer.save_variables.variables.current_extruder|default(-1)|int %}
    
    # check and make sure the T0 extruder is picked up
    {% if original_tool != 0 %}
        M118 T0 extruder not grabbed, grabbing now...
        T0                     # pick up the T0 extruder
        # G28                    # home
    {% else %}
        M118 T0 extruder already grabbed
    {% endif %}

    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 Z
    {% endif %}
    # F-150: the nozzle heats and is wiped at the wipe position (before: it heated at the bed centre)
    {% if "gcode_macro _WM_GO_WIPE" in printer %}
        _WM_GO_WIPE
    {% else %}
        G1 X150 Y135 F3000
    {% endif %}
    M104 S140            # set the nozzle target temperature to 140 degrees (no wait)
    # G28  Z
       
    M118 The bed and nozzle are heating up
    M190 S55
    M109 S140            # set the nozzle temperature to 140 degrees and wait until it is reached (blocking wait)
    WIPE_NOZZLE 
    M118 {(printer.configfile.settings.bed_mesh.probe_count[0] * printer.configfile.settings.bed_mesh.probe_count[1])|int}-point calibration is in progress
    BED_MESH_CALIBRATE
    M104 S0              # turn the nozzle heater off, set to 0 C
    M118 Calibration completed, nozzle cooling down
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=bed_leveling VALUE={False}
  
[gcode_macro G30]
gcode:
       SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh_enable VALUE={True}

[gcode_macro G31]
gcode:
       SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh_enable VALUE={False}


[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    {%if params.MESH_MIN is defined %}
        {% set START_POINT = params.MESH_MIN.split(',') %}
        {% set START_POINT_X = START_POINT[0]|float %}
        {% set START_POINT_Y = START_POINT[1]|float %}
    {% else %}
        {% set START_POINT_X = printer.configfile.settings.bed_mesh.mesh_min[0]|float %}
        {% set START_POINT_Y = printer.configfile.settings.bed_mesh.mesh_min[1]|float %}
    {% endif %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% else %} 
    {% endif %}
    G90 
    G1 Z7 F15000
    G1 Y{START_POINT_Y} F15000
    G1 X{START_POINT_X} F15000
    BED_MESH_CALIBRATE_BASE {rawparams}


[gcode_macro M109]
rename_existing = M99109
gcode = 
    {% set s = params.S|default(0)|float %}
    {% if 'T' in params %}
        {% set T = params.T|int %}
        {% if T == 0 %}
            {% set t = printer.save_variables.variables.box_modify_t0|int %}
        {% elif T == 1 %}
            {% set t = printer.save_variables.variables.box_modify_t1|int %}
        {% elif T == 2 %}
            {% set t = printer.save_variables.variables.box_modify_t2|int %}
        {% elif T == 3 %}
            {% set t = printer.save_variables.variables.box_modify_t3|int %}
        {% else %}
            {% set t = T %}
        {% endif %}
    {% else %}
        {% set active = printer.toolhead.extruder %}
        {% set t = 0 if active == 'extruder' else active|replace('extruder','')|int %}
    {% endif %}
    {% set heater = 'extruder' if t == 0 else 'extruder' ~ t %}
    # F-164: in a print the cold nozzle first goes to the purge location, and only then is the heater set (no drip on the part on the way)
    {% if s > 0 and "gcode_macro _WM_HEAT_AT_WIPE" in printer %}
        _WM_HEAT_AT_WIPE T={t} S={s}       # in a print: the nozzle on the carriage heats at the purge location (rpi_base.cfg)
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={s}
    {% if "gcode_macro _WM_LIVEZ_HEAT" in printer %}
        _WM_LIVEZ_HEAT T={t} S={s}
    {% endif %}
    {% if s > 0 %}
        TEMPERATURE_WAIT SENSOR={heater} MINIMUM={s-2.5} MAXIMUM={s+2.5}
        {% if "gcode_macro _WM_HEAT_BACK" in printer %}
            _WM_HEAT_BACK
        {% endif %}
    {% endif %}
	


[gcode_macro M104]
rename_existing = M99104
gcode = 
    {% set s = params.S|default(0)|float %}
    {% if 'T' in params %}
        {% set T = params.T|int %}
        {% if T == 0 %}
            {% set t = printer.save_variables.variables.box_modify_t0|int %}
        {% elif T == 1 %}
            {% set t = printer.save_variables.variables.box_modify_t1|int %}
        {% elif T == 2 %}
            {% set t = printer.save_variables.variables.box_modify_t2|int %}
        {% elif T == 3 %}
            {% set t = printer.save_variables.variables.box_modify_t3|int %}
        {% else %}
            {% set t = T %}
        {% endif %}
    {% else %}
        {% set active = printer.toolhead.extruder %}
        {% set t = 0 if active == 'extruder' else active|replace('extruder','')|int %}
    {% endif %}
    {% if t == 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={s}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder{t} TARGET={s}
    {% endif %}
    {% if "gcode_macro _WM_LIVEZ_HEAT" in printer %}
        _WM_LIVEZ_HEAT T={t} S={s}
    {% endif %}
	

[gcode_macro M190]
rename_existing = M99190
gcode = 
	
	{% set s = params.S|float %}
	
	M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
	{% if s != 0 %}
	TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1} MAXIMUM={s+1}
	{% endif %}

[gcode_macro M106]
rename_existing = M99106
gcode = 
	{% set s = (params.S|default(0)|int) %}
	{% set speed = s / 255 %}
    {% set p = params.P|default(0)|int %}

    {% if p == 0 %}
        M99106 S{s}
    {% elif p == 2 %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED={speed}
    {% elif p == 3 and 'fan_generic air_fan' in printer %}
        SET_FAN_SPEED FAN=air_fan SPEED={speed}
    {% endif %}

[gcode_macro M107]    #added a macro to turn off all fans:M107,used when cancelling and when ending a print
rename_existing: M1077
gcode:  
    M106  S0
    M106 P2 S0
    M106 P3 S0

[gcode_macro M141]
gcode:
    {% if 'heater_generic chamber' in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|default(0)}
    {% endif %}

[gcode_macro M191]
# Chamber heating, e.g. in Orca's Machine start G-code: M191 S[chamber_temperature] BED_TEMP=[bed_temperature_initial_layer_single]
# While it waits: the part fan and the auxiliary fan circulate the air, the nozzle on the carriage is warmed up and the bed helps heating.
# The fans and the nozzle are switched off again at the end (START_PRINT sets its own temperatures afterwards).
variable_max_chamber: 65             # C, the same limit as _ZR_CHAMBER
variable_part_fan_speed: 0.5         # 0.0 - 1.0 while waiting, 0 = off  ([fan], M106 S)
variable_aux_fan_speed: 1.0          # 0.0 - 1.0 while waiting, 0 = off  (auxiliary_fan)
variable_extruder_preheat_temp: 150  # C for the nozzle on the carriage while waiting, 0 = off
variable_bed_assist_temp: 100          # C for the bed while waiting when the slicer sends no BED_TEMP=, 0 = off
gcode:
    {% set s = params.S|default(0)|float %}
    # Klipper reads BED_TEMP=65 on an M command as the text "=65", so the "=" is removed before the number is read
    {% set bed = params.BED_TEMP|default(bed_assist_temp)|string|replace("=", "")|float(bed_assist_temp|float) %}
    {% if s == 0 %}
        # If target temperature is 0, do nothing
        M117 Chamber heating cancelled
    {% elif s > max_chamber %}
        {action_raise_error("M191: the maximum chamber temperature is %d C" % max_chamber)}
    {% elif 'heater_generic chamber' in printer %}
        {% if part_fan_speed > 0 %}
            M106 S{(part_fan_speed * 255)|int}
        {% endif %}
        {% if aux_fan_speed > 0 %}
            SET_FAN_SPEED FAN=auxiliary_fan SPEED={aux_fan_speed}
        {% endif %}
        {% if extruder_preheat_temp > 0 %}
            M104 S{extruder_preheat_temp}
        {% endif %}
        {% if bed > 0 %}
            M140 S{bed}
        {% endif %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={s}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={s-1} MAXIMUM={s+1}
        M117 Chamber at target temperature
        {% if part_fan_speed > 0 %}
            M106 S0
        {% endif %}
        {% if aux_fan_speed > 0 %}
            SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
        {% endif %}
        {% if extruder_preheat_temp > 0 %}
            M104 S0
        {% endif %}
    {% endif %}


