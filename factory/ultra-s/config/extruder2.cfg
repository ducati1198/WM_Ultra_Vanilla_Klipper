[include wm_zru_thr2.cfg]



[tmc2209 extruder2]
uart_pin:T2:PB3
run_current: 0.6
# hold_current: 0.5
interpolate: True
stealthchop_threshold: 0

[verify_heater extruder2]
max_error: 120
check_gain_time:30
hysteresis: 10
heating_gain: 2

[heater_fan hotend2_fan]
pin: T2:PB6
heater: extruder2
heater_temp: 70.0

[filament_switch_sensor filament2]
pause_on_runout: False                    # must be changed to False
switch_pin: T2:PC13
event_delay: 0.5
runout_gcode:
    {% if printer.print_stats.state == "printing" %}
        RESPOND MSG="Filament runout detected, pausing in 2.5 seconds..."
        UPDATE_DELAYED_GCODE ID=delayed_pause2 DURATION=2.5
    {% endif %}

insert_gcode:
    _WM_ACE_HEAD T=2
    {% set printer_state = printer.print_stats.state %}
    {% if "gcode_macro _WM_HEAD_MARK" in printer %}
        _WM_HEAD_MARK T=2             # tells the head sensor watcher that Klipper started this load (rpi_head_sensors.cfg)
    {% endif %}
    {% set bed_leveling = printer["gcode_macro G29"].bed_leveling|default(False) %}
    {% set idle_state = printer.idle_timeout.state %}
    {% if printer_state != "printing" and not (bed_leveling and idle_state == "Printing") %} 
        { action_respond_info("Push filament until resistance is felt after blue light turns on (Load operation required before printing)!") }
        UPDATE_DELAYED_GCODE ID=delayed_pause2 DURATION=0    # cancel the delayed pause, so it does not pause by mistake after insertion
        ACTIVATE_EXTRUDER EXTRUDER=extruder2
        SAVE_VARIABLE VARIABLE=if_check_extruder_status value=0
        _WM_ACE_GRAB T=2
        filament_insert
        SAVE_VARIABLE VARIABLE=if_check_extruder_status value=1
        M104 S220 T2
        T2
        M109 S220 T2
        filament_insert_gcode T=2
        M104 S0 T2
        # F-166: while a print is paused the print's tool stays on the carriage after its load (RESUME continues with it); any other tool is parked
        {% if printer.print_stats.state == "paused" and printer.save_variables.variables.wm_pause_tool|default(99)|int == 2 %}
            RESPOND MSG="T2 loaded: it is the print's tool, it stays on the carriage until RESUME"
        {% else %}
            PARK_CURRENT_TOOL
        {% endif %}
        _WM_ACE_HEAD_DONE T=2
    {% endif %}

[delayed_gcode delayed_pause2]
gcode:
    RESPOND MSG="2.5 seconds completed, pausing now"
    PAUSE

    
[filament_switch_sensor docked2]
pause_on_runout: False
runout_gcode: 
insert_gcode: 
switch_pin: T2:PB12

[neopixel T2_RGB]
pin: T2:PB9

