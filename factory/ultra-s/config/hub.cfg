[include wm_zru_hub.cfg]


# F-283: pause_on_runout is off: Klipper counts a running macro (an ACE unload) as printing and paused it when the filament passed the hub.
# The runout_gcode pauses only a real print.
[filament_switch_sensor path_0]
switch_pin: !HUB:PC13
pause_on_runout: False
runout_gcode:
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="Filament tangle on T0 (tool 1): the filament is pulled tight. The print is paused. Free the filament, then resume."
    {% endif %}
    {% if "gcode_macro _WM_ENDLESS_TANGLE" in printer %}
        _WM_ENDLESS_TANGLE T=0
    {% endif %}

