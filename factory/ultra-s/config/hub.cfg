[include wm_zru_hub.cfg]


[filament_switch_sensor path_0]
switch_pin: !HUB:PC13
pause_on_runout: True
runout_gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="Filament runout on path 0 (tool 1). The print is paused."
    {% endif %}

