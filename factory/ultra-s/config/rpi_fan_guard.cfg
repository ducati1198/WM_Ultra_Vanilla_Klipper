# Fan failure guard (WonderMaker Ultra/Ultra-S on a Raspberry Pi).
# Replaces the factory's patched fan.py check with plain Klipper macros: if a fan that is switched on
# reports 0 RPM for 30 seconds, show an error and pause the print. Works with stock fan.py.
# Only fans that have a tachometer_pin are checked. On an Ultra (no zru-s.cfg include) only the part cooling fan is checked; on an Ultra-S the auxiliary fan is checked too. Nothing in zru-s.cfg (chamber fans, air filter fan) is ever checked. Set `variable_enabled: 0` to switch the guard off.

[gcode_macro _WM_FAN_GUARD_STATE]
variable_enabled: 1
variable_interval: 5
variable_limit: 30
variable_zero: {}
gcode:

[delayed_gcode WM_FAN_GUARD]
initial_duration: 15
gcode:
    {% set st = printer["gcode_macro _WM_FAN_GUARD_STATE"] %}
    {% set new = {} %}
    {% set names = {"fan": "Part cooling fan"} %}
    {% if "fan_generic air_fan" in printer %}
        {% set _ = names.update({"fan_generic auxiliary_fan": "Auxiliary fan"}) %}
    {% endif %}
    {% if st.enabled|int == 1 %}
        {% for key in names %}
            {% if key in printer %}
                {% set f = printer[key] %}
                {% set was = st.zero.get(key, 0)|int %}
                {% if f.speed|float > 0 and f.rpm is not none and f.rpm|float == 0 %}
                    {% set now = was + 1 if was < 1000 else was %}
                    {% if was < 1000 and now * st.interval|int >= st.limit|int %}
                        {% set now = 1000 %}
                        RESPOND TYPE=error MSG="{names[key]} is on but reports 0 RPM. Check it for debris and the cable."
                        {% if printer.print_stats.state == "printing" %}
                            PAUSE
                        {% endif %}
                    {% endif %}
                    {% set _ = new.update({key: now}) %}
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_FAN_GUARD_STATE VARIABLE=zero VALUE="{new}"
    UPDATE_DELAYED_GCODE ID=WM_FAN_GUARD DURATION={st.interval|int}
