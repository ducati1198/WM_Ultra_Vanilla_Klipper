#date:2025/12/25


[gcode_macro WIPE_NOZZLE]
variable_wipe_speed: 12000  # mm/min for the fast wipe strokes (200 mm/s, factory 3000)
variable_slow_speed: 3000   # F-267: mm/min for the slow strokes (50 mm/s = factory speed)
gcode:
    z_rise
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    {% set slow_speed = printer['gcode_macro WIPE_NOZZLE'].slow_speed|int %}
    {% set wipe_pos = printer.save_variables.variables.wipe_position|default([-13.0, 240.0]) %}
    {% set wipe_x = wipe_pos[0] %}
    {% set wipe_y = wipe_pos[1] %}
    {% set wipe_y_end = wipe_y + 35 %}
    {% set ce = printer.save_variables.variables.current_extruder|int %}
    # F-267: STYLE=SWITCH (only the macros outside a print pass it) follows the Fluidd switch Wipe_Slow_Fast:
    # ON = strokes 1-2 slow, strokes 3-4 fast; OFF = all 4 strokes fast (as before). No parameter or a print running = as before.
    {% set in_print = printer.print_stats.state in ['printing', 'paused'] %}
    {% set slowfast = (params.STYLE|default('')|upper == 'SWITCH') and (not in_print) and ("output_pin Wipe_Slow_Fast" in printer) and (printer["output_pin Wipe_Slow_Fast"].value|int == 1) %}
    RESPOND MSG="Wipe nozzle: {'T' ~ (ce + 1) if ce < 4 else 'the tool'} goes to the wipe area (X{wipe_x} Y{wipe_y})"
    SAVE_GCODE_STATE NAME=_wm_wipe
    _WM_CAL_CLEARANCE
    G90
    G0 Y{wipe_y} F12000
    G0 X{wipe_x} F12000

    {% for I in range(1, 5) %}
        {% set sp = slow_speed if (slowfast and I <= 2) else wipe_speed %}
        G0 Y{wipe_y} F{sp}
        G0 Y{wipe_y_end} F{sp}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=_wm_wipe
    RESPOND MSG="Wipe nozzle done"


[gcode_macro _SAVE_WIPE_POSITION]
gcode:
    {% set position_x, position_y, position_z = printer.custom_hall.last_toolhead_position %}
    {% if position_x == 0 and position_y == 0 %}
        { action_respond_info("RUN GET_T_POSITION FIRST") }
    {% else %}
        SAVE_VARIABLE VARIABLE=wipe_position VALUE={position_x},{position_y}
        { action_respond_info("SAVE WIPE POSITION X:%f Y:%f" % (position_x, position_y)) }
    {% endif %}

[gcode_macro CALIBRATE_WIPE_POSITION]
gcode:
    GET_T_POSITION
    _SAVE_WIPE_POSITION
